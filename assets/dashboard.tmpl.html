<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity cockpit</title>
<style>
/*@app tokens.css*/
/*@app base.css*/
/*@app components.css*/
</style>

<div class="shell">
<!-- The rail is the page's one navigation. It used to be a row of buttons at
     the right end of a header that also carried every fact about the book, so
     the header wrapped whenever the facts grew and the nav moved with it. Now
     the views sit in a fixed place and the header carries one status line. -->
<aside class="side" id="side">
  <div class="sbrand"><span class="brand">EQUITY COCKPIT</span></div>
  <div class="sval">
    <span class="big" id="t-value">—</span>
    <span class="chip" id="t-pl"></span>
  </div>
  <nav class="vnav" id="vnav">
    <button class="vbtn" data-view="home" aria-pressed="true" title="Home (1)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="l">Home</span><kbd>1</kbd></button>
    <button class="vbtn" data-view="holdings" aria-pressed="false" title="Holdings (2)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M8 9v11"/></svg><span class="l">Holdings</span><kbd>2</kbd></button>
    <button class="vbtn" data-view="positions" aria-pressed="false" title="Position detail (3)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="l">Positions</span><kbd>3</kbd></button>
    <button class="vbtn" data-view="overview" aria-pressed="false" title="Allocation (4)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="10" height="11" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="15" y="11" width="6" height="10" rx="1"/><rect x="3" y="16" width="10" height="5" rx="1"/></svg><span class="l">Allocation</span><kbd>4</kbd></button>
  </nav>
  <div class="sfoot">
  <!-- Data is a drawer, not a view, so it sits outside the nav above and says
       aria-expanded rather than aria-pressed - the difference between "this
       surface is showing" and "you are on this tab". -->
  <button class="sbtn drawer" id="t-sheet" aria-expanded="false"
    aria-controls="sheet" title="All data (D)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M9 4v16"/></svg><span class="l">All data</span></button>
  <!-- One box that reaches everything: every held and watched name, the views
       and each drawer section. -->
  <button class="sbtn" id="t-jump" aria-haspopup="dialog" aria-controls="pal"
    title="Find a position or a section. Keys: Ctrl K or / to open, 1 Home, 2 Holdings, 3 Positions, 4 Allocation, D the data drawer, Esc to close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="l">Jump to&hellip;</span><kbd>Ctrl K</kbd></button>
  <!-- Label and pressed state are both set by themeLabel() at boot, from what
       is actually rendered. This text is only what shows if the script dies. -->
  <button class="sbtn" id="t-theme" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg><span class="l">Theme</span></button>
  </div>
</aside>
<div class="main">
<!-- One line of status. The dot is the worst thing true right now; hovering it
     names everything that went into it. -->
<header class="tape">
  <span class="dot sdot" id="t-dot"></span>
  <span class="chip" id="t-meta"></span>
</header>
<div id="t-banner"></div>
<div class="pal" id="pal" role="dialog" aria-label="Jump to" hidden>
  <div class="palbox">
    <input id="palq" type="search" autocomplete="off" spellcheck="false"
      placeholder="Ticker, company or section" aria-controls="pallist">
    <div class="pallist" id="pallist" role="listbox"></div>
    <div class="palfoot">&uarr;&darr; move &middot; Enter open &middot; Esc close
      &middot; elsewhere: 1 Home &middot; 2 Holdings &middot; 3 Positions &middot; 4 Allocation &middot; D data drawer
      &middot; &uarr;&darr; step the rail</div>
  </div>
</div>

<div class="view" id="v-home">
  <div class="home" id="home"></div>
</div>
<div class="view" id="v-holdings" hidden>
  <div class="hold" id="holdings"></div>
</div>
<div class="view" id="v-overview" hidden>
  <div class="ov">
    <div class="ovtop" id="ovtop"></div>
    <div class="ovgrid" id="ovgrid"></div>
  </div>
</div>

<div class="view" id="v-positions" hidden>
<!-- No id here. The app script tag near the foot of the file carries id="app"
     and that one is load-bearing: tests/smoke.mjs splits the whole document on
     it to find the code it executes. This div was referenced by nothing - no
     CSS rule, no getElementById - and only made the document carry two nodes
     with the same id.
     Do not write that opening tag out in full anywhere above the real one.
     Spelled literally, even inside a comment, it becomes a second marker and
     smoke.mjs runs the vendored chart library instead of this page - which
     fails as a syntax error from inside minified TradingView source and looks
     like anything except a comment. -->
<div class="app">
  <aside class="pane rail">
    <div class="phead"><input class="search" id="q" type="search"
      placeholder="Filter ticker or name" autocomplete="off"></div>
    <div class="segs" id="segs">
      <button class="seg" data-f="all" aria-pressed="true">All</button>
      <button class="seg" data-f="held" aria-pressed="false">Held</button>
      <button class="seg" data-f="watch" aria-pressed="false">Watch</button>
      <button class="seg" data-f="flag" aria-pressed="false">Flagged</button>
    </div>
    <div class="pbody" id="list"></div>
  </aside>

  <section class="pane mid">
    <div class="symhead" id="symhead"></div>
    <div class="ranges" id="ranges">
      <button class="rbtn" data-d="1" title="Today, 5-minute candles">1D</button>
      <button class="rbtn" data-d="5" title="Five sessions, 15-minute candles">5D</button>
      <button class="rbtn" data-d="30">1M</button>
      <button class="rbtn" data-d="91">3M</button>
      <button class="rbtn" data-d="182">6M</button>
      <button class="rbtn" data-d="365" aria-pressed="true">1Y</button>
      <button class="rbtn" data-d="0">ALL</button>
      <span class="rsep"></span>
      <button class="rbtn" data-ma="50" aria-pressed="true">MA50</button>
      <button class="rbtn" data-ma="200" aria-pressed="true">MA200</button>
      <span class="rsep"></span>
      <button class="rbtn" data-rel="book" aria-pressed="false">vs book</button>
      <button class="rbtn" data-rel="bench" aria-pressed="false">vs ACWI</button>
      <span class="legend">
        <span><i class="swatch" style="border-top-color:var(--target)"></i>Target</span>
        <span><i class="swatch" style="border-top-color:var(--trigger);
          border-top-style:dashed"></i>Trigger</span>
        <span><i class="swatch" style="border-top-color:var(--ink-2);
          border-top-width:1px"></i>MA50</span>
        <span><i class="swatch" style="border-top-color:var(--ink-2);
          border-top-style:dashed"></i>MA200</span>
      </span>
      <!-- Says what the LAST candle is, which is the only bar on the chart
           whose age is in question. Written by paintChart from the series it
           actually drew, never from what it expected to draw. -->
      <span class="note" id="livebar"></span>
    </div>
    <div class="chartbox"><div id="chart" style="position:absolute;inset:0"></div>
      <div class="nochart" id="nochart" style="display:none"></div></div>
    <div class="strip">
      <div class="striphead"><span class="ptitle">POSITIONS BY WEIGHT</span>
        <span class="note" id="stripnote"></span></div>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <aside class="pane thesis">
    <div class="phead"><span class="ptitle">THESIS</span></div>
    <div class="pbody" id="thesis"></div>
  </aside>
</div>
</div>
</div>
</div>

<div class="sheet" id="sheet">
  <div class="sheethead">
    <!-- The crumb names the surface underneath, because the drawer covers it
         completely and otherwise there is nothing on screen saying what you
         are on top of or what closing will return you to. Written by
         setView(), so it can never disagree with where the back button goes. -->
    <h1>Every number on this page</h1>
    <span class="crumb" id="t-crumb"></span>
    <!-- The search box lives in static markup rather than being re-rendered
         with the tables, because a repaint on every keystroke would take the
         caret with it. -->
    <input class="xsearch" id="xq" type="search" autocomplete="off"
      placeholder="Search any table">
    <button class="xtog" id="xunits" aria-pressed="false">Show €</button>
    <button class="xtog" id="xall" aria-pressed="false">Collapse all</button>
    <button class="tbtn back" id="t-close">Back</button></div>
  <div class="sheetnav" id="sheetnav"></div>
  <div id="sheetbody"></div>
</div>
