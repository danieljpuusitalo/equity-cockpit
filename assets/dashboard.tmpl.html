<script id="chartlib">/*__CHARTLIB__*/</script>
<script id="app">
const D = /*__DATA__*/;

/* Everything below displays; nothing decides. Any number you see was computed
   in Python and is in the payload - if a figure is wrong, fix analyse.py. */

const $  = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur = (n) => n == null ? '—' : '€' + Number(n).toLocaleString('en-GB',
  {maximumFractionDigits:0});
const px  = (n) => n == null ? '—' : Number(n).toLocaleString('en-GB',
  {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (n, dp) => n == null ? '—' :
  (n > 0 ? '+' : '') + Number(n).toFixed(dp == null ? 2 : dp) + '%';
const cls = (n) => n == null ? '' : (n > 0 ? 'up-t' : n < 0 ? 'dn-t' : '');
const num = (n, dp) => n == null ? '—' : Number(n).toFixed(dp == null ? 2 : dp);
// The analyser writes gaps as lowercase fragments ("no thesis on the Equity
// Log") because they are also read mid-sentence in Telegram. Here they start a
// sentence, so they get a capital - in the page, not in the payload.
const cap = (s) => !s ? '' : String(s).charAt(0).toUpperCase() + String(s).slice(1);
// Market cap in the quote currency, at the magnitude a human reads. 442bn, not
// 442,100,482,048 - the digits past the third are noise on a figure that moves
// by a percent a day.
const big = (n) => {
  if (n == null) return '—';
  const a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2) + 'tn';
  if (a >= 1e9)  return (n / 1e9).toFixed(1) + 'bn';
  if (a >= 1e6)  return (n / 1e6).toFixed(0) + 'm';
  return Number(n).toLocaleString('en-GB', {maximumFractionDigits:0});
};
// Where a bounded reading sits in its band, with the two conventional lines
// drawn faintly behind it. lo/hi are in the same units as v.
const meter = (v, lo, hi, marks) => {
  if (v == null) return '';
  const at = (x) => Math.max(0, Math.min(100, ((x - lo) / (hi - lo)) * 100));
  return `<span class="meter">${(marks || []).map(
    (m) => `<u style="left:${at(m).toFixed(1)}%"></u>`).join('')
  }<i style="left:${at(v).toFixed(1)}%"></i></span>`;
};
const LEVEL = {critical:'var(--crit)', warning:'var(--warn)',
               info:'var(--muted)', good:'var(--good)'};

/* ---------------------------------------------------------------- model */

// Holdings are per ISIN per account, so the same symbol can appear twice. The
// rail is a list of companies, not of custody rows - fold them together first.
const held = new Map();
for (const h of D.holdings || []) {
  const sym = h.yahoo || h.ticker;
  if (!sym) continue;
  const cur = held.get(sym) || {sym, name:h.name, ticker:h.ticker, ccy:h.ccy,
    units:0, cost_eur:0, value_eur:0, price:h.price, day_pct:h.day_pct,
    off_high:h.off_high, bucket:h.bucket, accounts:[], stale:h.stale};
  cur.units += h.units || 0;
  cur.cost_eur += h.cost_eur || 0;
  cur.value_eur += h.value_eur || 0;
  if (h.account && !cur.accounts.includes(h.account)) cur.accounts.push(h.account);
  held.set(sym, cur);
}
for (const h of held.values()) {
  h.pl_eur = h.value_eur - h.cost_eur;
  h.pl_pct = h.cost_eur ? (h.value_eur / h.cost_eur - 1) * 100 : null;
  h.weight = D.totals.value_eur ? (h.value_eur / D.totals.value_eur) * 100 : 0;
}

const watch = new Map();
for (const w of D.watchlist || []) {
  const sym = w.yahoo || w.ticker;
  if (sym) watch.set(sym, w);
}

// Coverage is per held position and carries its own `yahoo`, so the join needs
// no mapping the page would have to re-derive. Positions are per ISIN per
// account; a symbol held in both would land twice, and the one that matters is
// the uncovered one - a gap in either account is a gap.
const COV = (D.coverage || {});
const coverBy = new Map();
for (const c of COV.rows || []) {
  const sym = c.yahoo || c.ticker;
  if (!sym) continue;
  const prev = coverBy.get(sym);
  if (!prev || (prev.covered && !c.covered)) coverBy.set(sym, c);
}

// An alert names its subject in the key and again in the title. Matching on the
// symbol string covers both shapes without the analyser having to promise one.
const alertsFor = (sym) => (D.alerts || []).filter(
  (a) => (String(a.key || '') + ' ' + String(a.title || '')).includes(sym));

const ROWS = [...new Set([...held.keys(), ...watch.keys()])].map((sym) => {
  const h = held.get(sym), w = watch.get(sym);
  const flags = alertsFor(sym);
  return {
    sym, h, w, flags,
    cov: coverBy.get(sym) || null,
    ind: (D.indicators || {})[sym] || null,
    label: (w && w.ticker) || (h && h.ticker) || sym,
    company: (w && w.company) || (h && h.name) || sym,
    isHeld: !!h,
    price: (h && h.price) != null ? h.price : (w ? w.price_now : null),
    ccy: (h && h.ccy) || (w && w.ccy) || '',
    day_pct: h ? h.day_pct : null,
    value_eur: h ? h.value_eur : null,
    weight: h ? h.weight : 0,
    worst: flags.reduce((acc, a) =>
      a.level === 'critical' ? 'critical' : acc === 'critical' ? acc : a.level, null),
  };
}).sort((a, b) => (b.value_eur || 0) - (a.value_eur || 0) ||
                  a.label.localeCompare(b.label));

// What `select()` can actually open. The sheet's tables reach further than the
// rail does - the look-through names companies that are only inside a fund and
// have no chart of their own - so a row is offered as a click only when there
// is somewhere for the click to go. Marking every row clickable and having
// most of them do nothing teaches you to stop clicking.
const ROWSYM = new Set(ROWS.map((r) => r.sym));

let state = {sym: ROWS.length ? ROWS[0].sym : null, filter:'all', q:'', days:365,
             ma:{50:true, 200:true}};

/* ----------------------------------------------------------------- tape */

function paintTape() {
  const t = D.totals || {}, s = D.sources || {}, hs = D.health || {};
  $('#t-value').textContent = eur(t.value_eur);
  $('#t-pl').innerHTML = `<b class="${cls(t.pl_pct)}">${pct(t.pl_pct)}</b>` +
    `<span style="color:var(--muted)">${eur(t.pl_eur)}</span>` +
    // How fast, next to how much. Absent rather than zero when the book is too
    // young to annualise honestly.
    (t.irr_pct == null ? '' :
      `<span style="color:var(--muted)"> · </span><b class="${cls(t.irr_pct)}"
        title="Money-weighted annual return over every lot since ${esc(t.irr_since || '')}"
        >${pct(t.irr_pct, 1)}/yr</b>`);

  const live = s.equity_log_mode === 'live';
  const flags = (D.alerts || []).filter((a) => !a.health).length;
  const stale = s.nordnet_export_age_days > (D.thresholds || {}).csv_stale_days;
  // Coverage sits on the tape rather than three clicks away because it is the
  // one number that says how much of this page is decoration. A position with
  // no thesis and no target weight cannot be judged by anything here.
  const nCov = (COV.rows || []).length;
  const nMon = nCov - (COV.n_uncovered || 0);
  const covChip = nCov
    ? `<span title="${eur(COV.value_uncovered_eur)} of ${eur(COV.value_total_eur)} sits in
        ${COV.n_uncovered} positions with no thesis (stocks) or no target weight (funds)."
        ><b>${nMon}</b>/${nCov} monitored<span style="color:var(--muted)"> · </span><b
        class="${COV.pct_uncovered > 0 ? 'dn-t' : ''}">${(COV.pct_uncovered || 0).toFixed(0)}%</b>
        of value unwatched</span>`
    : '';
  $('#t-meta').innerHTML = [
    `<b>${held.size}</b> held`,
    `<b>${watch.size}</b> watched`,
    `<b class="${flags ? 'dn-t' : ''}">${flags}</b> flag${flags === 1 ? '' : 's'}`,
    covChip,
    // The clock the prices were taken at. Without it an afternoon page and a
    // breakfast page are indistinguishable, which is the whole reason the
    // intraday refresh exists - and a page that refreshed but does not say so
    // is no more trustworthy than one that did not.
    `Priced <b title="${esc(D.generated || '')}${s.run_mode === 'refresh'
        ? ` · intraday refresh; board last read ${esc(s.last_full_run || '')}`
        : ' · full run'}">${esc((D.generated || '').slice(11, 16))}</b>`,
    `CSV <b class="${stale ? 'dn-t' : ''}">${s.nordnet_export_age_days}d</b>`,
    `Notion <b>${live ? 'live' : 'cached'}</b>`,
  ].filter(Boolean).join('<span style="color:var(--axis);margin:0 8px">·</span>');

  const problems = (hs.problems || []);
  if (problems.length) {
    const worst = problems.some((p) => p.level === 'critical') ? 'critical' : 'warning';
    $('#t-banner').innerHTML =
      `<div class="banner"><span class="dot" style="background:${LEVEL[worst]}"></span>` +
      `<span><b>${esc(hs.headline || '')}</b> ` +
      `<span class="why">${problems.map((p) => esc(p.title)).join(' · ')}</span></span></div>`;
  }
}

/* ----------------------------------------------------------------- rail */

function visible() {
  const q = state.q.trim().toLowerCase();
  return ROWS.filter((r) => {
    if (state.filter === 'held'  && !r.isHeld) return false;
    if (state.filter === 'watch' && !r.w) return false;
    if (state.filter === 'flag'  && !r.flags.length) return false;
    if (q && !(r.label + ' ' + r.company).toLowerCase().includes(q)) return false;
    return true;
  });
}

function paintRail() {
  const rows = visible();
  if (!rows.length) {
    $('#list').innerHTML = '<div class="empty">Nothing matches that filter.</div>';
    return;
  }
  $('#list').innerHTML = rows.map((r) => `
    <div class="row" data-sym="${esc(r.sym)}" role="option"
         aria-selected="${r.sym === state.sym}">
      <div class="sym">${esc(r.label)}${r.worst
        ? `<i class="dot" style="background:${LEVEL[r.worst]}"></i>` : ''}${
        r.cov && !r.cov.covered
          ? `<i class="ring" title="Not monitored — ${esc(r.cov.gap || '')}"></i>` : ''}</div>
      <div class="px num">${px(r.price)}</div>
      <div class="co">${esc(r.company)}</div>
      <div class="chg num ${cls(r.day_pct)}">${r.isHeld
        ? pct(r.day_pct, 1) : '<span style="color:var(--muted)">watch</span>'}</div>
    </div>`).join('');
}

/* ------------------------------------------------------------- mid pane */

function paintHead(r) {
  const wk = r.w;
  $('#symhead').innerHTML = `
    <span class="tk">${esc(r.label)}</span>
    <span class="co">${esc(r.company)}</span>
    ${wk && wk.verdict ? verdictBadge(wk.verdict) : ''}
    <span class="px num">${px(r.price)}<span style="font-size:12px;
      color:var(--muted);margin-left:5px">${esc(r.ccy)}</span></span>
    <span class="chg num ${cls(r.day_pct)}">${r.day_pct == null ? '' : pct(r.day_pct)}</span>`;
}

function verdictBadge(v) {
  const k = String(v).toLowerCase();
  const c = k.includes('buy') || k.includes('add') ? 'b-buy'
          : k.includes('trim') ? 'b-trim'
          : k.includes('exit') || k.includes('sell') ? 'b-exit' : 'b-watch';
  return `<span class="badge ${c}">${esc(v)}</span>`;
}

function paintStrip() {
  const withValue = ROWS.filter((r) => r.value_eur > 0);
  $('#stripnote').textContent =
    `${withValue.length} positions · ${(D.sources || {}).lots} lots · ` +
    `width is share of ${eur(D.totals.value_eur)}`;
  $('#bars').innerHTML = withValue.map((r) => `
    <div class="bar" data-sym="${esc(r.sym)}" data-sel="${r.sym === state.sym ? 1 : 0}"
      style="flex:${r.weight.toFixed(3)} 1 0"
      title="${esc(r.label)} — ${r.weight.toFixed(1)}% · ${eur(r.value_eur)}"></div>`
  ).join('');
}

/* --------------------------------------------------------- thesis pane */

function paintThesis(r) {
  const w = r.w, h = r.h, out = [];

  if (w) {
    const decay = w.upside_decay_pts;

    /* The thesis leads, because it is the thing the rest of this pane is
       evidence for or against. Empty says so out loud rather than collapsing
       the section - a name whose reason to be held was never written down is
       the finding, not a rendering gap. */
    const infl = w.inflection_date
      ? `<dl class="kv" style="margin-top:9px">
         <dt>Settles on</dt><dd>${esc(w.inflection_date)}${w.days_to_inflection == null
           ? '' : ` <span style="color:var(--muted)">${w.days_to_inflection}d</span>`}</dd>
         ${w.inflection_event ? `<dt>Event</dt><dd>${esc(w.inflection_event)}</dd>` : ''}
         </dl>` : '';
    out.push(`<div class="tsec"><div class="tlabel">THE THESIS</div>
      <div class="prose"${w.thesis ? '' : ' style="color:var(--muted)"'}>${
        w.thesis ? esc(w.thesis)
                 : 'No thesis written. The board carries a target and a trigger '
                   + 'for this name but never recorded why it is owned — so there '
                   + 'is nothing here for the price to agree or disagree with.'
      }</div>${infl}</div>`);

    out.push(`<div class="tsec"><div class="tlabel">THE CALL</div><dl class="kv">
      <dt>Verdict</dt><dd>${verdictBadge(w.verdict || '—')}</dd>
      <dt>Tier</dt><dd>${esc(w.tier || '—')}</dd>
      <dt>Target</dt><dd>${px(w.target)} ${esc(w.ccy || '')}</dd>
      <dt>Upside now</dt><dd class="${cls(w.upside_now)}">${pct(w.upside_now, 1)}</dd>
      <dt>Upside at eval</dt><dd>${pct(w.upside_at_eval, 1)}</dd>
      <dt>Drift since eval</dt><dd class="${cls(w.drift_pct)}">${pct(w.drift_pct, 1)}</dd>
      <dt>Last evaluated</dt><dd>${esc(w.last_eval || '—')}${w.days_since_eval == null
        ? '' : ` <span style="color:var(--muted)">${w.days_since_eval}d</span>`}</dd>
      <dt>Next check</dt><dd>${esc(w.next_check || '—')}${w.days_to_check == null
        ? '' : ` <span style="color:var(--muted)">${w.days_to_check}d</span>`}</dd>
      </dl>${Math.abs(decay || 0) >= (D.thresholds || {}).decay_alert_pts
        ? `<div class="prose" style="margin-top:9px;color:var(--warn-ink)">
           ⚠ The board still claims ${pct(w.upside_at_eval, 1)}; today it is
           ${pct(w.upside_now, 1)} — <b>${Math.abs(decay).toFixed(1)} points</b>
           of decay. The thesis has not been re-checked since ${esc(w.last_eval)}.</div>` : ''}
      </div>`);

    out.push(`<div class="tsec"><div class="tlabel">WHAT WOULD CHANGE YOUR MIND</div>
      ${w.trigger_level ? `<dl class="kv" style="margin-bottom:8px">
        <dt>Level</dt><dd>${esc(w.trigger_kind || '')} ${px(w.trigger_level)}</dd>
        <dt>Gap to level</dt><dd class="${w.trigger_hit ? 'dn-t' : ''}">
          ${pct(w.trigger_gap_pct, 1)}${w.trigger_hit ? ' · HIT' : ''}</dd></dl>`
        : `<div class="prose" style="margin-bottom:8px;color:var(--muted)">
           No price level parsed from this trigger — it is a condition, not a
           number. Read it and judge for yourself.</div>`}
      <div class="prose">${esc(w.trigger || 'Nothing written down.')}</div></div>`);

    out.push(paintMultiples(w, r));

    const noted = [['Moat', w.moat], ['Market', w.market],
                   ['Evaluations', w.evaluations]]
      .filter((kv) => kv[1] != null && kv[1] !== '');
    if (noted.length) out.push(`<div class="tsec"><div class="tlabel">AS RECORDED</div>
      <dl class="kv">${noted.map((kv) =>
        `<dt>${esc(kv[0])}</dt><dd>${esc(kv[1])}</dd>`).join('')}</dl></div>`);
  } else {
    out.push(`<div class="tsec"><div class="tlabel">THE CALL</div>
      <div class="prose">Not on the Equity Log. You own it, but no target, thesis or
      falsifying condition is written down — so nothing here can tell you when it
      stops being a good idea.</div></div>`);
  }

  out.push(paintMissing(r));

  if (h) out.push(`<div class="tsec"><div class="tlabel">THE POSITION</div><dl class="kv">
    <dt>Units</dt><dd>${h.units}</dd>
    <dt>Account${h.accounts.length > 1 ? 's' : ''}</dt><dd>${esc(h.accounts.join(', '))}</dd>
    <dt>Value</dt><dd>${eur(h.value_eur)}</dd>
    <dt>Cost</dt><dd>${eur(h.cost_eur)}</dd>
    <dt>P/L</dt><dd class="${cls(h.pl_pct)}">${pct(h.pl_pct, 1)} · ${eur(h.pl_eur)}</dd>
    ${(() => { const rr = (D.returns || {})[h.sym] || {};
       return rr.irr_pct != null
         ? `<dt>Annualised</dt><dd class="${cls(rr.irr_pct)}">${pct(rr.irr_pct, 1)}/yr
            <span style="color:var(--muted)">since ${esc(rr.since || '')}</span></dd>`
         : rr.note
           ? `<dt>Annualised</dt><dd style="color:var(--muted)">${esc(rr.note)}</dd>`
           : ''; })()}
    <dt>Weight</dt><dd>${h.weight.toFixed(1)}%</dd>
    <dt>Off 52w high</dt><dd>${pct(h.off_high, 1)}</dd>
    <dt>Bucket</dt><dd>${esc(h.bucket || '—')}</dd></dl></div>`);

  out.push(paintBehaviour(r));

  if (r.flags.length) out.push(`<div class="tsec"><div class="tlabel">FLAGS</div>
    ${r.flags.map((a) => `<div class="alert">
      <span class="dot" style="background:${LEVEL[a.level] || 'var(--muted)'}"></span>
      <span><div class="t">${esc(a.title)}</div>
      <div class="d">${esc(a.detail)}</div></span></div>`).join('')}</div>`);

  $('#thesis').innerHTML = out.join('');
}

/* The board's figures against today's. Nothing is reconciled and nothing is
   overwritten - the whole point of the section is the distance between the two
   columns, and a merged number would hide exactly that. The left column is what
   Daniel wrote down when he last evaluated the name; the right is Yahoo this
   morning. Where the board is silent the row still shows, because "we never
   recorded this" is itself worth seeing next to a live number. */
function paintMultiples(w, r) {
  const L = w.live || {}, ccy = esc(w.ccy || r.ccy || '');
  // Deliberately achromatic. A multiple that fell since the write-up is
  // cheaper, not worse, and green/red here would have the page taking a view
  // on which direction is good news - which is the thesis's job, not this
  // table's. The sign and the size are the whole message.
  const drift = (d) => d == null ? '' : `<span class="drift">${pct(d, 0)}</span>`;
  const row = (label, was, now, d, suffix) =>
    (was == null && now == null) ? '' :
    `<dt>${esc(label)}</dt><dd class="was">${was == null ? '—' : esc(was)}</dd>
     <dd>${now == null ? '—' : now}${suffix || ''}${drift(d)}</dd>`;

  const body = [
    row('P/E', w.pe, num(L.pe, 1), w.pe_drift_pct),
    row('Fwd P/E', w.fwd_pe, num(L.fwd_pe, 1), w.fwd_pe_drift_pct),
    row('Net debt/EBITDA', w.net_debt_ebitda, num(L.net_debt_ebitda, 2)),
    row('P/B', null, num(L.pb, 1)),
    row('EPS', null, num(L.eps, 2), null, ` <span class="drift">${ccy}</span>`),
    row('Return on equity', null, L.roe_pct == null ? null : num(L.roe_pct, 1) + '%'),
    row('Net margin', null, L.margin_pct == null ? null : num(L.margin_pct, 1) + '%'),
    row('Beta', null, num(L.beta, 2)),
    row('Market cap', null, big(L.market_cap), null,
        ` <span class="drift">${ccy}</span>`),
  ].filter(Boolean).join('');
  if (!body && L.street_target == null) return '';

  /* The street's target, deliberately without the street's verdict. A number
     you can hold your own target up against is evidence; a word telling you to
     buy is somebody else making the decision this pane exists to make. */
  const street = L.street_target == null ? '' : `
    <dl class="kv" style="margin-top:11px">
      <dt>Street target</dt><dd>${px(L.street_target)} ${ccy}${L.street_analysts
        ? ` <span style="color:var(--muted)">${L.street_analysts} analysts</span>` : ''}</dd>
      <dt>Street sees</dt><dd class="${cls(w.street_upside_pct)}">${pct(w.street_upside_pct, 1)}</dd>
      <dt>You see</dt><dd class="${cls(w.upside_now)}">${pct(w.upside_now, 1)}</dd>
    </dl>`;

  const sector = L.sector
    ? `<div class="prose" style="margin-top:9px;color:var(--muted)">${esc(L.sector)}${
        L.industry ? ' · ' + esc(L.industry) : ''}</div>` : '';

  return `<div class="tsec"><div class="tlabel">THE MULTIPLES</div>
    <dl class="trio">
      <dt></dt>
      <dd class="hd">Board${w.last_eval ? ' ' + esc(String(w.last_eval).slice(5)) : ''}</dd>
      <dd class="hd">Today</dd>
      ${body}
    </dl>${street}${sector}</div>`;
}

/* Coverage, as money. The prose above already explains why an unexamined
   position is a problem; what this section adds is how much of the book is
   riding on one. Covered names get nothing - the thesis section above is
   already the evidence, and a green "all good" box would be noise. */
function paintMissing(r) {
  const c = r.cov;
  if (!c || c.covered) return '';
  const stock = c.klass === 'stock';
  /* The word "placeholder" travels with the number everywhere the number
     goes. A target that reads like a policy IS a policy to whoever finds it
     next, and these eleven were filled in by a rule, not a decision. */
  const held = c.target_basis === 'placeholder';
  const alloc = c.target_weight_pct == null ? '' : `
    <dl class="kv" style="margin-top:8px">
      <dt>Target weight</dt><dd>${num(c.target_weight_pct, 1)}%${
        held ? ' <span class="est" title="Filled in by a rule, not a decision. '
             + 'Not a policy, and never alerted on.">placeholder</span>' : ''}</dd>
      <dt>Drift</dt><dd class="${cls(c.drift_pts)}">${c.drift_pts == null
        ? '—' : num(c.drift_pts, 1) + ' pts'}</dd></dl>`;
  return `<div class="tsec"><div class="tlabel">WHAT'S MISSING</div>
    <dl class="kv">
      <dt>At stake</dt><dd>${eur(c.value_eur)} · ${num(c.weight_pct, 1)}% of the book</dd>
      <dt>Judged by</dt><dd>${stock ? 'a thesis' : 'an allocation'}</dd>
    </dl>
    <div class="prose" style="margin-top:9px">${esc(cap(c.gap) || 'Not monitored.')}${
      stock
        ? ' — so there is no target to measure today against and no condition that '
          + 'would tell you the reasoning had broken.'
        : ' — an index tracker answers to a weight, not to a story, and without '
          + 'one there is no band for it to drift out of.'}</div>${alloc}</div>`;
}

/* The chart, read back as numbers. Descriptive only: this section says where
   price is, never what to do about it - "overbought" is weather, and the
   thesis above is the decision. Everything here was computed in Python off the
   same cached bars the chart draws, so it costs no extra fetch and cannot
   disagree with what is plotted a pane to the left. */
function paintBehaviour(r) {
  const i = r.ind;
  if (!i) return '';
  const rows = [];
  if (i.rsi != null) rows.push(`<dt>RSI ${i.rsi_period}</dt><dd>${num(i.rsi, 1)}
    <span style="color:var(--muted)">${esc(i.rsi_state || '')}</span>
    ${meter(i.rsi, 0, 100, [30, 70])}</dd>`);
  // No tick marks on these two: the ends of the track already ARE the bands,
  // and a 1px rule at left:100% renders half outside the bar it belongs to.
  if (i.bb_pct_b != null) rows.push(`<dt>In its band</dt><dd>${num(i.bb_pct_b * 100, 0)}%
    <span style="color:var(--muted)">${num(i.bb_lower, 2)}–${num(i.bb_upper, 2)}</span>
    ${meter(i.bb_pct_b, 0, 1)}</dd>`);
  if (i.macd_hist != null) rows.push(`<dt>MACD histogram</dt>
    <dd class="${cls(i.macd_hist)}">${num(i.macd_hist, 2)}
    <span style="color:var(--muted)">line ${num(i.macd, 2)} · signal
    ${num(i.macd_signal, 2)}</span></dd>`);
  if (i.ma_spread_pct != null) rows.push(`<dt>MA50 vs MA200</dt>
    <dd class="${cls(i.ma_spread_pct)}">${pct(i.ma_spread_pct, 1)}</dd>`);
  if (i.above_sma200_pct != null) rows.push(`<dt>Above MA200</dt>
    <dd class="${cls(i.above_sma200_pct)}">${pct(i.above_sma200_pct, 1)}</dd>`);
  if (i.vol_30d != null) rows.push(`<dt>Volatility</dt><dd>${num(i.vol_30d, 1)}%
    <span style="color:var(--muted)">annualised, 30d</span></dd>`);
  if (i.atr_pct != null) rows.push(`<dt>Daily range</dt><dd>${num(i.atr_pct, 2)}%
    <span style="color:var(--muted)">ATR ${num(i.atr, 2)}</span></dd>`);
  if (i.max_drawdown_pct != null) rows.push(`<dt>Max drawdown</dt>
    <dd class="dn-t">${pct(i.max_drawdown_pct, 1)}</dd>`);
  // range.pct is WHERE the close sits between the low and the high, not how
  // wide the band is. Labelling it "wide" would have read as a volatility
  // number and been wrong by a mile on anything that has halved.
  if (i.range && i.range.pct != null) rows.push(`<dt>In its ${i.range.days}d range</dt>
    <dd>${num(i.range.pct, 0)}%
    <span style="color:var(--muted)">${num(i.range.low, 2)}–${num(i.range.high, 2)}</span>
    ${meter(i.range.pct, 0, 100)}</dd>`);
  if (i.volume && i.volume.relative != null) rows.push(`<dt>Volume</dt>
    <dd>${num(i.volume.relative, 2)}×
    <span style="color:var(--muted)">the ${i.volume.period}d average</span></dd>`);
  if (!rows.length) return '';
  return `<div class="tsec"><div class="tlabel">THE CHART</div>
    <dl class="kv">${rows.join('')}</dl>
    <div class="prose" style="margin-top:9px;color:var(--muted)">
      ${i.bars} bars to ${esc(i.asof)}. Description, not advice — none of this
      knows why you own it.</div></div>`;
}

/* ----------------------------------------------------------------- chart */

let chart = null, candles = null, lines = [], mas = {};

/* Simple moving average over closes, as a rolling sum - one pass, no window
   re-summing, so 500 bars costs 500 additions rather than 25,000.

   It is computed over the WHOLE series and sliced afterwards, never over the
   visible window. An MA50 computed inside a 1M view would be a 21-day average
   wearing a "50" label, and it would be wrong at exactly the left edge where
   you are looking for the cross. */
function sma(bars, period) {
  if (!bars || bars.length < period) return [];
  const out = [];
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i][4];
    if (i >= period) sum -= bars[i - period][4];
    if (i >= period - 1) out.push({time: bars[i][0], value: sum / period});
  }
  return out;
}

function themeOpts() {
  const cssVar = (n, fallback) => {
    try {
      const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      return v || fallback;
    } catch (e) { return fallback; }
  };
  return {
    // attributionLogo defaults to TRUE in v4.2+ and stamps a tradingview.com
    // link into the corner of the pane. It is a documented option, not a
    // licence condition - Apache-2.0 asks that the notice be preserved, and it
    // is: the library is inlined verbatim, @license header and all, a few
    // hundred lines above this one.
    layout: {background:{color:'transparent'}, textColor:cssVar('--muted','#898781'),
             fontSize:11, fontFamily:'system-ui, sans-serif', attributionLogo:false},
    grid: {vertLines:{color:cssVar('--grid','#e1e0d9')},
           horzLines:{color:cssVar('--grid','#e1e0d9')}},
    rightPriceScale:{borderColor:cssVar('--axis','#c3c2b7')},
    timeScale:{borderColor:cssVar('--axis','#c3c2b7')},
    crosshair:{mode:0, vertLine:{color:cssVar('--axis','#c3c2b7'), labelBackgroundColor:
      cssVar('--ink-2','#52514e')}, horzLine:{color:cssVar('--axis','#c3c2b7'),
      labelBackgroundColor:cssVar('--ink-2','#52514e')}},
    upColor:cssVar('--up','#2a78d6'), downColor:cssVar('--down','#e34948'),
    target:cssVar('--target','#007a5c'), trigger:cssVar('--trigger','#a85400'),
    // Deliberately achromatic. Four plotted hues is already the ceiling - a
    // fifth failed the normal-vision floor against the up-candle blue (purple,
    // dE 10.7) - and a moving average is context, not identity. Grey is also
    // the only mark on the plot with no hue at all, which is the strongest
    // colour-blind separation available and costs nothing.
    ma:cssVar('--ink-2','#52514e'),
  };
}

function paintChart(r) {
  const box = $('#chart'), miss = $('#nochart');
  // The library is vendored, not fetched, so this only fires if assets/ was
  // gutted - but a page that half-renders in silence is the thing we avoid.
  if (typeof LightweightCharts === 'undefined' || !box || !box.getBoundingClientRect) {
    if (miss) { miss.style.display = 'flex';
      miss.textContent = 'Chart library missing from assets/.'; }
    return;
  }
  // Nothing is drawn into a box that cannot be measured. The chart takes its
  // size from the container at construction, and with autoSize on there is no
  // way back: the vendored v4.2.3 makes resize() a no-op while the observer is
  // installed (`resize(t,i,n){this.autoSizeActive()||...}`) and applyOptions
  // will not re-measure either. So a chart built while Positions was hidden is
  // zero-wide for as long as its ResizeObserver takes to fire - which in a
  // background tab is never, because rAF is throttled there. Measured: with
  // the container at 661x891 for a second and a half, every canvas was still
  // 0 wide on a 300px backing store.
  //
  // Deferring costs nothing, because setView('positions') repaints after it
  // un-hides the view and is the only way this surface can be reached.
  const rect = box.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  const series = (D.history || {})[r.sym];
  const bars = series && series.bars ? series.bars : null;
  if (!bars || !bars.length) {
    if (chart) { chart.remove(); chart = null; candles = null; lines = []; mas = {}; }
    box.innerHTML = '';
    miss.style.display = 'flex';
    miss.textContent = `No price history for ${r.label}. Yahoo returned nothing for ` +
      'this symbol; the rest of the page is unaffected.';
    return;
  }
  miss.style.display = 'none';

  const T = themeOpts();
  if (!chart) {
    chart = LightweightCharts.createChart(box, Object.assign({
      autoSize: true, handleScale:{axisPressedMouseMove:false},
    }, T));
    candles = chart.addCandlestickSeries({
      upColor:T.upColor, downColor:T.downColor,
      borderUpColor:T.upColor, borderDownColor:T.downColor,
      wickUpColor:T.upColor, wickDownColor:T.downColor,
    });
    // Same colour for both, told apart by weight and dash - so the pair is
    // never distinguished by colour alone, same contract as target/trigger.
    // No last value and no price line: an MA does not belong on the axis, and
    // two extra axis labels would crowd out the two that matter.
    const maOpts = {color:T.ma, priceLineVisible:false, lastValueVisible:false,
                    crosshairMarkerVisible:false};
    mas[50] = chart.addLineSeries(Object.assign({lineWidth:1, title:'MA50',
      lineStyle:LightweightCharts.LineStyle.Solid}, maOpts));
    mas[200] = chart.addLineSeries(Object.assign({lineWidth:2, title:'MA200',
      lineStyle:LightweightCharts.LineStyle.Dashed}, maOpts));
  }

  // Slice by DATE, not by row count. Bars are trading days - about 252 a year -
  // so bars.slice(-365) is fifteen months of chart under a button labelled 1Y.
  let slice = bars;
  if (state.days > 0) {
    const last = Date.parse(bars[bars.length - 1][0]);
    const from = last - state.days * 86400000;
    slice = bars.filter((b) => Date.parse(b[0]) >= from);
  }
  if (!slice.length) slice = bars.slice(-2);
  candles.setData(slice.map((b) => ({time:b[0], open:b[1], high:b[2],
                                     low:b[3], close:b[4]})));

  // Full-history MA, then clipped to the window. ISO dates compare correctly as
  // strings, so no parsing is needed here. A symbol with fewer than `period`
  // bars yields an empty series rather than a misleading partial one.
  const edge = slice[0][0];
  for (const p of [50, 200]) {
    if (!mas[p]) continue;
    mas[p].setData(state.ma[p] ? sma(bars, p).filter((pt) => pt.time >= edge) : []);
  }

  lines.forEach((l) => { try { candles.removePriceLine(l); } catch (e) {} });
  lines = [];
  const w = r.w;
  // Both lines carry a title and an axis label, so target and trigger are never
  // told apart by colour alone - solid vs dashed, plus the words themselves.
  if (w && w.target) lines.push(candles.createPriceLine({
    price:w.target, color:T.target, lineWidth:2,
    lineStyle:LightweightCharts.LineStyle.Solid,
    axisLabelVisible:true, title:'target'}));
  if (w && w.trigger_level) lines.push(candles.createPriceLine({
    price:w.trigger_level, color:T.trigger, lineWidth:2,
    lineStyle:LightweightCharts.LineStyle.Dashed,
    axisLabelVisible:true, title:'trigger'}));

  chart.timeScale().fitContent();
}

function retheme() {
  if (!chart) return;
  const T = themeOpts();
  chart.applyOptions(T);
  if (candles) candles.applyOptions({
    upColor:T.upColor, downColor:T.downColor,
    borderUpColor:T.upColor, borderDownColor:T.downColor,
    wickUpColor:T.upColor, wickDownColor:T.downColor});
  for (const p of [50, 200]) if (mas[p]) mas[p].applyOptions({color:T.ma});
  const r = ROWS.find((x) => x.sym === state.sym);
  if (r) paintChart(r);
}

/* ------------------------------------------------------------ data sheet */

/* The sheet is one surface with one state, and every table on it reads that
   state. A sector bar, a fund row and the search box all write to the same
   object, so a click in one section changes what the sections below it say -
   which is the difference between a dashboard and a stack of printouts.

   State is deliberately NOT persisted. Reopening the sheet on the next run
   should show the whole book, not last week's question still applied to this
   week's numbers with no sign that it is. */
const SS = {
  filter: null,      // {kind:'sector'|'country'|'industry'|'fund', key, label}
  q: '',
  units: 'pct',      // 'pct' | 'eur'
  sort: {},          // table name -> {k, dir}
  shut: {},          // section id -> true when collapsed
};

// Reads 'growth.revenue_yoy_pct' as well as 'pct', so a sort key can point at
// a nested figure without the row being flattened first.
const dig = (o, path) => String(path).split('.')
  .reduce((v, k) => (v == null ? v : v[k]), o);

function sortRows(rows, table, fallback) {
  const s = SS.sort[table] || {k: fallback, dir: -1};
  return rows.slice().sort((a, b) => {
    const x = dig(a, s.k), y = dig(b, s.k);
    // A missing value sinks in BOTH directions. Sorting ascending by surprise
    // must not put the six names that never reported one above the worst miss
    // in the book - absent is not the smallest number, it is not a number.
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'number' && typeof y === 'number'
      ? (x - y) : String(x).localeCompare(String(y))) * s.dir;
  });
}

// A sortable header. `d0` is the direction a first click gives: -1 (biggest
// first) for figures, 1 (A-Z, oldest-first) for names and dates.
const th = (table, key, label, d0) => {
  const s = SS.sort[table];
  const on = s && s.k === key;
  return `<th class="s" data-t="${table}" data-k="${esc(key)}"
    data-d0="${d0 == null ? -1 : d0}"${on ? ` data-dir="${s.dir}"` : ''}
    >${esc(label)}</th>`;
};

function paintSheet() {
  // One search box over every table. Matching on symbol OR name means typing
  // "micro" and typing "MSFT" find the same rows, and the sheet stops being
  // somewhere you scroll to find a ticker.
  const q = (SS.q || '').trim().toLowerCase();
  const hits = (r) => !q || [r.symbol, r.sym, r.yahoo, r.ticker, r.name,
    r.company, r.label].some((v) => v && String(v).toLowerCase().includes(q));
  const some = (n, all, what) => n === all ? `${all} ${what}`
    : `${n} of ${all} ${what}`;

  const hr = sortRows([...held.values()].filter(hits), 'held', 'value_eur');
  const h = `<h2 data-sec="hold">Holdings — ${some(hr.length, held.size,
      'companies')}, ${(D.sources||{}).lots} lots</h2>
    <div class="sec" data-sec="hold">
    <div class="scroll"><table><thead><tr>
    ${th('held','ticker','Ticker',1)}${th('held','name','Company',1)}
    <th>Acct</th>${th('held','units','Units')}${th('held','price','Price')}
    ${th('held','day_pct','Day')}${th('held','value_eur','Value €')}
    ${th('held','cost_eur','Cost €')}${th('held','pl_eur','P/L €')}
    ${th('held','pl_pct','P/L %')}${th('held','weight','Weight')}
    ${th('held','off_high','Off high')}</tr></thead><tbody>${hr.map((p) => `<tr
      class="click" data-sym="${esc(p.sym)}">
      <td>${esc(p.ticker)}</td><td>${esc(p.name)}</td>
      <td>${esc(p.accounts.join('/'))}</td><td>${p.units}</td>
      <td>${px(p.price)}</td><td class="${cls(p.day_pct)}">${pct(p.day_pct,1)}</td>
      <td>${eur(p.value_eur)}</td><td>${eur(p.cost_eur)}</td>
      <td class="${cls(p.pl_eur)}">${eur(p.pl_eur)}</td>
      <td class="${cls(p.pl_pct)}">${pct(p.pl_pct,1)}</td>
      <td>${p.weight.toFixed(1)}%</td><td>${pct(p.off_high,1)}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  const wr = sortRows((D.watchlist||[]).filter(hits), 'log', 'upside_now');
  const w = `<h2 data-sec="log">Equity Log — ${some(wr.length,
      (D.watchlist||[]).length, 'rows')}, ${(D.sources||{}).equity_log_mode}</h2>
    <div class="sec" data-sec="log">
    <div class="scroll"><table><thead><tr>
    ${th('log','ticker','Ticker',1)}${th('log','verdict','Verdict',1)}
    ${th('log','tier','Tier',1)}${th('log','price_now','Price')}
    ${th('log','target','Target')}${th('log','upside_now','Upside now')}
    ${th('log','upside_at_eval','At eval')}${th('log','upside_decay_pts','Decay pts')}
    <th>Trigger</th>${th('log','trigger_gap_pct','Gap')}
    ${th('log','last_eval','Evaluated',1)}${th('log','next_check','Next',1)}
    </tr></thead><tbody>${wr.map((x)=>`<tr
      class="${ROWSYM.has(x.yahoo || x.ticker) ? 'click' : ''}"
      data-sym="${esc(x.yahoo || x.ticker)}">
      <td>${esc(x.ticker)}</td><td>${esc(x.verdict)}</td><td>${esc(x.tier)}</td>
      <td>${px(x.price_now)}</td><td>${px(x.target)}</td>
      <td class="${cls(x.upside_now)}">${pct(x.upside_now,1)}</td>
      <td>${pct(x.upside_at_eval,1)}</td>
      <td>${x.upside_decay_pts == null ? '—' : x.upside_decay_pts.toFixed(1)}</td>
      <td>${x.trigger_level ? esc(x.trigger_kind)+' '+px(x.trigger_level) : '—'}</td>
      <td>${pct(x.trigger_gap_pct,1)}</td><td>${esc(x.last_eval)}</td>
      <td>${esc(x.next_check)}</td></tr>`).join('')}</tbody></table></div></div>`;

  // Ordered by money at risk, not alphabetically: the question the table
  // answers is "how much of the book is nobody watching", and the answer is
  // read off the top rows.
  const cr = sortRows((COV.rows || []).filter(hits), 'cov', 'value_eur');
  const cov = !(COV.rows || []).length ? '' : `<h2 data-sec="cov">Coverage —
    ${(COV.rows||[]).length - (COV.n_uncovered||0)}/${(COV.rows||[]).length} monitored,
    ${eur(COV.value_uncovered_eur)} (${(COV.pct_uncovered||0).toFixed(0)}%) unwatched</h2>
    <div class="sec" data-sec="cov">
    <div class="scroll"><table><thead><tr>
    ${th('cov','ticker','Ticker',1)}${th('cov','covered','Monitored',1)}
    ${th('cov','gap','Gap',1)}${th('cov','value_eur','Value €')}
    ${th('cov','weight_pct','Weight')}${th('cov','klass','Class',1)}
    <th>Judged by</th>${th('cov','target_weight_pct','Target wt')}
    ${th('cov','drift_pts','Drift pts')}<th>Acct</th>
    ${th('cov','name','Name',1)}</tr></thead><tbody>${cr.map((c) => `<tr
      class="${ROWSYM.has(c.yahoo || c.ticker) ? 'click' : ''}"
      data-sym="${esc(c.yahoo || c.ticker)}">
      <td>${esc(c.ticker)}</td><td>${c.covered ? 'yes' : '<b>no</b>'}</td>
      <td>${esc(c.gap || '')}</td>
      <td>${eur(c.value_eur)}</td><td>${num(c.weight_pct,1)}%</td>
      <td>${esc(c.klass)}</td>
      <td>${c.klass === 'stock' ? 'thesis' : 'allocation'}</td>
      <td>${c.target_weight_pct == null ? '—' : num(c.target_weight_pct,1) + '%'
        + (c.target_basis === 'placeholder' ? ' <span class="est"'
          + ' title="Placeholder, not a policy">P</span>' : '')}</td>
      <td>${c.drift_pts == null ? '—' : num(c.drift_pts,1)}</td>
      <td>${esc(c.account)}</td><td>${esc(c.name)}</td>
      </tr>`).join('')}</tbody></table></div>
    ${cr.some((c) => c.target_basis === 'placeholder') ? `<div class="prose"
      style="margin-top:8px"><span class="est">P</span> — placeholder. Filled in
      by a rule (equal weight inside a core/satellite frame) so the allocation
      columns have something to draw. It is not a policy: the holding still
      counts as uncovered and its drift is never alerted on.</div>` : ''}
    ${(COV.researched_not_held||[]).length ? `<div class="prose"
      style="margin-top:8px">Researched but not owned — ${(COV.researched_not_held||[])
      .map(esc).join(', ')}.</div>` : ''}</div>`;

  // The book seen through its wrappers. Two rules hold across everything
  // below. Bars are drawn against a full 100% track, so a row's width is its
  // share of the whole book and not its share of the largest row. And every
  // breakdown draws the mass it could not place as its own bar, because
  // Yahoo discloses ten constituents per fund - most of a thematic, almost
  // none of a world tracker - so coverage varies six-fold inside one
  // portfolio and a chart that hid that would be the most misleading thing
  // on this page. See exposure.py's header.
  const X = D.exposure || {};
  const XT = X.total_eur || 0;
  const share = (v) => XT ? (v / XT) * 100 : 0;
  const w100 = (v) => Math.max(0, Math.min(100, v || 0)).toFixed(3);
  // % or € on the same bars. Not decoration: a 0.30% real-estate sliver and a
  // €120 real-estate sliver are answers to different questions, and which one
  // you want changes with what you are about to do.
  const amt = (p, v) => SS.units === 'eur' ? eur(v) : num(p, 2) + '%';

  const xbar = (o) => `<div class="xrow ${o.un ? 'un' : ''}"
    ${o.kind ? `data-fk="${esc(o.kind)}" data-fv="${esc(o.key)}"
      data-fl="${esc(o.label)}"` : ''}
    data-on="${SS.filter && SS.filter.kind === o.kind
      && SS.filter.key === o.key ? 1 : 0}">
    <div class="n" title="${esc(o.label)}">${esc(o.label)}</div>
    <div class="t">${o.direct == null
      ? `<i class="f" style="width:${w100(o.pct)}%"></i>`
      : `<i class="f" style="width:${w100(o.direct)}%"></i>` +
        `<i class="f2" style="width:${w100(o.indirect)}%"></i>`}</div>
    <div class="p">${amt(o.pct, o.value)}</div></div>`;

  // One breakdown - sector, geography or industry - as a ranked stack. Rows
  // are click targets: picking one filters every table below to the names it
  // contains, which is the whole point of having both on one surface. The
  // unresolved bar is appended whenever there is anything to append and is
  // deliberately NOT clickable - it is the answer to "and the rest", not a
  // bucket you can look inside.
  const xstack = (t, title, kind, note) => {
    if (!t || !(t.rows || []).length) return '';
    const un = share(t.unresolved_eur || 0);
    return `<div><div class="tlabel" style="margin:16px 0 7px">${esc(title)} —
      ${num(t.resolved_pct, 1)}% placed</div>
      ${t.rows.map((r) => xbar({label: r.label, key: r.key, kind: kind,
        pct: r.pct, value: r.value_eur,
        direct: r.direct_eur == null ? null : share(r.direct_eur),
        indirect: r.indirect_eur == null ? null : share(r.indirect_eur)})).join('')}
      ${un > 0.005 ? xbar({label: 'Not resolved', pct: un,
        value: t.unresolved_eur, un: true}) : ''}
      <div class="xkey">${esc(note)}</div></div>`;
  };

  const XC = X.concentration || {}, XM = X.multiples || {},
        XF = X.fees || {}, XN = X.names || {};
  const xcard = (k, v, s) => `<div class="xcard"><div class="k">${esc(k)}</div>
    <div class="v">${v}</div><div class="s">${s}</div></div>`;

  // Both tables below read the one live filter and the one search box, so a
  // click on a sector bar and a typed ticker compose instead of competing.
  const F = SS.filter;
  const inFilter = (r) => {
    if (!F) return true;
    if (F.kind === 'fund') return (r.via || []).some((v) => v.fund === F.key);
    return r[F.kind] === F.key;
  };
  // How many rows the filter could not judge either way, kept separate from
  // how many it excluded. A name Yahoo gave only a ticker for has no sector,
  // and counting it as "not Technology" would be an answer the data cannot
  // support. It is reported as unclassified and left out.
  const blind = !F || F.kind === 'fund' ? 0
    : (XN.rows || []).filter((r) => r[F.kind] == null).length;

  const nameRows = sortRows((XN.rows || []).filter((r) => inFilter(r) && hits(r)),
                            'names', 'pct');
  const fundRows = sortRows((X.funds || []).filter((f) => hits(f)
    && (!F || F.kind !== 'fund' || f.symbol === F.key)), 'funds', 'value_eur');

  const exp = !XT ? '' : `<h2 data-sec="exp">Exposure — ${eur(XT)} across
    ${X.n_positions} positions, looked through</h2>
    <div class="sec" data-sec="exp">
    <div class="xgrid">
      ${xcard('Effective positions', num(XC.effective_n, 1),
        `of ${XC.n} held · top 5 ${num(XC.top5_pct,1)}% ·
         top 10 ${num(XC.top10_pct,1)}% · HHI ${num(XC.hhi,4)}`)}
      ${xcard('Blended P/E', num(XM.pe, 1),
        `P/B ${num(XM.pb,1)} · P/S ${num(XM.ps,2)} ·
         ${num(XM.pe_resolved_pct,1)}% of the book priced · harmonic, not averaged`)}
      ${xcard('Fund fee drag', eur(XF.annual_eur) + '/yr',
        `${num(XF.sleeve_ter_pct,3)}% of the fund sleeve ·
         ${num(XF.book_ter_pct,3)}% of the book ·
         ${num(XF.resolved_pct,0)}% of fund value has a published TER`)}
      ${xcard('Names reached', XN.n || 0,
        `${num(XN.resolved_pct,1)}% of the book named ·
         ${XN.n_both_ways || 0} held directly and inside a fund ·
         the rest is inside undisclosed fund tails`)}
    </div>
    <div class="xcols">
      ${xstack(X.sectors, 'Sector', 'sector',
        'Solid is held directly, pale is reached through a fund. Fund cash is ' +
        'left unresolved rather than scaled away. Click a row to filter below.')}
      ${xstack(X.geography, 'Geography', 'country',
        (X.geography || {}).basis || '')}
    </div>
    ${xstack(X.industries, 'Industry', 'industry',
      'Directly-held stocks only. A fund reports sectors and never industries, ' +
      'so the fund sleeve is unresolved here by construction, not by failure.')}
    </div>
    <h2 data-sec="look">Look-through — ${nameRows.length}${
      nameRows.length === (XN.rows || []).length ? '' :
      ' of ' + (XN.rows || []).length} companies the book touches</h2>
    <div class="sec" data-sec="look">
    ${!nameRows.length ? '<div class="empty">No company matches that filter.</div>'
    : `<div class="scroll"><table><thead><tr>
    ${th('names','symbol','Symbol',1)}${th('names','name','Company',1)}
    ${th('names','pct','Total')}${th('names','direct_pct','Direct')}
    ${th('names','indirect_pct','Via funds')}${th('names','value_eur','Value €')}
    <th>Reached through</th></tr></thead><tbody>${nameRows.map((r) => `<tr
      class="${ROWSYM.has(r.symbol) ? 'click' : ''}" data-sym="${esc(r.symbol)}">
      <td>${esc(r.symbol)}</td><td>${esc(r.name)}</td>
      <td><b>${amt(r.pct, r.value_eur)}</b></td>
      <td>${r.direct_pct ? num(r.direct_pct,2)+'%' : '—'}</td>
      <td>${r.indirect_pct ? num(r.indirect_pct,2)+'%' : '—'}</td>
      <td>${eur(r.value_eur)}</td>
      <td style="text-align:left;color:var(--muted)">${r.held_both_ways
        ? 'held outright + ' : ''}${(r.via || []).map((v) =>
        esc(v.fund)+' '+num(v.pct,1)+'%').join(', ') || 'held outright'}</td>
      </tr>`).join('')}</tbody></table></div>`}
    <div class="prose" style="margin-top:8px">A name absent from this table is
      not absent from the book — it is absent from a fund's disclosed top ten.
      The indirect column is a floor.${blind ? ` ${blind} of these companies
      have no ${esc(F.kind === 'country' ? 'domicile' : F.kind)} on record and
      are excluded from this filter rather than assumed out of it.` : ''}
      ${nameRows.some((r) => ROWSYM.has(r.symbol))
        ? ' Rows with a chart of their own open it.' : ''}</div>
    </div>
    <h2 data-sec="funds">Funds — what each one tells you</h2>
    <div class="sec" data-sec="funds">
    <div class="scroll"><table><thead><tr>
    ${th('funds','symbol','Symbol',1)}${th('funds','name','Name',1)}
    ${th('funds','weight_pct','Weight')}${th('funds','value_eur','Value €')}
    ${th('funds','ter_pct','TER')}<th>Cost €/yr</th>
    ${th('funds','disclosed_pct','Discloses')}${th('funds','n_disclosed','Rows')}
    <th>Sectors</th></tr></thead><tbody>${
      fundRows.map((f) => { const fee = ((XF.rows || [])
        .find((r) => r.symbol === f.symbol) || {});
      return `<tr class="click" data-fund="${esc(f.symbol || '')}"
      data-on="${F && F.kind === 'fund' && F.key === f.symbol ? 1 : 0}"
      <td>${esc(f.symbol || '—')}</td><td>${esc(f.name)}</td>
      <td>${num(f.weight_pct,2)}%</td><td>${eur(f.value_eur)}</td>
      <td>${f.ter_pct == null ? '<span style="color:var(--muted)">not published</span>'
        : num(f.ter_pct,2)+'%'}</td>
      <td>${fee.annual_eur == null ? '—' : eur(fee.annual_eur)}</td>
      <td>${num(f.disclosed_pct,1)}%</td><td>${f.n_disclosed}</td>
      <td>${f.has_sectors ? 'yes' : '<b>no</b>'}</td></tr>`; }).join('')
    }</tbody></table></div>
    <div class="prose" style="margin-top:8px">The spread down the Discloses
      column is why every figure above carries a coverage percentage. A fund
      with no published TER is not free — it is counted against coverage, so
      the fee figure reads as a floor. Click a fund to see only what it
      reaches.</div>
    </div>`;

  /* ----------------------------------------------------------- reporting */
  // What is coming and what landed. Grouped by month rather than by a
  // days-until bucket: a bucket boundary moves under you overnight, a month
  // does not, and the horizon is a quarter wide because a four-week one was
  // measured empty for six weeks of every quarter.
  const R = D.reporting || {}, RC = R.calendar || {};
  const months = [];
  for (const row of RC.rows || []) {
    const key = row.date.slice(0, 7);
    let bucket = months.find((m) => m.key === key);
    if (!bucket) months.push(bucket = {key, rows: []});
    bucket.rows.push(row);
  }
  const monthName = (key) => {
    const d = new Date(key + '-01T00:00:00');
    return isNaN(d) ? key : d.toLocaleDateString('en-GB',
      {month: 'short', year: 'numeric'});
  };
  const dayName = (iso) => {
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('en-GB',
      {day: 'numeric', month: 'short'});
  };
  const landed = sortRows((R.latest || []).filter(hits), 'latest', 'date');

  const rep = !(RC.rows || []).length && !(R.latest || []).length ? '' :
   `<h2 data-sec="rep">Reporting — ${RC.n || 0} prints in the next
    ${RC.horizon_days} days, ${num(RC.pct_ahead,0)}% of the book</h2>
    <div class="sec" data-sec="rep">
    ${!months.length ? `<div class="empty">Nothing scheduled inside
      ${RC.horizon_days} days.</div>` : `<div class="cal">${months.map((m) => `
      <div class="calwk">${esc(monthName(m.key))}</div>
      <div class="calbox ${m.rows.some((r) => r.soon) ? 'soon' : ''}">
        ${m.rows.map((r) => `<div class="calrow" data-sym="${esc(r.symbol)}">
          <span class="d">${esc(dayName(r.date))}</span>
          <span class="sym">${esc(r.symbol)}</span>
          <span class="co">${esc(r.name)}${r.estimated
            ? ' <span class="est">est. date</span>' : ''}</span>
          <span class="wt">${r.eps_estimate == null ? ''
            : 'cons. ' + num(r.eps_estimate, 2) + ' · '}${num(r.weight_pct,1)}%
            of book</span></div>`).join('')}
      </div>`).join('')}</div>`}
    ${(RC.unknown || []).length ? `<div class="xkey" style="margin-top:10px">
      No scheduled date from Yahoo for ${(RC.unknown || []).map((u) =>
      esc(u.symbol)).join(', ')} — ${(RC.unknown || []).some((u) => u.has_history)
      ? 'the reporting history is there, the next date is not.'
      : 'nothing on record at all.'} Absence of a date is not absence of a
      quarter.</div>` : ''}
    <div class="tlabel" style="margin:18px 0 7px">Last reported</div>
    <div class="scroll"><table><thead><tr>
    ${th('latest','symbol','Symbol',1)}${th('latest','date','Reported')}
    ${th('latest','days_ago','Days ago',1)}${th('latest','eps_estimate','Expected')}
    ${th('latest','eps_reported','Actual')}${th('latest','surprise_pct','Surprise')}
    ${th('latest','record.median_surprise_pct','Record')}
    ${th('latest','growth.revenue_yoy_pct','Revenue YoY')}
    <th>Quarter</th>${th('latest','weight_pct','Weight')}
    </tr></thead><tbody>${landed.map((r) => { const g = r.growth || {},
      rec = r.record || {};
      return `<tr class="${ROWSYM.has(r.symbol) ? 'click' : ''}"
      data-sym="${esc(r.symbol)}">
      <td>${esc(r.symbol)}</td><td>${esc(r.date)}</td>
      <td>${r.days_ago == null ? '—' : r.days_ago}</td>
      <td>${num(r.eps_estimate,2)}</td><td>${num(r.eps_reported,2)}</td>
      <td class="${r.surprise_pct == null ? '' : r.beat ? 'beat'
        : r.surprise_pct < 0 ? 'miss' : ''}">${pct(r.surprise_pct,1)}</td>
      <td>${rec.n ? `${rec.beats}B / ${rec.misses}M of ${rec.n}` : '—'}</td>
      <td class="${cls(g.revenue_yoy_pct)}">${pct(g.revenue_yoy_pct,1)}</td>
      <td>${esc(g.period || '—')}</td><td>${num(r.weight_pct,1)}%</td>
      </tr>`; }).join('')}</tbody></table></div>
    <div class="prose" style="margin-top:8px">Surprise is against analyst
      consensus, not against the thesis — a beat is a fact about expectations.
      Revenue is compared with the same quarter a year earlier, never with last
      quarter. A quarter that has not been reported is absent from this table
      rather than present at zero.</div>
    </div>`;

  // The board's figures beside today's, for every name that has either. Two
  // columns per multiple rather than one reconciled number: the gap IS the
  // reading, and a merged figure would be the one thing this cannot show.
  const fa = (D.watchlist||[]).filter((x) => x.live || x.pe != null || x.fwd_pe != null);
  const fw = sortRows(fa.filter(hits), 'mult', 'live.pe');
  const mult = !fa.length ? '' : `<h2 data-sec="mult">Multiples — board vs today,
    ${fa.filter((x) => x.live).length} live</h2>
    <div class="sec" data-sec="mult">
    <div class="scroll"><table><thead><tr>${th('mult','ticker','Ticker',1)}
    ${th('mult','pe','P/E board')}${th('mult','live.pe','P/E now')}
    ${th('mult','pe_drift_pct','Drift')}
    ${th('mult','fwd_pe','Fwd board')}${th('mult','live.fwd_pe','Fwd now')}
    ${th('mult','fwd_pe_drift_pct','Drift')}
    ${th('mult','live.pb','P/B')}${th('mult','live.net_debt_ebitda','ND/EBITDA')}
    ${th('mult','live.roe_pct','ROE')}${th('mult','live.margin_pct','Margin')}
    ${th('mult','live.beta','Beta')}${th('mult','live.market_cap','Mkt cap')}
    <th>Street tgt</th>${th('mult','street_upside_pct','Street')}
    ${th('mult','upside_now','Yours')}${th('mult','live.street_analysts','Analysts')}
    ${th('mult','live.asof','As of')}</tr></thead><tbody>${fw.map((x) => {
      const L = x.live || {};
      return `<tr class="${ROWSYM.has(x.yahoo || x.ticker) ? 'click' : ''}"
      data-sym="${esc(x.yahoo || x.ticker)}"><td>${esc(x.ticker)}</td>
      <td>${num(x.pe,1)}</td><td>${num(L.pe,1)}</td>
      <td>${pct(x.pe_drift_pct,0)}</td>
      <td>${num(x.fwd_pe,1)}</td><td>${num(L.fwd_pe,1)}</td>
      <td>${pct(x.fwd_pe_drift_pct,0)}</td>
      <td>${num(L.pb,1)}</td><td>${num(L.net_debt_ebitda,2)}</td>
      <td>${L.roe_pct == null ? '—' : num(L.roe_pct,1)+'%'}</td>
      <td>${L.margin_pct == null ? '—' : num(L.margin_pct,1)+'%'}</td>
      <td>${num(L.beta,2)}</td><td>${big(L.market_cap)}</td>
      <td>${px(L.street_target)}</td>
      <td class="${cls(x.street_upside_pct)}">${pct(x.street_upside_pct,1)}</td>
      <td class="${cls(x.upside_now)}">${pct(x.upside_now,1)}</td>
      <td>${L.street_analysts == null ? '—' : num(L.street_analysts,0)}</td>
      <td>${esc(L.asof || '—')}</td></tr>`; }).join('')}</tbody></table></div></div>`;

  const ia = ROWS.filter((x) => x.ind);
  const ir = sortRows(ia.filter(hits), 'ind', 'ind.rsi');
  const ind = !ia.length ? '' : `<h2 data-sec="ind">The chart, in numbers —
    ${some(ir.length, ia.length, 'symbols')}</h2>
    <div class="sec" data-sec="ind">
    <div class="scroll"><table><thead><tr>${th('ind','label','Ticker',1)}
    ${th('ind','ind.close','Close')}${th('ind','ind.rsi','RSI')}
    ${th('ind','ind.rsi_state','State',1)}${th('ind','ind.bb_pct_b','%B')}
    ${th('ind','ind.bb_width','Band w')}${th('ind','ind.macd_hist','MACD h')}
    ${th('ind','ind.sma50','MA50')}${th('ind','ind.sma200','MA200')}
    ${th('ind','ind.ma_spread_pct','Spread')}
    ${th('ind','ind.above_sma200_pct','vs MA200')}
    ${th('ind','ind.atr_pct','ATR %')}${th('ind','ind.vol_30d','Vol 30d')}
    ${th('ind','ind.max_drawdown_pct','Max DD')}
    ${th('ind','ind.range.pct','In range')}
    ${th('ind','ind.volume.relative','Vol ×avg')}${th('ind','ind.bars','Bars')}
    <th>As of</th></tr></thead><tbody>${ir.map((x) => { const i = x.ind;
      return `<tr class="click" data-sym="${esc(x.sym)}">
      <td>${esc(x.label)}</td><td>${px(i.close)}</td>
      <td>${num(i.rsi,1)}</td><td>${esc(i.rsi_state || '')}</td>
      <td>${i.bb_pct_b == null ? '—' : num(i.bb_pct_b,2)}</td>
      <td>${i.bb_width == null ? '—' : num(i.bb_width*100,1)+'%'}</td>
      <td class="${cls(i.macd_hist)}">${num(i.macd_hist,2)}</td>
      <td>${px(i.sma50)}</td><td>${px(i.sma200)}</td>
      <td class="${cls(i.ma_spread_pct)}">${pct(i.ma_spread_pct,1)}</td>
      <td class="${cls(i.above_sma200_pct)}">${pct(i.above_sma200_pct,1)}</td>
      <td>${num(i.atr_pct,2)}</td><td>${num(i.vol_30d,1)}</td>
      <td class="dn-t">${pct(i.max_drawdown_pct,1)}</td>
      <td>${i.range ? num(i.range.pct,0) : '—'}</td>
      <td>${i.volume ? num(i.volume.relative,2) : '—'}</td>
      <td>${i.bars}</td><td>${esc(i.asof)}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="prose" style="margin-top:8px">Computed in Python off the same
      cached bars the chart draws. Descriptive only — no row here is a signal.</div>
    </div>`;

  const al = (D.alerts||[]).filter((x) => !q ||
    (x.title + ' ' + x.detail).toLowerCase().includes(q));
  const a = `<h2 data-sec="flag">Flags — ${some(al.length,
      (D.alerts||[]).length, 'open')}</h2>
    <div class="sec" data-sec="flag">
    <div class="scroll"><table><thead><tr><th>Level</th><th>What</th><th>Why</th>
    </tr></thead><tbody>${al.map((x) => `<tr>
      <td>${esc(x.level)}</td><td>${esc(x.title)}</td>
      <td class="wrap">${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>
    </div>`;

  const s = D.sources || {};
  const src = `<h2 data-sec="prov">Provenance</h2>
    <div class="sec" data-sec="prov"><div class="scroll"><table><tbody>
    <tr><td>Generated</td><td>${esc(D.generated)}</td></tr>
    <tr><td>Run</td><td>${s.run_mode === 'refresh'
      ? `intraday refresh · prices and FX re-fetched, everything else served from
         the last full run at ${esc(s.last_full_run || 'unknown')}`
      : 'full · every source read'}</td></tr>
    <tr><td>Nordnet export</td><td>${esc(s.nordnet_export_date)} ·
      ${s.nordnet_export_age_days} days old · ${esc((s.nordnet_files||[]).join(', '))}</td></tr>
    <tr><td>Equity Log</td><td>${esc(s.equity_log_mode)} ·
      ${s.equity_log_age_days} days old</td></tr>
    <tr><td>Price history</td><td>${s.history_symbols} symbols cached ·
      ${s.history_problems} without a fresh series</td></tr>
    <tr><td>Fundamentals</td><td>${s.fundamentals_asked == null ? 'not fetched'
      : `${s.fundamentals_priced}/${s.fundamentals_asked} symbols carry multiples ·
         ${s.fundamentals_problems} problem${s.fundamentals_problems === 1 ? '' : 's'}`
      }</td></tr>
    <tr><td>Indicators</td><td>${Object.keys(D.indicators || {}).length} symbols ·
      derived from the cached bars, no separate fetch</td></tr>
    <tr><td>Fund composition</td><td>${s.composition_asked == null ? 'not fetched'
      : `${s.composition_resolved}/${s.composition_asked} funds broken out ·
         ${s.composition_problems} problem${s.composition_problems === 1 ? '' : 's'} ·
         ten constituents per fund is Yahoo's limit, not a setting`}</td></tr>
    <tr><td>Reporting</td><td>${s.earnings_asked == null ? 'not fetched'
      : `${s.earnings_resolved}/${s.earnings_asked} stocks carry a reporting
         record · ${s.earnings_problems}
         problem${s.earnings_problems === 1 ? '' : 's'} ·
         ${(R.calendar||{}).n_unknown || 0} with no scheduled next date ·
         funds are not asked, Yahoo answers them with a 404`}</td></tr>
    </tbody></table></div></div>`;

  $('#sheetbody').innerHTML = h + w + cov + exp + rep + mult + ind + a + src;

  // Collapse state is re-applied after the repaint rather than survived
  // through it. Every table above is rebuilt from the payload on every
  // interaction, which is the point - none of it can be a stale render of an
  // older answer - so the only things that persist are in SS.
  for (const node of $('#sheetbody').querySelectorAll('[data-sec]'))
    node.setAttribute('data-shut', SS.shut[node.getAttribute('data-sec')] ? '1' : '0');

  // The nav is built from the sections that actually rendered, not from a list
  // kept alongside them. A hand-maintained list would keep offering a jump to
  // Reporting on a run where Yahoo returned nothing and the section is absent.
  const heads = [...$('#sheetbody').querySelectorAll('h2[data-sec]')];
  $('#sheetnav').innerHTML = heads.map((n) => `<button class="navb"
      data-go="${esc(n.getAttribute('data-sec'))}"
      >${esc(n.textContent.split('—')[0].trim())}</button>`).join('')
    + (SS.filter ? `<span class="xchip">${esc(SS.filter.kindLabel)}
        <b>${esc(SS.filter.label)}</b>
        <button id="xclear" title="Clear filter">×</button></span>` : '');
}

/* -------------------------------------------------------------- overview */
/* The altitude above the rail. Every number here arrived computed - the
   treemap rectangles included - because the page displays and does not decide.
   See overview.py for the three rules it enforces, all of which are the same
   rule: a position that cannot be measured is excluded and counted, never
   measured as zero. */

const OV = D.overview || {};

// Colour by return since purchase. The four plotted colours were chosen for
// colour-vision deficiency and the palette block says not to hand-tune them,
// so this mixes --pos/--neg into the plane rather than inventing a ramp.
// Saturation saturates at TONE_CAP: past it, more green stops meaning more.
const TONE_CAP = 25;
// A position with no cost basis has no return. Drawn neutral, not green.
const tone = (p) => p == null ? 'var(--surface-2)'
  : `color-mix(in srgb, var(--${p < 0 ? 'neg' : 'pos'}) ${
      Math.round(14 + Math.min(Math.abs(p), TONE_CAP) / TONE_CAP * 52)
    }%, var(--plane))`;

const card = (title, right, body, extra) =>
  `<section class="card ${extra || ''}"><h3><span>${esc(title)}</span>`
  + (right ? `<span class="rt">${right}</span>` : '')
  + `</h3>${body}</section>`;

const stat = (k, v, s) => `<div class="stat"><div class="k">${esc(k)}</div>
  <div class="v">${v}</div><div class="s">${s || ''}</div></div>`;

// Composition bars, reusing .xrow and its cross-filter attributes so a sector
// clicked here means the same thing as a sector clicked in the data sheet.
const ovbars = (rows, kind, limit) => (rows || []).slice(0, limit).map((r) => {
  const w = Math.max(0, Math.min(100, r.pct || 0));
  return `<div class="xrow" data-fk="${kind}" data-fv="${esc(r.key)}"
    data-fl="${esc(r.label || r.key)}">
    <div class="n" title="${esc(r.label || r.key)}">${esc(r.label || r.key)}</div>
    <div class="t"><i class="f" style="width:${w}%"></i></div>
    <div class="p">${num(r.pct, 1)}%</div></div>`;
}).join('');

// A ranked list with a diverging magnitude bar, scaled to the largest row in
// the card. That is the right scale here because the question is "which of
// these is biggest", not "what share of the whole is this".
const lrows = (rows, get, fmt, note) => {
  if (!rows || !rows.length) return '<div class="lnote">Nothing to show.</div>';
  const max = Math.max(...rows.map((r) => Math.abs(get(r) || 0)), 1e-9);
  return rows.map((r) => {
    const v = get(r) || 0;
    const clickable = r.sym && ROWSYM.has(r.sym);
    return `<div class="lrow ${clickable ? 'click' : ''}"
      ${clickable ? `data-sym="${esc(r.sym)}"` : ''}
      title="${esc(r.name || r.ticker || '')}${note ? ' — ' + note(r) : ''}">
      <div class="t">${esc(r.ticker || r.sym || '—')}</div>
      <div class="track"><span class="mid"></span>
        <i class="${v < 0 ? 'n' : 'p'}" style="width:${
          Math.abs(v) / max * 50}%"></i></div>
      <div class="v ${cls(v)}">${fmt(r)}</div></div>`;
  }).join('');
};

function paintOverview() {
  const t = OV.totals || {}, day = OV.day || {}, alloc = OV.allocation || {};
  const X = D.exposure || {}, con = OV.contributors || {}, mv = OV.movers || {};
  const cal = (D.reporting || {}).calendar || {};
  const conc = X.concentration || {};

  $('#ovtop').innerHTML = [
    stat('Book value', eur(t.value_eur),
      `${OV.n || 0} names · cost ${eur(t.cost_eur)}`),
    stat('Total P/L', `<span class="${cls(t.pl_eur)}">${eur(t.pl_eur)}</span>`,
      `${pct(t.pl_pct)} against what it cost`),
    stat('Annualised', t.irr_pct == null ? '—'
      : `<span class="${cls(t.irr_pct)}">${pct(t.irr_pct, 1)}</span>`,
      t.irr_since ? `money-weighted since ${esc(t.irr_since)}`
                  : esc(t.irr_note || 'not computed')),
    // The quiet count is the honest part of this stat: it says how much of the
    // book had no previous close and is therefore absent from the move rather
    // than sitting inside it as a zero.
    stat('Today', day.pct == null ? '—'
      : `<span class="${cls(day.pct)}">${pct(day.pct)}</span>`,
      day.pct == null ? 'no position has a previous close'
        : `${eur(day.value_eur)} · ${num(day.covered_pct, 0)}% of the book priced`
          + (day.n_quiet ? ` · ${day.n_quiet} without a close` : '')),
  ].join('');

  const tiles = (alloc.tiles || []).map((k) => {
    const size = (k.w < 4.6 || k.h < 9) ? 'xs' : (k.h < 15 ? 'sm' : '');
    const clickable = k.sym && ROWSYM.has(k.sym);
    return `<div class="tile ${size}" ${clickable
        ? `data-sym="${esc(k.sym)}"` : ''}
      style="left:${k.x}%;top:${k.y}%;width:${k.w}%;height:${k.h}%;
             background:${tone(k.pl_pct)}"
      title="${esc(k.name || k.ticker)} · ${eur(k.value_eur)} · ${
        num(k.weight_pct, 1)}% of book · ${pct(k.pl_pct)} since purchase">
      <div class="tt">${esc(k.ticker)}</div>
      <div class="tw">${num(k.weight_pct, 1)}% · ${pct(k.pl_pct)}</div></div>`;
  }).join('');
  const ramp = [-TONE_CAP, -15, -6, 0, 6, 15, TONE_CAP]
    .map((v) => `<i style="background:${tone(v)}"></i>`).join('');

  const cards = [];

  cards.push(card('Allocation', `${alloc.n || 0} positions`,
    `<div class="tmap">${tiles || ''}</div>
     <div class="tmapkey"><span>Area is weight, colour is return since
       purchase</span><span>−${TONE_CAP}%</span><span class="ramp">${ramp}
       </span><span>+${TONE_CAP}%</span>
       ${alloc.n_undrawn ? `<span>${alloc.n_undrawn} position${
         alloc.n_undrawn === 1 ? '' : 's'} not drawn</span>` : ''}</div>`,
    'ovwide'));

  cards.push(card('What made the money',
    con.n_unknown ? `${con.n_known} of ${con.n_known + con.n_unknown} priced`
                  : `${con.n_known} positions`,
    lrows((con.best || []).concat(con.worst || []), (r) => r.pl_eur,
      (r) => eur(r.pl_eur), (r) => `${num(r.share_pct, 1)}% of gross movement`)
    + `<div class="lnote">Attributed in euros, not percent. A 60% gain on the
       smallest position is a rounding error; 12% on the largest one is the
       year.${con.n_unknown ? ` ${con.n_unknown} position${
         con.n_unknown === 1 ? ' has' : 's have'} no cost basis and cannot be
       attributed.` : ''}</div>`,
    'ovtall'));

  cards.push(card('Today', mv.n_quiet ? `${mv.n_priced} priced, ${
      mv.n_quiet} quiet` : `${mv.n_priced} priced`,
    lrows((mv.up || []).concat(mv.down || []), (r) => r.day_pct,
      (r) => pct(r.day_pct), (r) => eur(r.day_eur))));

  cards.push(card('Sector', X.sectors
      ? `${num(X.sectors.resolved_pct, 0)}% resolved` : '',
    ovbars((X.sectors || {}).rows, 'sector', 8)
    + `<div class="lnote">Look-through: a fund's sleeve is spread across its
       disclosed constituents. Yahoo publishes ten per fund, so this names
       ${num((X.sectors || {}).resolved_pct, 0)}% of the book.</div>`,
    'ovtall'));

  cards.push(card('Geography', X.geography
      ? `${num(X.geography.resolved_pct, 0)}% resolved` : '',
    ovbars((X.geography || {}).rows, 'country', 8)));

  cards.push(card('Concentration', `${conc.n || 0} names`,
    `<dl class="kv">
      <dt>Largest position</dt><dd>${num(conc.top1_pct, 1)}%</dd>
      <dt>Top five</dt><dd>${num(conc.top5_pct, 1)}%</dd>
      <dt>Top ten</dt><dd>${num(conc.top10_pct, 1)}%</dd>
      <dt>Effective positions</dt><dd>${num(conc.effective_n, 1)}</dd>
    </dl>
    <div class="lnote">Effective positions is 1/HHI: the number of equally
      sized holdings that would concentrate the book as much as this one is.
      ${num(conc.effective_n, 1)} against ${conc.n || 0} held.</div>`));

  cards.push(card('Next prints', cal.n
      ? `${cal.n} in ${cal.horizon_days} days · ${num(cal.pct_ahead, 0)}% of book`
      : 'none scheduled',
    ((cal.rows || []).length
      ? `<div class="cstrip">${(cal.rows || []).slice(0, 12).map((r) =>
          `<div class="cpill ${r.soon ? 'soon' : ''}"
             title="${esc(r.name || '')}${r.estimated ? ' · date estimated' : ''}">
            <div class="d">${esc(String(r.date).slice(5))}${
              r.estimated ? ' ~' : ''}</div>
            <div class="t">${esc(r.symbol)}</div>
            <div class="w">${num(r.weight_pct, 1)}%</div></div>`).join('')}</div>`
      : '<div class="lnote">No dated results in the horizon.</div>')
    + (cal.n_unknown ? `<div class="lnote">${cal.n_unknown} stock${
        cal.n_unknown === 1 ? ' has' : 's have'} no date from Yahoo. A missing
        date is missing, not "nothing due".</div>` : ''),
    'ovwide'));

  const flags = (D.alerts || []);
  cards.push(card('Flags', `${flags.length}`,
    flags.length
      ? flags.slice(0, 8).map((a) => `<div class="alert">
          <span class="dot" style="background:${
            LEVEL[a.level] || 'var(--muted)'}"></span>
          <span><div class="t">${esc(a.title)}</div>
          <div class="d">${esc(a.detail)}</div></span></div>`).join('')
        + (flags.length > 8
          ? `<div class="lnote">${flags.length - 8} more.</div>` : '')
      : '<div class="lnote">Nothing tripped a threshold.</div>'));

  $('#ovgrid').innerHTML = cards.join('');
}

/* ---------------------------------------------------------------- wiring */

// Which surface is up. The chart measures its container when it is drawn and
// can never re-measure afterwards, so paintChart refuses to build one into a
// hidden box. That refusal is only safe because of the call below: un-hide
// first, then paint, so the construction that was skipped at boot happens here
// against a container that has a real width. Do not reorder these two.
function setView(v) {
  for (const n of document.querySelectorAll('#vnav .vbtn[data-view]'))
    n.setAttribute('aria-pressed', String(n.getAttribute('data-view') === v));
  const o = $('#v-overview'), p = $('#v-positions');
  if (o) o.hidden = v !== 'overview';
  if (p) p.hidden = v !== 'positions';
  if (v === 'positions') {
    const r = ROWS.find((x) => x.sym === state.sym);
    if (r) paintChart(r);
  }
}

function select(sym) {
  if (!sym) return;
  state.sym = sym;
  const r = ROWS.find((x) => x.sym === sym);
  if (!r) return;
  paintRail(); paintHead(r); paintThesis(r); paintStrip(); paintChart(r);
}

function on(sel, ev, fn) { const n = $(sel); if (n) n.addEventListener(ev, fn); }

on('#list', 'click', (e) => {
  const row = e.target && e.target.closest && e.target.closest('.row');
  if (row) select(row.getAttribute('data-sym'));
});
on('#bars', 'click', (e) => {
  const bar = e.target && e.target.closest && e.target.closest('.bar');
  if (bar) select(bar.getAttribute('data-sym'));
});
on('#segs', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.seg');
  if (!b) return;
  state.filter = b.getAttribute('data-f');
  const all = document.querySelectorAll('#segs .seg');
  for (const n of all) n.setAttribute('aria-pressed', String(n === b));
  paintRail();
});
on('#ranges', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.rbtn');
  if (!b) return;
  const p = b.getAttribute('data-ma');
  if (p) {
    // MA buttons toggle independently; range buttons are mutually exclusive.
    // Sharing one handler means sharing one repaint, but not one selection rule.
    state.ma[p] = !state.ma[p];
    b.setAttribute('aria-pressed', String(state.ma[p]));
  } else {
    state.days = Number(b.getAttribute('data-d'));
    for (const n of document.querySelectorAll('#ranges .rbtn[data-d]'))
      n.setAttribute('aria-pressed', String(n === b));
  }
  const r = ROWS.find((x) => x.sym === state.sym);
  if (r) paintChart(r);
});
on('#q', 'input', (e) => { state.q = e.target.value || ''; paintRail(); });

const sheetOpen = (open) => { const s = $('#sheet'); if (!s) return;
  if (open) s.setAttribute('data-open','1'); else s.removeAttribute('data-open');
  // Data sits in the view nav, so its pressed state has to say whether the
  // overlay is up - however it was opened. A bar clicked on the Overview
  // opens the sheet too, and a nav button that stayed unpressed through that
  // would be lying about where the reader is.
  const b = $('#t-sheet');
  if (b) b.setAttribute('aria-pressed', String(!!open)); };
on('#t-sheet', 'click', () =>
  sheetOpen(!$('#sheet') || !$('#sheet').getAttribute('data-open')));
on('#t-close', 'click', () => sheetOpen(false));

/* -------------------------------------------------- the sheet, as a surface */

// Picking up a bucket from a bar or a fund row. The same key is written for
// every kind so the tables can filter on one rule; `kindLabel` is what the
// chip says, because "Sector Technology" reads and "sector technology" does
// not. Clicking the live filter again clears it - a toggle, not a trap.
const setFilter = (kind, key, label, kindLabel) => {
  const cur = SS.filter;
  SS.filter = (cur && cur.kind === kind && cur.key === key)
    ? null : {kind, key, label, kindLabel};
  paintSheet();
};

// Open a symbol in the main view. The sheet closes, because leaving it up
// would hide the chart the click just asked for.
const jump = (sym) => {
  if (!sym || !ROWSYM.has(sym)) return;
  sheetOpen(false);
  select(sym);
};

on('#vnav', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.vbtn');
  // Data is in this nav and is not a view. Without the guard it would call
  // setView(null) and hide both of them.
  if (b && b.getAttribute('data-view')) setView(b.getAttribute('data-view'));
});

// Every clickable thing on the Overview leads somewhere specific. A tile or a
// ranked row opens that position; a composition bar opens the data sheet
// already filtered to it. An overview whose charts are only pictures is the
// glorified list this view exists to replace.
on('#ovgrid', 'click', (e) => {
  const t = e.target;
  if (!t || !t.closest) return;
  const bar = t.closest('.xrow[data-fk]');
  if (bar) {
    const kind = bar.getAttribute('data-fk');
    sheetOpen(true);
    return setFilter(kind, bar.getAttribute('data-fv'),
      bar.getAttribute('data-fl'),
      {sector: 'Sector', country: 'Geography', industry: 'Industry'}[kind] || '');
  }
  const node = t.closest('[data-sym]');
  if (node) { setView('positions'); jump(node.getAttribute('data-sym')); }
});

on('#sheetnav', 'click', (e) => {
  if (!e.target || !e.target.closest) return;
  if (e.target.closest('#xclear')) { SS.filter = null; return paintSheet(); }
  const b = e.target.closest('.navb');
  if (!b) return;
  const id = b.getAttribute('data-go');
  // Jumping to a collapsed section opens it. Scrolling someone to a heading
  // with nothing under it is the navigation equivalent of a dead link.
  SS.shut[id] = false;
  paintSheet();
  const head = $(`#sheetbody h2[data-sec="${id}"]`);
  if (head) head.scrollIntoView({block: 'start', behavior: 'smooth'});
});

on('#sheetbody', 'click', (e) => {
  const t = e.target;
  if (!t || !t.closest) return;

  const head = t.closest('th.s');
  if (head) {
    const table = head.getAttribute('data-t'), k = head.getAttribute('data-k');
    const cur = SS.sort[table];
    SS.sort[table] = (cur && cur.k === k)
      ? {k, dir: -cur.dir}
      : {k, dir: Number(head.getAttribute('data-d0')) || -1};
    return paintSheet();
  }

  const h2 = t.closest('h2[data-sec]');
  if (h2) {
    const id = h2.getAttribute('data-sec');
    SS.shut[id] = !SS.shut[id];
    return paintSheet();
  }

  const bar = t.closest('.xrow[data-fk]');
  if (bar) return setFilter(bar.getAttribute('data-fk'),
    bar.getAttribute('data-fv'), bar.getAttribute('data-fl'),
    {sector: 'Sector', country: 'Geography', industry: 'Industry'}[
      bar.getAttribute('data-fk')] || '');

  const fund = t.closest('tr[data-fund]');
  if (fund) {
    const sym = fund.getAttribute('data-fund');
    return setFilter('fund', sym, sym, 'Inside');
  }

  const row = t.closest('[data-sym]');
  if (row) jump(row.getAttribute('data-sym'));
});

on('#xq', 'input', (e) => { SS.q = e.target.value || ''; paintSheet(); });

on('#xunits', 'click', (e) => {
  SS.units = SS.units === 'eur' ? 'pct' : 'eur';
  e.currentTarget.setAttribute('aria-pressed', String(SS.units === 'eur'));
  e.currentTarget.textContent = SS.units === 'eur' ? 'Show %' : 'Show €';
  paintSheet();
});

on('#xall', 'click', (e) => {
  const ids = [...document.querySelectorAll('#sheetbody h2[data-sec]')]
    .map((n) => n.getAttribute('data-sec'));
  const shutting = ids.some((id) => !SS.shut[id]);
  for (const id of ids) SS.shut[id] = shutting;
  e.currentTarget.setAttribute('aria-pressed', String(shutting));
  e.currentTarget.textContent = shutting ? 'Expand all' : 'Collapse all';
  paintSheet();
});

on('#t-theme', 'click', () => {
  let dark = false;
  try {
    const root = document.documentElement;
    dark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
  const b = $('#t-theme');
  if (b) { b.setAttribute('aria-pressed', String(dark)); b.textContent = dark ? 'Light' : 'Dark'; }
  retheme();
});

// Arrow keys walk the rail. It is a terminal; hands should not have to leave
// the keyboard to step through twenty-three names.
try {
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const rows = visible();
    const i = rows.findIndex((r) => r.sym === state.sym);
    const next = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) { e.preventDefault(); select(next.sym); }
  });
} catch (e) {}

paintTape();
paintOverview();
paintSheet();
// Positions is painted at boot even though Overview is what opens, so the
// first switch is instant. The rail, the head, the thesis and the weight strip
// all render fine into a hidden container because none of them measures
// anything. The chart is the exception and is deliberately NOT built here -
// see paintChart - so the first switch to Positions is what constructs it.
setView('overview');
if (ROWS.length) {
  select(state.sym);
} else {
  const l = $('#list');
  if (l) l.innerHTML = '<div class="empty">No positions and no watchlist rows.</div>';
}
</script>
