    const table = breakdown(buckets, unresolved, total);
    for (const r of table.rows) {
      r.direct_eur = R(direct.get(r.key) || 0, 2);
      r.indirect_eur = R(indirect.get(r.key) || 0, 2);
    }
    return table;
  }

  // exposure.py:185-210. Funds report no industries, so they are unresolved
  // here by construction.
  function industries(pos, LT, total) {
    const buckets = new Map();
    let unresolved = 0;
    for (const p of pos) {
      const value = p.value_eur;
      if (!value) continue;
      if (p.klass === 'fund') { unresolved += value; continue; }
      const name = (LT.stocks[p.symbol] || {}).industry;
      if (name) add(buckets, name, value);
      else unresolved += value;
    }
    const table = breakdown(buckets, unresolved, total);
    for (const r of table.rows) r.label = r.key;
    return table;
  }

  // exposure.py:215-256. Domicile for a stock, listing venue for a fund's
  // constituent - two proxies on one axis, and the basis line says so.
  function geography(pos, LT, total) {
    const buckets = new Map();
    let unresolved = 0;
    for (const p of pos) {
      const value = p.value_eur;
      if (!value) continue;
      if (p.klass === 'fund') {
        let placed = 0;
        for (const line of (LT.funds[p.symbol] || {}).top_holdings || []) {
          const country = countryFor(line.symbol);
          const pct = line.pct || 0;
          if (!country || !pct) continue;
          const part = value * pct / 100;
          add(buckets, country, part);
          placed += part;
        }
        unresolved += Math.max(0, value - placed);
      } else {
        const country = (LT.stocks[p.symbol] || {}).country;
        if (country) add(buckets, country, value);
        else unresolved += value;
      }
    }
    const table = breakdown(buckets, unresolved, total,
      {basis: 'stated domicile for directly-held stocks, '
            + 'listing venue for fund constituents'});
    for (const r of table.rows) r.label = r.key;
    return table;
  }

  // exposure.py:261-334. The indirect side is a floor: ten constituents per
  // fund are disclosed, and resolved_pct says how much of the book got named.
  function names(pos, LT, total) {
    const rows = new Map();
    let resolved = 0;
    const touch = (symbol, name) => {
      if (!rows.has(symbol)) {
        rows.set(symbol, {symbol, name: name || symbol,
                          direct_eur: 0, indirect_eur: 0, via: []});
      } else if (name && rows.get(symbol).name === symbol) {
        rows.get(symbol).name = name;
      }
      return rows.get(symbol);
    };
    for (const p of pos) {
      const value = p.value_eur;
      if (!value) continue;
      if (p.klass !== 'fund') {
        if (p.symbol) { touch(p.symbol, p.name).direct_eur += value; resolved += value; }
        continue;
      }
      for (const line of (LT.funds[p.symbol] || {}).top_holdings || []) {
        const child = line.symbol, pct = line.pct || 0;
        if (!child || !pct) continue;
        const part = value * pct / 100;
        const row = touch(child, line.name);
        row.indirect_eur += part;
        row.via.push({fund: p.symbol, pct: R(pct, 2), value_eur: R(part, 2)});
        resolved += part;
      }
    }
    const out = [];
    for (const r of rows.values()) {
      const t = r.direct_eur + r.indirect_eur;
      const s = LT.stocks[r.symbol] || {};
      r.via.sort((a, b) => b.value_eur - a.value_eur);
      out.push({
        symbol: r.symbol, name: r.name,
        direct_eur: R(r.direct_eur, 2), indirect_eur: R(r.indirect_eur, 2),
        value_eur: R(t, 2),
        pct: total ? R(t / total * 100, 2) : 0,
        direct_pct: total ? R(r.direct_eur / total * 100, 2) : 0,
        indirect_pct: total ? R(r.indirect_eur / total * 100, 2) : 0,
        held_both_ways: r.direct_eur > 0 && r.indirect_eur > 0,
        via: r.via,
        sector: sectorKey(s.sector),
        industry: s.industry || null,
        country: s.country || countryFor(r.symbol)});
    }
    out.sort((a, b) => b.value_eur - a.value_eur);
    return {rows: out, n: out.length, value_eur: R(resolved, 2),
            unresolved_eur: R(Math.max(0, total - resolved), 2),
            resolved_pct: total ? R(resolved / total * 100, 1) : 0,
            n_both_ways: out.filter((r) => r.held_both_ways).length};
  }

  // exposure.py:339-410. Every figure is a floor; disclosed_pct per side says
  // how much of each fund was visible at all.
  function overlap(pos, LT, total) {
    const lines = new Map(), sizes = new Map();
    for (const p of pos) {
      if (p.klass !== 'fund' || !p.symbol || !p.value_eur) continue;
      const m = new Map();
      for (const line of (LT.funds[p.symbol] || {}).top_holdings || []) {
        const child = line.symbol, pct = line.pct || 0;
        if (child && pct) add(m, child, pct);
      }
      if (m.size) { lines.set(p.symbol, m); sizes.set(p.symbol, p.value_eur); }
    }
    const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
    const sum = (arr) => arr.reduce((a, b) => a + b, 0);
    const keys = [...lines.keys()].sort(cmp);
    const pairs = [];
    keys.forEach((a, i) => {
      for (const b of keys.slice(i + 1)) {
        const A = lines.get(a), B = lines.get(b);
        // Same tiebreak as the Python: weight, then symbol.
        const shared = [...A.keys()].filter((c) => B.has(c))
          .sort((x, y) => ((B.get(y) + A.get(y)) - (A.get(x) + B.get(x))) || cmp(x, y));
        if (!shared.length) continue;
        const eur = sum(shared.map((c) =>
          sizes.get(a) * A.get(c) / 100 + sizes.get(b) * B.get(c) / 100));
        const share = (F) => {
          const all = sum([...F.values()]);
          return all ? R(sum(shared.map((c) => F.get(c))) / all * 100, 1) : 0;
        };
        pairs.push({a, b, shared, n_shared: shared.length,
                    n_a: A.size, n_b: B.size,
                    a_disclosed_in_shared_pct: share(A),
                    b_disclosed_in_shared_pct: share(B),
                    a_disclosed_pct: R(sum([...A.values()]), 1),
                    b_disclosed_pct: R(sum([...B.values()]), 1),
                    value_eur: R(eur, 2),
                    pct: total ? R(eur / total * 100, 2) : 0});
      }
    });
    pairs.sort((x, y) => y.value_eur - x.value_eur);
    return {pairs, n_pairs: pairs.length, n_funds: lines.size,
            n_substantial: pairs.filter((p) => Math.max(
              p.a_disclosed_in_shared_pct, p.b_disclosed_in_shared_pct) >= 50).length};
  }

  /* ---- analyse.coverage: analyse.py:488-591 ---- */

  // Coverage rows are per ISIN per account, one for one with D.holdings, so
  // the join is on both. `covered` is a Notion and config fact and is left
  // alone; what moves with a price is the euro, the weight and the drift.
  //
  // The join key is the account LABEL, not the account number: the coverage
  // table deliberately does not carry the number, and D.holdings does. Keying
  // on `account_no` therefore missed every single row - and because a missed
  // row just keeps Python's value, the parity check passed with a perfect
  // score against a function that wrote nothing at all. Caught by halving a
  // position and watching the coverage weights not move. `unmatched` is
  // returned so a future miss is a number on screen rather than silence.
  function coverage(cov, rows) {
    // The `or 1.0` floor is the original's, and it is load-bearing: an empty
    // book yields percentages against one euro rather than a divide by zero.
    const total = rows.reduce((a, h) => a + (h.value_eur || 0), 0) || 1;
    const by = new Map();
    for (const h of rows) by.set(h.isin + '|' + h.account, h);
    let unmatched = 0;
    for (const r of cov.rows || []) {
      const h = by.get(r.isin + '|' + r.account);
      if (!h) { unmatched += 1; continue; }   // no holding, nothing to restate
      r.value_eur = h.value_eur;
      r.weight_pct = R((h.value_eur || 0) / total * 100, 2);
      if (r.target_weight_pct != null) {
        r.drift_pts = R(r.weight_pct - r.target_weight_pct, 2);
      }
    }
    (cov.rows || []).sort((a, b) => (b.value_eur || 0) - (a.value_eur || 0));
    const uncovered = (cov.rows || []).filter((r) => !r.covered);
    const uncoveredValue = uncovered.reduce((a, r) => a + (r.value_eur || 0), 0);
    cov.value_total_eur = R(total, 2);
    cov.value_uncovered_eur = R(uncoveredValue, 2);
    // From the raw sum, not from the rounded euro figure above.
    cov.pct_uncovered = R(uncoveredValue / total * 100, 1);
    return unmatched;
  }

  /* ---- analyse.join_watchlist: the price-derived half ---- */

  // analyse.py:348-368 and 450-453. `price_at_eval`, `target`, `pe`,
  // `upside_at_eval` and everything else written down on the board are
  // RECORDED figures and are not touched here - CLAUDE.md rule 3. Only the
  // comparisons against today's price are restated.
  //
  // `live.pe`, `live.pb`, `live.ps` and `live.market_cap` are deliberately
  // left alone too. They are Yahoo's own figures at Yahoo's own asof, and the
  // price they were struck against is not in this payload - one holding quotes
  // in pence and its P/E is a hundred times the naive price-over-EPS, which is
  // exactly how a plausible-looking rescale goes wrong. They carry an asof and
  // they keep it.
  function watchlist(items) {
    for (const w of items) {
      const price = w.price_now, target = w.target, ev = w.price_at_eval;
      w.stale_price = price == null;
      w.drift_pct = (price && ev) ? R((price / ev - 1) * 100, 2) : null;
      w.upside_now = (price && target) ? R((target / price - 1) * 100, 1) : null;
      // Subtracts two already-rounded 1dp figures and rounds again, as the
      // original does. Reproduce it exactly or the decay alert quantises into
      // a different bucket than the one Telegram reported.
      w.upside_decay_pts = (w.upside_now != null && w.upside_at_eval != null)
        ? R(w.upside_now - w.upside_at_eval, 1) : null;
      const level = w.trigger_level;
      if (level && price) {
        w.trigger_gap_pct = R((level / price - 1) * 100, 1);
        w.trigger_hit = w.trigger_kind === 'below' ? price <= level : price >= level;
      } else {
        w.trigger_gap_pct = null;
        w.trigger_hit = null;
      }
      // In Yahoo's unit; price is in the board's (analyse.attach_fundamentals).
      const street = (w.live || {}).street_target * (w.price_scale || 1);
      w.street_upside_pct = (street && price)
        ? R((street / price - 1) * 100, 1) : null;
    }
    return items;
  }

  /* ---- reporting.py: the weights, which are value over value ---- */

  // reporting.py:134-222. A different denominator on purpose: it folds by
  // Yahoo symbol and DROPS anything without one, so the index funds are not in
  // its base. Restating it on the book's total instead would silently change
  // what every weight in that table means.
  function reporting(rep, rows) {
    const byKey = new Map();
    for (const h of rows) {
      const sym = h.yahoo;
      if (!sym || sym === 'MISSING') continue;
      byKey.set(sym, (byKey.get(sym) || 0) + (h.value_eur || 0));
    }
    const total = [...byKey.values()].reduce((a, v) => a + v, 0) || 0;
    // Counted, not shrugged off - for the same reason coverage counts. A join
    // that quietly matches nothing leaves Python's numbers in place and looks
    // exactly like a join that worked.
    let unmatched = 0;
    const restate = (list) => {
      for (const r of list || []) {
        const v = byKey.has(r.symbol || r.sym) ? byKey.get(r.symbol || r.sym) : null;
        if (v == null) { unmatched += 1; continue; }
        r.value_eur = R(v, 2);
        r.weight_pct = (total && v) ? R(v / total * 100, 2) : 0;
      }
    };
    const cal = rep.calendar || {};
    restate(cal.rows); restate(cal.unknown); restate(rep.latest);
    // reporting.py:174-186. The headline "n prints, x% of the book" sat on the
    // Overview and the Earnings section as the build's share while every row
    // under it moved.
    if (cal.rows) {
      const ahead = cal.rows.reduce((a, r) => a + (byKey.get(r.symbol || r.sym) || 0), 0);
      cal.value_ahead_eur = R(ahead, 2);
      cal.pct_ahead = total ? R(ahead / total * 100, 1) : 0;
    }
    (cal.rows || []).sort((a, b) => String(a.date).localeCompare(String(b.date))
                                    || b.weight_pct - a.weight_pct);
    (cal.unknown || []).sort((a, b) => b.weight_pct - a.weight_pct);
    (rep.latest || []).sort((a, b) => String(b.date).localeCompare(String(a.date))
                                      || b.weight_pct - a.weight_pct);
    return unmatched;
  }

  /* ---- analyse.alerts: the flags, restated on the live price ---- */

  // analyse.py alerts(). Until this existed every flag on the page - the tape
  // count, the rail dots, the Flagged filter, the Overview card, the pane's
  // FLAGS - was the build's list, while the numbers beside them moved. A name
  // could read HIT in its own pane with no trigger flag anywhere, and a flag
  // could go on claiming "3.1% from its trigger" of a price an hour gone.
  //
  // Only the kinds analyse.alerts writes are rebuilt, in its order and with
  // its wording to the character, because the same sentence goes to Telegram
  // and the two must never disagree about what a flag says. Health problems
  // ride in that list unchanged. reporting.alerts and activity.alerts, which
  // cockpit.py appends after the sort, are kept exactly as built: they read
  // the calendar and the export diff, not a price.
  const OWN = ['coverage:', 'weight-drift:', 'trigger-hit:', 'check-due:',
               'inflection:', 'trigger-near:', 'decay:', 'multiple-stale:'];
  let BUILT_ALERTS = null;

  // Python's formatting, not JS's. They differ in exactly the places a flag
  // lives: a tie rounds to even in Python and away from zero in toFixed, and
  // str(120.0) is "120.0" where String(120) is "120".
  const pyFixed = (x, d) => {
    const m = Math.pow(10, d), t = x * m;
    return Math.abs(t % 1) === 0.5 ? (2 * Math.round(t / 2) / m).toFixed(d) : x.toFixed(d);
  };
  const pyRound = (x) => Math.abs(x % 1) === 0.5 ? 2 * Math.round(x / 2) : Math.round(x);
  const pyComma = (x) => pyFixed(x, 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const pySigned = (x, d) => (x >= 0 ? '+' : '') + pyFixed(x, d);
  const pyG = (x) => String(Number(x.toPrecision(6)));
  const pyStr = (x) => Number.isInteger(x) ? x.toFixed(1) : String(x);

  // analyse.days_until. Calendar days, both ends read as dates - no clock and
  // no timezone, so the answer is the same as Python's on the same day.
  const dayNum = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000 : null;
  };
  const daysUntil = (s, today) => {
    const a = dayNum(s), b = dayNum(today);
    return a == null || b == null ? null : a - b;
  };

  function alerts(items, cover, th, today) {
    if (!BUILT_ALERTS) BUILT_ALERTS = (D.alerts || []).slice();
    // An older payload without these thresholds cannot be restated honestly.
    // It keeps its build list, and STATS says so.
    const need = ['weight_drift_pct', 'multiple_drift_pct', 'check_soon_days',
                  'trigger_near_pct', 'decay_alert_pts'];
    if (!th || need.some((k) => th[k] == null)) return false;

    for (const w of items) {
      w.days_to_check = daysUntil(w.next_check, today);
      w.days_to_inflection = daysUntil(w.inflection_date, today);
      const since = daysUntil(w.last_eval, today);
      w.days_since_eval = since == null ? null : -since;
    }

    const found = [];
    if (cover && cover.n_uncovered) {
      const biggest = (cover.rows || []).filter((r) => !r.covered).slice(0, 3);
      found.push({level: 'warning', key: `coverage:${cover.n_uncovered}`,
        title: `${pyFixed(cover.pct_uncovered, 0)}% of the book ` +
               `(${cover.n_uncovered} holdings) is not being monitored`,
        detail: biggest.map((r) => `${r.ticker} EUR ${pyComma(r.value_eur)} - ${r.gap}`)
                       .join('; ')});
    }
    for (const r of (cover || {}).rows || []) {
      const drift = r.drift_pts;
      if (drift == null || Math.abs(drift) <= th.weight_drift_pct) continue;
      if (r.target_basis === 'placeholder') continue;
      const side = drift > 0 ? 'above' : 'below';
      found.push({level: 'warning', key: `weight-drift:${r.ticker}:${pyRound(drift)}`,
        title: `${r.ticker} is ${pyFixed(Math.abs(drift), 1)} pts ${side} its ` +
               `${pyG(r.target_weight_pct)}% target weight`,
        detail: `EUR ${pyComma(r.value_eur)}, ${pyFixed(r.weight_pct, 1)}% of ` +
                `the book against a ${pyG(r.target_weight_pct)}% target. ` +
                `The band is ${pyG(th.weight_drift_pct)} pts.`});
    }
    for (const w of items) {
      if (!w.trigger_hit) continue;
      found.push({level: 'critical', key: `trigger-hit:${w.ticker}`,
        title: `${w.ticker} has hit its written trigger`,
        detail: `Live ${pyFixed(w.price_now, 2)} ${w.ccy} vs trigger ` +
                `${pyStr(w.trigger_level)}. ${w.trigger}`});
    }
    for (const w of items) {
      const days = w.days_to_check;
      if (days == null || days < 0 || days > th.check_soon_days) continue;
      found.push({level: 'warning', key: `check-due:${w.ticker}:${w.next_check}`,
        title: `${w.ticker} catalyst in ${days} days (${w.next_check})`,
        detail: w.trigger || ''});
    }
    for (const w of items) {
      const days = w.days_to_inflection;
      if (days == null || days < 0 || days > th.check_soon_days) continue;
      const event = (w.inflection_event || '').trim();
      found.push({level: 'warning', key: `inflection:${w.ticker}:${w.inflection_date}`,
        title: `${w.ticker}: ${event || 'inflection event'} in ` +
               `${days} days (${w.inflection_date})`,
        detail: w.thesis || w.trigger || 'No thesis written for this name.'});
    }
    for (const w of items) {
      const gap = w.trigger_gap_pct;
      if (gap == null || w.trigger_hit || Math.abs(gap) > th.trigger_near_pct) continue;
      found.push({level: 'warning', key: `trigger-near:${w.ticker}`,
        title: `${w.ticker} is ${pyFixed(Math.abs(gap), 1)}% from its trigger`,
        detail: `Live ${pyFixed(w.price_now, 2)} ${w.ccy}, ` +
                `trigger at ${pyStr(w.trigger_level)}.`});
    }
    for (const w of items) {
      const decay = w.upside_decay_pts;
      if (decay == null || Math.abs(decay) < th.decay_alert_pts) continue;
      found.push({level: decay < 0 ? 'warning' : 'good',
        key: `decay:${w.ticker}:${pyRound(decay)}`,
        title: `${w.ticker} upside ${decay > 0 ? 'widened' : 'narrowed'} ` +
               `${pyFixed(w.upside_at_eval, 1)}% -> ${pyFixed(w.upside_now, 1)}%`,
        detail: `Price moved ${pySigned(w.drift_pct, 1)}% since the ` +
                `${w.last_eval} check. The board still says ` +
                `${pyFixed(w.upside_at_eval, 1)}%.`});
    }
    for (const w of items) {
      const drift = w.pe_drift_pct;
      if (drift == null || Math.abs(drift) < th.multiple_drift_pct) continue;
      const live = (w.live || {}).pe;
      found.push({level: 'warning', key: `multiple-stale:${w.ticker}:${pyRound(drift / 10)}`,
        title: `${w.ticker}: today's P/E is ${pyFixed(Math.abs(drift), 0)}% ` +
               `${drift > 0 ? 'above' : 'below'} the board's`,
        detail: `The board says ${pyG(w.pe)}` +
                (w.last_eval ? `, typed at the ${w.last_eval} check` : ' and never dated') +
                `; Yahoo says ${pyFixed(live, 1)} today. The multiple in that ` +
                'write-up is not the one you own now.'});
    }
    for (const a of BUILT_ALERTS) if (a.health) found.push(a);

    const order = {critical: 0, warning: 1, good: 2};
    const rank = (a) => (a.level in order ? order[a.level] : 3);
    // Array.prototype.sort is stable, as Python's sort is.
    found.sort((a, b) => rank(a) - rank(b));
    const appended = BUILT_ALERTS.filter((a) => !a.health &&
      !OWN.some((p) => String(a.key || '').startsWith(p)));
    // In place, for the same reason as D.overview: anything holding D.alerts
    // must see the restated list, not the boot-time one.
    D.alerts = D.alerts || [];
    D.alerts.length = 0;
    D.alerts.push(...found, ...appended);
    return true;
  }

  // Today on this machine's calendar, as Python's date.today() reads it.
  const localToday = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-` +
           String(d.getDate()).padStart(2, '0');
  };

  /* ---- the one entry point ---- */

  // Static facts the recompute needs and cannot derive: which ISIN is a fund,
  // and what each fund's published TER and disclosure are. Read once, from the
  // build-time payload, because none of them move with a price.
  let META = null, STATS = null;
  function meta() {
    if (META) return META;
    const klass = new Map();
    for (const r of (D.coverage || {}).rows || []) klass.set(r.isin, r.klass);
    const klassByKey = new Map();
    for (const h of D.holdings || []) klassByKey.set(ovKey(h), klass.get(h.isin));
    const ter = new Map(), fundMeta = new Map();
    for (const f of (D.exposure || {}).funds || []) {
      ter.set(f.symbol, f.ter_pct == null ? null : f.ter_pct);
      fundMeta.set(f.symbol, f);
    }
    META = {klass, klassByKey, ter, fundMeta};
    return META;
  }

  // Recompute every price-derived figure in D from D.holdings, in place.
  //
  // Order matters once: the per-holding figures are restated first, because
  // value_eur is rounded to the cent BEFORE anything downstream divides by it.
  // Deriving a weight from the unrounded product disagrees with Python in the
  // last digit across several dozen fields at once.
  function all(today) {
    today = today || localToday();
    const M = meta();
    const rows = D.holdings || [];
    holdings(rows);

    // render.py:28-39. Note pl_pct falls back to 0, not null, here - and to
    // null on a single holding. Two fallbacks for the same condition, both
    // transcribed rather than harmonised, because harmonising them here would
    // put a number on screen that the Telegram message does not agree with.
    // Assigned INTO the existing objects, never over them. The page captures
    // `const OV = D.overview` once at module scope; swapping in a fresh object
    // would leave every one of those captures pointing at the boot-time answer
    // while D itself moved on - which is the exact failure this whole module
    // exists to remove, reintroduced one level up.
    const value = R(rows.reduce((a, h) => a + (h.value_eur || 0), 0), 2);
    const cost = R(rows.reduce((a, h) => a + (h.cost_eur || 0), 0), 2);
    D.totals = D.totals || {};
    Object.assign(D.totals, {
      value_eur: value, cost_eur: cost, pl_eur: R(value - cost, 2),
      pl_pct: cost ? R((value / cost - 1) * 100, 2) : 0,
    });

    const folded = fold(rows, M.klassByKey);
    const ovTotal = folded.reduce((a, r) => a + r.value_eur, 0);
    D.overview = D.overview || {};
    Object.assign(D.overview, {
      rows: folded, n: folded.length, value_eur: R(ovTotal, 2),
      day: dayMove(folded), allocation: allocation(folded, ovTotal),
      movers: movers(folded), contributors: contributors(folded),
      totals: D.totals,
    });

    const pos = positions(rows, M);
    const expTotal = pos.reduce((a, p) => a + p.value_eur, 0);
    D.exposure = D.exposure || {};
    Object.assign(D.exposure, {
      total_eur: R(expTotal, 2), n_positions: pos.length,
      concentration: concentration(pos, expTotal),
      fees: fees(pos, M.ter, expTotal),
      funds: funds(pos, expTotal, M.fundMeta),
    });
    // Multiples are deliberately not in this list: see the note at the top of
    // this module. Only the linear breakdowns follow a price.
    const LT = D.lookthrough;
    if (LT) {
      Object.assign(D.exposure, {
        sectors: sectors(pos, LT, expTotal),
        industries: industries(pos, LT, expTotal),
        geography: geography(pos, LT, expTotal),
        names: names(pos, LT, expTotal),
        overlap: overlap(pos, LT, expTotal),
      });
    }

    // Every join's misses, kept. A recompute that silently restates nothing is
    // indistinguishable from one that restates everything correctly - both
    // leave Python's numbers on screen - so the only way to tell them apart is
    // to count. STATS is what `health()` reads and what the mutation harness
    // asserts on.
    STATS = {
      holdings: rows.length,
      folded: folded.length,
      positions: pos.length,
      // A fund whose TER is unresolved is a known gap, not a miss: it is
      // already reported as unresolved_eur. This counts a fund the fees table
      // could not find at all.
      funds_untermed: D.exposure.fees.rows.filter((r) => r.ter_pct == null).length,
      // Whether the look-through was restated at all. False means the payload
      // carried no composition and those breakdowns are Python's, as at build.
      lookthrough: !!LT,
      coverage_unmatched: D.coverage ? coverage(D.coverage, rows) : 0,
      reporting_unmatched: D.reporting ? reporting(D.reporting, rows) : 0,
      watchlist: D.watchlist ? watchlist(D.watchlist).length : 0,
    };
    // Last: it reads the coverage and watchlist figures restated just above.
    // False means the flags on screen are the build's, and the page says so.
    STATS.alerts = alerts(D.watchlist || [], D.coverage, D.thresholds, today);
  }

  /* ---- the proof ---- */

  // Run the whole recompute against the prices the file was built with and
  // compare, field by field, with what Python wrote. Any disagreement beyond
  // one unit in the last decimal place the original rounds to is a defect in
  // this port, and it is reported rather than absorbed.
  //
  // Deep-copies the payload first, so asking the question cannot change the
  // answer.
  function parity() {
    const before = JSON.parse(JSON.stringify({
      totals: D.totals, overview: D.overview, exposure: D.exposure,
      coverage: D.coverage, watchlist: D.watchlist, reporting: D.reporting,
      holdings: D.holdings, alerts: D.alerts}));
    // On the build's own calendar day. Parity asks whether the port reproduces
    // Python on Python's inputs, and "today" is one of them: a catalyst 12
    // days out at build is 11 days out tomorrow, and that is not a defect.
    all(String(D.generated || '').slice(0, 10) || undefined);
    const bad = [], near = [];
    let checked = 0;
    const walk = (path, was, now, tol) => {
      if (was === now) { checked += 1; return; }
      if (was == null || now == null) {
        checked += 1;
        if (was !== now) bad.push({path, was, now});
        return;
      }
      if (typeof was === 'number' && typeof now === 'number') {
        checked += 1;
        const d = Math.abs(was - now);
        // Reported, not absorbed. A tolerance that quietly swallows a
        // systematic last-digit drift is a tolerance that will later swallow
        // the first real divergence too - `near` being empty is the evidence
        // that the tolerance is currently doing no work at all.
        if (d > tol) bad.push({path, was, now});
        else if (d > 1e-9) near.push({path, was, now});
        return;
      }
      if (Array.isArray(was) && Array.isArray(now)) {
        if (was.length !== now.length) { bad.push({path: path + '.length',
          was: was.length, now: now.length}); return; }
        was.forEach((v, i) => walk(path + '[' + i + ']', v, now[i], tol));
        return;
      }
      if (was && now && typeof was === 'object') {
        for (const k of Object.keys(was)) walk(path + '.' + k, was[k], now[k], tol);
        return;
      }
      checked += 1;
      if (String(was) !== String(now)) bad.push({path, was, now});
    };
    // One cent, and one unit in the last place of the coarsest percentage.
    // Tighter than that is measuring float noise, not agreement.
    const T = 0.011;
    walk('totals', before.totals, D.totals, T);
    walk('overview', before.overview, D.overview, T);
    walk('exposure.total_eur', before.exposure.total_eur, D.exposure.total_eur, T);
    walk('exposure.concentration', before.exposure.concentration,
         D.exposure.concentration, T);
    walk('exposure.fees', before.exposure.fees, D.exposure.fees, T);
    walk('exposure.funds', before.exposure.funds, D.exposure.funds, T);
    if (D.lookthrough) {
      for (const k of ['sectors', 'industries', 'geography', 'names', 'overlap']) {
        walk('exposure.' + k, before.exposure[k], D.exposure[k], T);
      }
    }
    walk('coverage', before.coverage, D.coverage, T);
    walk('watchlist', before.watchlist, D.watchlist, T);
    walk('reporting', before.reporting, D.reporting, T);
    walk('holdings', before.holdings, D.holdings, T);
    // Exact: every field is a string, and the strings are what Telegram sends.
    if (STATS.alerts) walk('alerts', before.alerts, D.alerts, 0);
    return {ok: !bad.length, checked, mismatches: bad.slice(0, 40),
            n_mismatches: bad.length,
            n_near: near.length, near: near.slice(0, 40)};
  }

  return {all, parity, stats: () => STATS,
          squarify, fold, dayMove, allocation, concentration};
})();

// Run at boot, before anything reads D - so the very first paint is already the
// ported arithmetic's output rather than Python's, and any disagreement between
// the two is visible immediately instead of appearing the moment a price lands.
// Shipping a port that only runs when the data has already changed means the
// one run you can check is the one run you never do.
const PARITY = DERIVE.parity();

// Folded once at boot, and again every time live prices land. This is a
// function rather than straight-line code for precisely that reason: the live
// layer has to rebuild these rows under the same rules, and a second copy of
// this loop would drift from this one the first time either changed.
//
// Note the rows here are NEW objects, not references into D.holdings, and
// value_eur is summed across custody accounts. So a live update cannot patch
// these in place - it writes the per-account rows in D.holdings and calls this
// again.
function foldHoldings() {
  held.clear();
  for (const h of D.holdings || []) {
    const sym = h.yahoo || h.ticker;
    if (!sym) continue;
    const cur = held.get(sym) || {sym, name:h.name, ticker:h.ticker, ccy:h.ccy,
      units:0, cost_eur:0, value_eur:0, price:h.price, day_pct:h.day_pct,
      off_high:h.off_high, bucket:h.bucket, accounts:[], stale:h.stale};
    cur.units += h.units || 0;
    cur.cost_eur += h.cost_eur || 0;
    cur.value_eur += h.value_eur || 0;
    if (h.account && !cur.accounts.includes(h.account)) cur.accounts.push(h.account);
    held.set(sym, cur);
  }
  for (const h of held.values()) {
    // Computed here, once, rather than re-inferred at each of the four places
    // a price is printed. A folded position takes its lots' price, so it takes
    // their freshness with it.
    h.freshness = freshnessOf(h.price, h.stale, h.sym);
    h.pl_eur = h.value_eur - h.cost_eur;
    h.pl_pct = h.cost_eur ? (h.value_eur / h.cost_eur - 1) * 100 : null;
    h.weight = D.totals.value_eur ? (h.value_eur / D.totals.value_eur) * 100 : 0;
  }
}
foldHoldings();

const watch = new Map();
for (const w of D.watchlist || []) {
  const sym = w.yahoo || w.ticker;
  if (sym) watch.set(sym, w);
}

// Coverage is per held position and carries its own `yahoo`, so the join needs
// no mapping the page would have to re-derive. Positions are per ISIN per
// account; a symbol held in both would land twice, and the one that matters is
// the uncovered one - a gap in either account is a gap.
const COV = (D.coverage || {});
const coverBy = new Map();
for (const c of COV.rows || []) {
  const sym = c.yahoo || c.ticker;
  if (!sym) continue;
  const prev = coverBy.get(sym);
  if (!prev || (prev.covered && !c.covered)) coverBy.set(sym, c);
}

// An alert names its subject in the key and again in the title. Matching on the
// symbol string covers both shapes without the analyser having to promise one.
const alertsFor = (sym) => (D.alerts || []).filter(
  (a) => (String(a.key || '') + ' ' + String(a.title || '')).includes(sym));
// analyse.alerts' own sort order: lower is more urgent.
const SEV = {critical: 0, warning: 1, good: 2};

// Rebuilt, not patched, for the same reason foldHoldings() is: `h` here is a
// reference into the folded map, and foldHoldings() replaces those objects
// wholesale. When this was a one-shot `const ROWS = [...]` the sheet updated on
// every tick and the rail, the strip and the detail pane went on rendering
// through references to objects nothing wrote to any more - the same page
// showing two different prices for the same holding, forty pixels apart.
const ROWS = [];
const ROWSYM = new Set();

function buildRows() {
  const rows = [...new Set([...held.keys(), ...watch.keys()])].map((sym) => {
  const h = held.get(sym), w = watch.get(sym);
  const flags = alertsFor(sym);
  return {
    sym, h, w, flags,
    cov: coverBy.get(sym) || null,
    ind: (D.indicators || {})[sym] || null,
    label: (w && w.ticker) || (h && h.ticker) || sym,
    company: (w && w.company) || (h && h.name) || sym,
    isHeld: !!h,
    price: (h && h.price) != null ? h.price : (w ? w.price_now : null),
    freshness: h ? h.freshness
      : freshnessOf(w ? w.price_now : null, w && w.stale_price, sym),
    ccy: (h && h.ccy) || (w && w.ccy) || '',
    // A watch-only name gets its day move from the live layer too; it was
    // written there and never read, so the rail showed a blank beside a price
    // that was plainly moving.
    day_pct: h ? h.day_pct : (w && w.day_pct != null ? w.day_pct : null),
    value_eur: h ? h.value_eur : null,
    weight: h ? h.weight : 0,
    // The most severe, by rank. The old fold let a later `good` overwrite an
    // earlier `warning`, so a name with both showed the calm dot.
    worst: flags.reduce((acc, a) =>
      acc && (SEV[acc] ?? 3) <= (SEV[a.level] ?? 3) ? acc : a.level, null),
  };
}).sort((a, b) => (b.value_eur || 0) - (a.value_eur || 0) ||
                  a.label.localeCompare(b.label));
  // Emptied and refilled rather than reassigned, so every closure that already
  // captured ROWS keeps seeing the live array.
  ROWS.length = 0;
  ROWS.push(...rows);
  // What `select()` can actually open. The sheet's tables reach further than
  // the rail does - the look-through names companies that are only inside a
  // fund and have no chart of their own - so a row is offered as a click only
  // when there is somewhere for the click to go. Marking every row clickable
  // and having most of them do nothing teaches you to stop clicking.
  ROWSYM.clear();
  for (const r of ROWS) ROWSYM.add(r.sym);
  return ROWS;
}
buildRows();

let state = {sym: ROWS.length ? ROWS[0].sym : null, view:'overview',
             filter:'all', q:'', days:365, ma:{50:true, 200:true}};

/* ----------------------------------------------------------------- tape */

function paintTape() {
  const t = D.totals || {}, s = D.sources || {}, hs = D.health || {};
  // The tape is the ticker: it follows you to Positions, so it carries the two
  // numbers that must be true everywhere and nothing else. It used to carry
  // four - value, P/L in percent, P/L in euros and the IRR - and the Overview's
  // headline band repeated three of them verbatim forty pixels below, at a
  // larger size and with a subtitle. Each figure has one home now: the euro P/L
  // and the annualised return live in the band, where there is room to say what
  // they are measured against.
  $('#t-value').textContent = eur(t.value_eur);
  $('#t-pl').innerHTML = `<b class="${cls(t.pl_pct)}"
    title="Since purchase, against ${eur(t.cost_eur)} of cost">${pct(t.pl_pct)}</b>`;

  const live = s.equity_log_mode === 'live';
  const flags = (D.alerts || []).filter((a) => !a.health).length;
  const stale = s.nordnet_export_age_days > (D.thresholds || {}).csv_stale_days;
  // Coverage sits on the tape rather than three clicks away because it is the
  // one number that says how much of this page is decoration. A position with
  // no thesis and no target weight cannot be judged by anything here.
  const nCov = (COV.rows || []).length;
  const nMon = nCov - (COV.n_uncovered || 0);
  const covChip = nCov
    ? `<span title="${eur(COV.value_uncovered_eur)} of ${eur(COV.value_total_eur)} sits in
        ${COV.n_uncovered} positions with no thesis (stocks) or no target weight (funds)."
        ><b>${nMon}</b>/${nCov} monitored<span style="color:var(--muted)"> · </span><b
        class="${COV.pct_uncovered > 0 ? 'dn-t' : ''}">${(COV.pct_uncovered || 0).toFixed(0)}%</b>
        of value unwatched</span>`
    : '';
  $('#t-meta').innerHTML = [
    `<b>${held.size}</b> held`,
    `<b>${watch.size}</b> watched`,
    `<b class="${flags ? 'dn-t' : ''}">${flags}</b> flag${flags === 1 ? '' : 's'}`,
    covChip,
    // The clock the prices were taken at. Without it an afternoon page and a
    // breakfast page are indistinguishable, which is the whole reason the
    // intraday refresh exists - and a page that refreshed but does not say so
    // is no more trustworthy than one that did not.
    `Priced <b title="${esc(D.generated || '')}${s.run_mode === 'refresh'
        ? ` · intraday refresh; board last read ${esc(s.last_full_run || '')}`
        : ' · full run'}">${esc((D.generated || '').slice(11, 16))}</b>`,
    // The live chip sits BESIDE the render clock and never replaces it. The
    // render clock is the recorded figure - the evidence of when this file was
    // built - and overwriting it with a live time would destroy the only
    // signal that the underlying book is old (CLAUDE.md rule 3). A page whose
    // prices are two seconds old and whose positions are four days old should
    // say both, not average them into one reassuring number.
    liveChip(),
    `CSV <b class="${stale ? 'dn-t' : ''}">${s.nordnet_export_age_days}d</b>`,
    `Notion <b>${live ? 'live' : 'cached'}</b>`,
  ].filter(Boolean).map((f) => `<span class="f">${f}</span>`)
   .join('<span style="color:var(--axis);margin:0 8px">·</span>');

  // A failed parity check is a health problem, not a console warning. If the
  // JS recompute disagrees with the Python that produced this file, every
  // figure the live layer touches is suspect - and the reader is the one
  // person who needs to know that before acting on one. Nobody has the console
  // open, so a defect that only logs there is a defect nobody ever learns
  // about.
  const problems = (hs.problems || []).slice();
  if (typeof PARITY !== 'undefined' && !PARITY.ok) {
    problems.unshift({level: 'critical', title:
      `recompute disagrees with the build in ${PARITY.n_mismatches} of `
      + `${PARITY.checked} fields (first: ${PARITY.mismatches[0].path})`});
  }
  const st = (typeof DERIVE !== 'undefined') ? DERIVE.stats() : null;
  if (st && (st.coverage_unmatched || st.reporting_unmatched)) {
    // A join that matches nothing leaves the build-time numbers in place and
    // looks identical to one that worked. It said so once by accident; now it
    // says so on purpose.
    problems.unshift({level: 'warning', title:
      `${st.coverage_unmatched + st.reporting_unmatched} rows could not be `
      + `rejoined to a holding and still show build-time figures`});
  }
  if (problems.length) {
    const worst = problems.some((p) => p.level === 'critical') ? 'critical' : 'warning';
    $('#t-banner').innerHTML =
      `<div class="banner"><span class="dot" style="background:${LEVEL[worst]}"></span>` +
      `<span><b>${esc(hs.headline || '')}</b> ` +
      `<span class="why">${problems.map((p) => esc(p.title)).join(' · ')}</span></span></div>`;
  }
}

/* ----------------------------------------------------------------- rail */

function visible() {
  const q = state.q.trim().toLowerCase();
  return ROWS.filter((r) => {
    if (state.filter === 'held'  && !r.isHeld) return false;
    if (state.filter === 'watch' && !r.w) return false;
    if (state.filter === 'flag'  && !r.flags.length) return false;
    if (q && !(r.label + ' ' + r.company).toLowerCase().includes(q)) return false;
    return true;
  });
}

function paintRail() {
  const rows = visible();
  if (!rows.length) {
    $('#list').innerHTML = '<div class="empty">Nothing matches that filter.</div>';
    return;
  }
  $('#list').innerHTML = rows.map((r) => `
    <div class="row" data-sym="${esc(r.sym)}" role="option"
         aria-selected="${r.sym === state.sym}">
      <div class="sym">${esc(r.label)}${r.worst
        ? `<i class="dot" style="background:${LEVEL[r.worst]}"></i>` : ''}${
        r.cov && !r.cov.covered
          ? `<i class="ring" title="Not monitored — ${esc(r.cov.gap || '')}"></i>` : ''}</div>
      <div class="px num">${fresh(r.freshness)}${px(r.price)}</div>
      <div class="co">${esc(r.company)}</div>
      <div class="chg num ${cls(r.day_pct)}">${r.isHeld
        ? pct(r.day_pct, 1) : '<span style="color:var(--muted)">watch</span>'}</div>
    </div>`).join('');
}

/* ------------------------------------------------------------- mid pane */

function paintHead(r) {
  const wk = r.w;
  $('#symhead').innerHTML = `
    <span class="tk">${esc(r.label)}</span>
    <span class="co">${esc(r.company)}</span>
    ${wk && wk.verdict ? verdictBadge(wk.verdict) : ''}
    <span class="px num">${fresh(r.freshness)}${px(r.price)}<span style="font-size:var(--t-3);
      color:var(--muted);margin-left:5px">${esc(r.ccy)}</span></span>
    <span class="chg num ${cls(r.day_pct)}">${r.day_pct == null ? '' : pct(r.day_pct)}</span>`;
}

function verdictBadge(v) {
  const k = String(v).toLowerCase();
  const c = k.includes('buy') || k.includes('add') ? 'b-buy'
          : k.includes('trim') ? 'b-trim'
          : k.includes('exit') || k.includes('sell') ? 'b-exit' : 'b-watch';
  return `<span class="badge ${c}">${esc(v)}</span>`;
}

function paintStrip() {
  const withValue = ROWS.filter((r) => r.value_eur > 0);
  $('#stripnote').textContent =
    `${withValue.length} positions · ${(D.sources || {}).lots} lots · ` +
    `width is share of ${eur(D.totals.value_eur)}`;
  $('#bars').innerHTML = withValue.map((r) => `
    <div class="bar" data-sym="${esc(r.sym)}" data-sel="${r.sym === state.sym ? 1 : 0}"
      style="flex:${r.weight.toFixed(3)} 1 0"
      title="${esc(r.label)} — ${r.weight.toFixed(1)}% · ${eur(r.value_eur)}"></div>`
  ).join('');
}

/* --------------------------------------------------------- thesis pane */

function paintThesis(r) {
  const w = r.w, h = r.h, out = [];

  if (w) {
    const decay = w.upside_decay_pts;

    /* The thesis leads, because it is the thing the rest of this pane is
       evidence for or against. Empty says so out loud rather than collapsing
       the section - a name whose reason to be held was never written down is
       the finding, not a rendering gap. */
    const infl = w.inflection_date
      ? `<dl class="kv under">
         <dt>Settles on</dt><dd>${esc(w.inflection_date)}${w.days_to_inflection == null
           ? '' : ` <span style="color:var(--muted)">${w.days_to_inflection}d</span>`}</dd>
         ${w.inflection_event ? `<dt>Event</dt><dd>${esc(w.inflection_event)}</dd>` : ''}
         </dl>` : '';
    // The empty-thesis line used to assert "the board carries a target and a
    // trigger for this name" unconditionally - for a name with neither, the
    // page said so anyway. It is derived now: it lists what the board actually
    // records, and says plainly when the answer is nothing.
    const onBoard = [w.target != null && 'a target',
                     w.trigger_level != null && 'a trigger'].filter(Boolean);
    const noThesis = 'No thesis written. ' + (onBoard.length
      ? `The board records ${onBoard.join(' and ')} for this name but never `
        + 'why it is owned — so there is nothing here for the price to agree '
        + 'or disagree with.'
      : 'The board records no target, no trigger and no reason: this position '
        + 'is held without a written view of any kind.');
    out.push(`<div class="tsec"><div class="tlabel">THE THESIS</div>
      <div class="prose"${w.thesis ? '' : ' style="color:var(--muted)"'}>${
        w.thesis ? esc(w.thesis) : noThesis
      }</div>${infl}</div>`);

    out.push(`<div class="tsec"><div class="tlabel">THE CALL</div><dl class="kv">
      <dt>Verdict</dt><dd>${verdictBadge(w.verdict || '—')}</dd>
      <dt>Tier</dt><dd>${esc(w.tier || '—')}</dd>
      <dt>Target</dt><dd>${px(w.target)} ${esc(w.ccy || '')}</dd>
      <dt>Upside now</dt><dd class="${cls(w.upside_now)}">${pct(w.upside_now, 1)}</dd>
      <dt>Upside at eval</dt><dd>${pct(w.upside_at_eval, 1)}</dd>
      <dt>Drift since eval</dt><dd class="${cls(w.drift_pct)}">${pct(w.drift_pct, 1)}</dd>
      <dt>Last evaluated</dt><dd>${esc(w.last_eval || '—')}${w.days_since_eval == null
        ? '' : ` <span style="color:var(--muted)">${w.days_since_eval}d</span>`}</dd>
      <dt>Next check</dt><dd>${esc(w.next_check || '—')}${w.days_to_check == null
        ? '' : ` <span style="color:var(--muted)">${w.days_to_check}d</span>`}</dd>
      </dl>${Math.abs(decay || 0) >= (D.thresholds || {}).decay_alert_pts
        ? `<div class="prose under" style="color:var(--warn-ink)">
           ⚠ The board still claims ${pct(w.upside_at_eval, 1)}; today it is
           ${pct(w.upside_now, 1)} — <b>${Math.abs(decay).toFixed(1)} points</b>
           of decay. The thesis has not been re-checked since ${esc(w.last_eval)}.</div>` : ''}
      </div>`);

    out.push(`<div class="tsec"><div class="tlabel">WHAT WOULD CHANGE YOUR MIND</div>
      ${w.trigger_level ? `<dl class="kv over">
        <dt>Level</dt><dd>${esc(w.trigger_kind || '')} ${px(w.trigger_level)}</dd>
        <dt>Gap to level</dt><dd class="${w.trigger_hit ? 'dn-t' : ''}">
          ${pct(w.trigger_gap_pct, 1)}${w.trigger_hit ? ' · HIT' : ''}</dd></dl>`
        : `<div class="prose over" style="color:var(--muted)">
           No price level parsed from this trigger — it is a condition, not a
           number. Read it and judge for yourself.</div>`}
      <div class="prose">${esc(w.trigger || 'Nothing written down.')}</div></div>`);

    out.push(paintMultiples(w, r));

    const noted = [['Moat', w.moat], ['Market', w.market],
                   ['Evaluations', w.evaluations]]
      .filter((kv) => kv[1] != null && kv[1] !== '');
    if (noted.length) out.push(`<div class="tsec"><div class="tlabel">AS RECORDED</div>
      <dl class="kv">${noted.map((kv) =>
        `<dt>${esc(kv[0])}</dt><dd>${esc(kv[1])}</dd>`).join('')}</dl></div>`);
  } else {
    out.push(`<div class="tsec"><div class="tlabel">THE CALL</div>
      <div class="prose">Not on the Equity Log. You own it, but no target, thesis or
      falsifying condition is written down — so nothing here can tell you when it
      stops being a good idea.</div></div>`);
  }

  out.push(paintMissing(r));

  if (h) out.push(`<div class="tsec"><div class="tlabel">THE POSITION</div><dl class="kv">
    <dt>Units</dt><dd>${qty(h.units)}</dd>
    <dt>Account${h.accounts.length > 1 ? 's' : ''}</dt><dd>${esc(h.accounts.join(', '))}</dd>
    <dt>Value</dt><dd>${eur(h.value_eur)}</dd>
    <dt>Cost</dt><dd>${eur(h.cost_eur)}</dd>
    <dt>P/L</dt><dd class="${cls(h.pl_pct)}">${pct(h.pl_pct, 1)} · ${eur(h.pl_eur)}</dd>
    ${(() => { const rr = (D.returns || {})[h.sym] || {};
       return rr.irr_pct != null
         ? `<dt>Annualised</dt><dd class="${cls(rr.irr_pct)}">${pct(rr.irr_pct, 1)}/yr
            <span style="color:var(--muted)">since ${esc(rr.since || '')}</span>${
            atBuild('a money-weighted return needs the dated lot cashflows, which '
                    + 'are not carried in this page')}</dd>`
         : rr.note
           ? `<dt>Annualised</dt><dd style="color:var(--muted)">${esc(rr.note)}</dd>`
           : ''; })()}
    <dt>Weight</dt><dd>${h.weight.toFixed(1)}%</dd>
    <dt>Off 52w high</dt><dd>${pct(h.off_high, 1)}</dd>
    <dt>Bucket</dt><dd>${esc(h.bucket || '—')}</dd></dl></div>`);

  out.push(paintBehaviour(r));

  if (r.flags.length) out.push(`<div class="tsec"><div class="tlabel">FLAGS</div>
    ${r.flags.map((a) => `<div class="alert">
      <span class="dot" style="background:${LEVEL[a.level] || 'var(--muted)'}"></span>
      <span><div class="t">${esc(a.title)}</div>
      <div class="d">${esc(a.detail)}</div></span></div>`).join('')}</div>`);

  $('#thesis').innerHTML = out.join('');
}

/* The board's figures against today's. Nothing is reconciled and nothing is
   overwritten - the whole point of the section is the distance between the two
   columns, and a merged number would hide exactly that. The left column is what
   Daniel wrote down when he last evaluated the name; the right is Yahoo this
   morning. Where the board is silent the row still shows, because "we never
   recorded this" is itself worth seeing next to a live number. */
function paintMultiples(w, r) {
  const L = w.live || {}, ccy = esc(w.ccy || r.ccy || '');
  // Deliberately achromatic. A multiple that fell since the write-up is
  // cheaper, not worse, and green/red here would have the page taking a view
  // on which direction is good news - which is the thesis's job, not this
  // table's. The sign and the size are the whole message.
  const drift = (d) => d == null ? '' : `<span class="drift">${pct(d, 0)}</span>`;

  // Both helpers test the RAW value, not the formatted one. They used to test
  // the output of num(), which returns '—' rather than null, so the guard was
  // unreachable and every row rendered whether or not it had anything in it.
  const row = (label, was, raw, fmt, d, suffix) =>
    (was == null && raw == null) ? '' :
    `<dt>${esc(label)}</dt><dd class="was">${was == null ? '—' : esc(was)}</dd>
     <dd>${raw == null ? '—' : fmt}${suffix || ''}${drift(d)}</dd>`;
  const live = (label, raw, fmt, suffix) => raw == null ? '' :
    `<dt>${esc(label)}</dt><dd>${fmt}${suffix || ''}</dd>`;

  // Three of these nine have two sides; six have one. The Equity Log has no
  // field for P/B, EPS, ROE, margin, beta or market cap, so those rows were
  // printing a dash under a "Board" heading that could never be filled - a
  // column promising a comparison that does not exist. They are their own list
  // now, with no second column to be empty in.
  const compared = [
    row('P/E', w.pe, L.pe, num(L.pe, 1), w.pe_drift_pct),
    row('Fwd P/E', w.fwd_pe, L.fwd_pe, num(L.fwd_pe, 1), w.fwd_pe_drift_pct),
    row('Net debt/EBITDA', w.net_debt_ebitda, L.net_debt_ebitda,
        num(L.net_debt_ebitda, 2)),
  ].filter(Boolean).join('');

  const current = [
    live('P/B', L.pb, num(L.pb, 1)),
    live('EPS', L.eps, num(L.eps, 2), ` <span class="drift">${ccy}</span>`),
    live('Return on equity', L.roe_pct, num(L.roe_pct, 1) + '%'),
    live('Net margin', L.margin_pct, num(L.margin_pct, 1) + '%'),
    live('Beta', L.beta, num(L.beta, 2)),
    live('Market cap', L.market_cap, big(L.market_cap),
         ` <span class="drift">${ccy}</span>`),
  ].filter(Boolean).join('');
  if (!compared && !current && L.street_target == null) return '';

  /* The street's target, deliberately without the street's verdict. A number
     you can hold your own target up against is evidence; a word telling you to
     buy is somebody else making the decision this pane exists to make. */
  const street = L.street_target == null ? '' : `
    <dl class="kv under">
      <dt>Street target</dt><dd>${px(L.street_target * (w.price_scale || 1))} ${ccy}${L.street_analysts
        ? ` <span style="color:var(--muted)">${L.street_analysts} analysts</span>` : ''}</dd>
      <dt>Street sees</dt><dd class="${cls(w.street_upside_pct)}">${pct(w.street_upside_pct, 1)}</dd>
      <dt>You see</dt><dd class="${cls(w.upside_now)}">${pct(w.upside_now, 1)}</dd>
    </dl>`;

  const sector = L.sector
    ? `<div class="prose under" style="color:var(--muted)">${esc(L.sector)}${
        L.industry ? ' · ' + esc(L.industry) : ''}</div>` : '';

  // Headed by who said it and when, like the Board column. It used to read
  // "Now", which on a page whose prices tick every minute claimed these tick
  // too - they do not. They are Yahoo's own figures from the cached fetch.
  const asof = L.asof ? ' ' + esc(String(L.asof).slice(5, 10)) : '';
  return `<div class="tsec"><div class="tlabel">THE MULTIPLES</div>
    ${compared ? `<dl class="trio">
      <dt></dt>
      <dd class="hd">Board${w.last_eval ? ' ' + esc(String(w.last_eval).slice(5)) : ''}</dd>
      <dd class="hd" title="Yahoo's own figure, fetched ${esc(L.asof || 'at the build')}; not re-read on a live tick">Yahoo${asof}</dd>
      ${compared}
    </dl>` : ''}
    ${current ? `<div class="lnote" style="margin:${compared ? '11px' : '0'} 0 5px"
      >Not on the board — current values only.</div>
      <dl class="kv">${current}</dl>` : ''}
    ${street}${sector}</div>`;
}

/* Coverage, as money. The prose above already explains why an unexamined
   position is a problem; what this section adds is how much of the book is
   riding on one. Covered names get nothing - the thesis section above is
   already the evidence, and a green "all good" box would be noise. */
function paintMissing(r) {
  const c = r.cov;
  if (!c || c.covered) return '';
  const stock = c.klass === 'stock';
  /* The word "placeholder" travels with the number everywhere the number
     goes. A target that reads like a policy IS a policy to whoever finds it
     next, and these eleven were filled in by a rule, not a decision. */
  const held = c.target_basis === 'placeholder';
  const alloc = c.target_weight_pct == null ? '' : `
    <dl class="kv under">
      <dt>Target weight</dt><dd>${num(c.target_weight_pct, 1)}%${
        held ? ' <span class="est" title="Filled in by a rule, not a decision. '
             + 'Not a policy, and never alerted on.">placeholder</span>' : ''}</dd>
      <dt>Drift</dt><dd class="${cls(c.drift_pts)}">${c.drift_pts == null
        ? '—' : num(c.drift_pts, 1) + ' pts'}</dd></dl>`;
  return `<div class="tsec"><div class="tlabel">WHAT'S MISSING</div>
    <dl class="kv">
      <dt>At stake</dt><dd>${eur(c.value_eur)} · ${num(c.weight_pct, 1)}% of the book</dd>
      <dt>Judged by</dt><dd>${stock ? 'a thesis' : 'an allocation'}</dd>
    </dl>
    <div class="prose under">${esc(cap(c.gap) || 'Not monitored.')}${
      stock
        ? ' — so there is no target to measure today against and no condition that '
          + 'would tell you the reasoning had broken.'
        : ' — an index tracker answers to a weight, not to a story, and without '
          + 'one there is no band for it to drift out of.'}</div>${alloc}</div>`;
}

/* The chart, read back as numbers. Descriptive only: this section says where
   price is, never what to do about it - "overbought" is weather, and the
   thesis above is the decision. Everything here was computed in Python off the
   cached daily bars, so it costs no extra fetch.

   It used to say it "cannot disagree with what is plotted a pane to the left".
   That stopped being true the moment the chart's last candle started tracking
   the live price: these numbers are as at the build and the final candle is
   not. The gap is one partial session on a 252-day window - immaterial to
   MA200, visible in RSI on a sharp day - and every row here carries its own
   `asof`, which is the honest place for the reader to settle it. Recomputing
   the indicators live was considered and refused: they are Python's output,
   proved against Python, and a second implementation in the page is exactly
   the two-answers-for-one-fact trap this repo keeps falling into. */
function paintBehaviour(r) {
  const i = r.ind;
  if (!i) return '';
  const rows = [];
  if (i.rsi != null) rows.push(`<dt>RSI ${i.rsi_period}</dt><dd>${num(i.rsi, 1)}
    <span style="color:var(--muted)">${esc(i.rsi_state || '')}</span>
    ${meter(i.rsi, 0, 100, [30, 70])}</dd>`);
  // No tick marks on these two: the ends of the track already ARE the bands,
  // and a 1px rule at left:100% renders half outside the bar it belongs to.
  if (i.bb_pct_b != null) rows.push(`<dt>In its band</dt><dd>${num(i.bb_pct_b * 100, 0)}%
    <span style="color:var(--muted)">${num(i.bb_lower, 2)}–${num(i.bb_upper, 2)}</span>
    ${meter(i.bb_pct_b, 0, 1)}</dd>`);
  if (i.macd_hist != null) rows.push(`<dt>MACD histogram</dt>
    <dd class="${cls(i.macd_hist)}">${num(i.macd_hist, 2)}
    <span style="color:var(--muted)">line ${num(i.macd, 2)} · signal
    ${num(i.macd_signal, 2)}</span></dd>`);
  if (i.ma_spread_pct != null) rows.push(`<dt>MA50 vs MA200</dt>
    <dd class="${cls(i.ma_spread_pct)}">${pct(i.ma_spread_pct, 1)}</dd>`);
  if (i.above_sma200_pct != null) rows.push(`<dt>Above MA200</dt>
    <dd class="${cls(i.above_sma200_pct)}">${pct(i.above_sma200_pct, 1)}</dd>`);
  if (i.vol_30d != null) rows.push(`<dt>Volatility</dt><dd>${num(i.vol_30d, 1)}%
    <span style="color:var(--muted)">annualised, 30d</span></dd>`);
  if (i.atr_pct != null) rows.push(`<dt>Daily range</dt><dd>${num(i.atr_pct, 2)}%
    <span style="color:var(--muted)">ATR ${num(i.atr, 2)}</span></dd>`);
  if (i.max_drawdown_pct != null) rows.push(`<dt>Max drawdown</dt>
    <dd class="dn-t">${pct(i.max_drawdown_pct, 1)}</dd>`);
  // range.pct is WHERE the close sits between the low and the high, not how
  // wide the band is. Labelling it "wide" would have read as a volatility
  // number and been wrong by a mile on anything that has halved.
  if (i.range && i.range.pct != null) rows.push(`<dt>In its ${i.range.days}d range</dt>
    <dd>${num(i.range.pct, 0)}%
    <span style="color:var(--muted)">${num(i.range.low, 2)}–${num(i.range.high, 2)}</span>
    ${meter(i.range.pct, 0, 100)}</dd>`);
  if (i.volume && i.volume.relative != null) rows.push(`<dt>Volume</dt>
    <dd>${num(i.volume.relative, 2)}×
    <span style="color:var(--muted)">the ${i.volume.period}d average</span></dd>`);
  if (!rows.length) return '';
  return `<div class="tsec"><div class="tlabel">THE CHART</div>
    <dl class="kv">${rows.join('')}</dl>
    <div class="prose under" style="color:var(--muted)">
      ${i.bars} bars to ${esc(i.asof)}. Description, not advice — none of this
      knows why you own it.</div></div>`;
}

/* ----------------------------------------------------------------- chart */

let chart = null, candles = null, lines = [], mas = {}, chartKey = null, chartLen = 0;

/* Simple moving average over closes, as a rolling sum - one pass, no window
   re-summing, so 500 bars costs 500 additions rather than 25,000.

   It is computed over the WHOLE series and sliced afterwards, never over the
   visible window. An MA50 computed inside a 1M view would be a 21-day average
   wearing a "50" label, and it would be wrong at exactly the left edge where
   you are looking for the cross. */
function sma(bars, period) {
  if (!bars || bars.length < period) return [];
  const out = [];
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i][4];
    if (i >= period) sum -= bars[i - period][4];
    if (i >= period - 1) out.push({time: bars[i][0], value: sum / period});
  }
  return out;
}

function themeOpts() {
  const cssVar = (n, fallback) => {
    try {
      const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      return v || fallback;
    } catch (e) { return fallback; }
  };
  return {
    // attributionLogo defaults to TRUE in v4.2+ and stamps a tradingview.com
    // link into the corner of the pane. It is a documented option, not a
    // licence condition - Apache-2.0 asks that the notice be preserved, and it
    // is: the library is inlined verbatim, @license header and all, a few
    // hundred lines above this one.
    // The fallbacks are the light-mode token values. They only apply if
    // getComputedStyle throws, so they are a last resort rather than a second
    // copy of the palette - but palette_check.py reads the :root block and
    // would not see them, so keep them in step by hand when a token moves.
    layout: {background:{color:'transparent'}, textColor:cssVar('--muted','#6f6d67'),
             // 11 is --t-2 without the unit; the library wants a number. The
             // family comes from the same token as the rest of the page, so
             // the axis labels and the table beside them cannot drift apart.
             fontSize:11.5,
             fontFamily:cssVar('--font-ui', 'system-ui,-apple-system,sans-serif'),
             attributionLogo:false},
    grid: {vertLines:{color:cssVar('--grid','#e1e0d9')},
           horzLines:{color:cssVar('--grid','#e1e0d9')}},
    // The axis was on the library's default formatter and the tables were on
    // px(), so the same close appeared as "1250.00" on the chart and "1,250.00"
    // in the row beside it. One formatter, so a price is written one way on
    // this page. The currency is not repeated per tick - it is stated once, in
    // the pane head next to the ticker.
    localization: {priceFormatter: px},
    rightPriceScale:{borderColor:cssVar('--axis','#c3c2b7')},
    timeScale:{borderColor:cssVar('--axis','#c3c2b7')},
    crosshair:{mode:0, vertLine:{color:cssVar('--axis','#c3c2b7'), labelBackgroundColor:
      cssVar('--ink-2','#52514e')}, horzLine:{color:cssVar('--axis','#c3c2b7'),
      labelBackgroundColor:cssVar('--ink-2','#52514e')}},
    upColor:cssVar('--up','#2f9e63'), downColor:cssVar('--down','#8c2a34'),
    target:cssVar('--target','#4a55c8'), trigger:cssVar('--trigger','#8f6900'),
    // Deliberately achromatic. Four plotted hues is the ceiling - a fifth was
    // rejected at dE 10.7 against a candle body - and a moving average is
    // context, not identity. Grey is also the only mark on the plot with no
    // hue at all, which is the strongest colour-blind separation available and
    // costs nothing.
    ma:cssVar('--ink-2','#52514e'),
  };
}

// Hollow up, filled down - the Western convention, and more usefully a second
// channel. Green and red separate at dE 15.2 under deuteranopia, which is
// enough but is not much; fill separates at any severity of anything, so a
// reader who gets no hue at all still reads the chart from the body alone.
const candleOpts = (T) => ({
  upColor:'rgba(0,0,0,0)', downColor:T.downColor,
  borderUpColor:T.upColor, borderDownColor:T.downColor,
  wickUpColor:T.upColor, wickDownColor:T.downColor,
});

// Intraday candles for the 1D and 5D ranges. The daily series moves one bar in
// ~250 when a quote lands, so a year-wide chart looks frozen while the price
// beside it ticks. These are Yahoo's own five- and fifteen-minute bars, fetched
// for the one symbol on screen and refetched at most once per poll, so the
// chart draws real up and down candles as the session trades.
//
// Held apart from D.history for the same reason LIVEBAR is: live figures never
// overwrite recorded ones. A failed refetch keeps the last good bars and says
// so; it never blanks a chart that was drawing a moment ago.
const INTRA = new Map();          // 'sym|days' -> {bars, interval, error, at, tried}
const INTRA_PENDING = new Set();
const INTRA_ON = location.protocol === 'http:' || location.protocol === 'https:';
const INTRA_STALE_MS = 55000;     // just under the 60s poll, so every tick refetches
const intraKey = (sym, days) => sym + '|' + days;

async function intraFetch(sym, days) {
  const k = intraKey(sym, days);
  if (!INTRA_ON || !sym || INTRA_PENDING.has(k)) return;
  INTRA_PENDING.add(k);
  const prev = INTRA.get(k);
  let got;
  try {
    const res = await fetch('/api/bars', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({symbol: sym, range: days === 5 ? '5d' : '1d'}),
    });
    if (!res.ok) throw new Error('bars endpoint returned ' + res.status);
    const j = await res.json();
    // Re-checked here, not trusted from the endpoint: a zero or a null that
    // got through would draw a wick to the floor.
    const bars = (Array.isArray(j.bars) ? j.bars : []).filter((b) => Array.isArray(b)
      && b.length >= 5 && b.slice(0, 5).every((v) => typeof v === 'number' && v > 0));
    got = (!bars.length && prev && prev.bars.length)
      ? Object.assign({}, prev, {error: j.error || 'empty refetch', tried: Date.now()})
      : {bars, interval: j.interval || '', error: bars.length ? null : (j.error || 'no bars'),
         at: new Date(), tried: Date.now()};
  } catch (e) {
    const why = (e && e.message) || 'intraday unavailable';
    got = prev && prev.bars.length
      ? Object.assign({}, prev, {error: why, tried: Date.now()})
      : {bars: [], interval: '', error: why, at: null, tried: Date.now()};
  } finally {
    INTRA_PENDING.delete(k);
  }
  INTRA.set(k, got);
  if (state.sym === sym && state.days === days && state.view === 'positions') {
    const r = ROWS.find((x) => x.sym === sym);
    if (r) paintChart(r);
  }
}

// Yahoo's timestamps are UTC seconds and the chart library labels them as UTC.
// Shifted by the viewer's own offset so an Amsterdam open reads 09:00, not 07:00.
const localSec = (t) => t - new Date(t * 1000).getTimezoneOffset() * 60;
const hhmm = (d) => d ? d.toTimeString().slice(0, 5) : '';

function paintChart(r) {
  const box = $('#chart'), miss = $('#nochart');
  // The library is vendored, not fetched, so this only fires if assets/ was
  // gutted - but a page that half-renders in silence is the thing we avoid.
  if (typeof LightweightCharts === 'undefined' || !box || !box.getBoundingClientRect) {
    if (miss) { miss.style.display = 'flex';
      miss.textContent = 'Chart library missing from assets/.'; }
    return;
  }
  // Nothing is drawn into a box that cannot be measured. The chart takes its
  // size from the container at construction, and with autoSize on there is no
  // way back: the vendored v4.2.3 makes resize() a no-op while the observer is
  // installed (`resize(t,i,n){this.autoSizeActive()||...}`) and applyOptions
  // will not re-measure either. So a chart built while Positions was hidden is
  // zero-wide for as long as its ResizeObserver takes to fire - which in a
  // background tab is never, because rAF is throttled there. Measured: with
  // the container at 661x891 for a second and a half, every canvas was still
  // 0 wide on a 300px backing store.
  //
  // Deferring costs nothing, because setView('positions') repaints after it
  // un-hides the view and is the only way this surface can be reached.
  const rect = box.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  // The cached series with today's quote merged into its last candle. Taken
  // once, here, so the slice, both moving averages and fitContent() all see the
  // same series - an MA computed off the cached bars while the candles carry a
  // live one would stop a day short of the price it is supposed to be averaging.
  const bars = barsFor(r);
  if (!bars || !bars.length) {
    if (chart) { chart.remove(); chart = null; candles = null; lines = []; mas = {}; chartKey = null; }
    box.innerHTML = '';
    miss.style.display = 'flex';
    miss.textContent = `No price history for ${r.label}. Yahoo returned nothing for ` +
      'this symbol; the rest of the page is unaffected.';
    return;
  }
  miss.style.display = 'none';

  // 1D and 5D draw intraday bars when there are some; otherwise they fall back
  // to the last month of daily candles and the note under the chart says why.
  const intraday = state.days === 1 || state.days === 5;
  let ibars = null, inote = null;
  if (intraday) {
    const got = INTRA.get(intraKey(r.sym, state.days));
    if (!INTRA_ON) {
      inote = 'Intraday candles need the live page; showing the last month of daily candles';
    } else {
      if (!got || Date.now() - got.tried > INTRA_STALE_MS) intraFetch(r.sym, state.days);
      if (got && got.bars.length) ibars = got;
      else if (!got) inote = 'Loading intraday candles; daily candles meanwhile';
      else inote = `No intraday data for ${r.label} (${got.error}); showing daily candles`;
    }
  }

  const T = themeOpts();
  if (!chart) {
    chart = LightweightCharts.createChart(box, Object.assign({
      autoSize: true, handleScale:{axisPressedMouseMove:false},
    }, T));
    candles = chart.addCandlestickSeries(candleOpts(T));
    // Same colour for both, told apart by weight and dash - so the pair is
    // never distinguished by colour alone, same contract as target/trigger.
    // No last value and no price line: an MA does not belong on the axis, and
    // two extra axis labels would crowd out the two that matter.
    const maOpts = {color:T.ma, priceLineVisible:false, lastValueVisible:false,
                    crosshairMarkerVisible:false};
    mas[50] = chart.addLineSeries(Object.assign({lineWidth:1, title:'MA50',
      lineStyle:LightweightCharts.LineStyle.Solid}, maOpts));
    mas[200] = chart.addLineSeries(Object.assign({lineWidth:2, title:'MA200',
      lineStyle:LightweightCharts.LineStyle.Dashed}, maOpts));
  }

  // Slice by DATE, not by row count. Bars are trading days - about 252 a year -
  // so bars.slice(-365) is fifteen months of chart under a button labelled 1Y.
  let slice = bars;
  const span = intraday ? 30 : state.days;
  if (span > 0) {
    const last = Date.parse(bars[bars.length - 1][0]);
    const from = last - span * 86400000;
    slice = bars.filter((b) => Date.parse(b[0]) >= from);
  }
  if (!slice.length) slice = bars.slice(-2);
  // A live tick redraws this chart every minute. Refitting it each time threw
  // away whatever the reader had zoomed or panned to, so a chart tied to a
  // moving price was unusable exactly while the price was moving. Same symbol,
  // same range, same overlays: keep their view and let only the last candle
  // move. Anything they changed themselves still gets a fresh fit.
  const viewKey = [r.sym, state.days, ibars ? 'i' : 'd', state.ma[50], state.ma[200]].join('|');
  let keep = viewKey === chartKey ? chart.timeScale().getVisibleLogicalRange() : null;
  const drawn = ibars ? ibars.bars.length : slice.length;
  // A new five-minute bar arriving while the reader is looking at the right
  // edge scrolls the view along with it, the way a trading screen does. Parked
  // anywhere else, the view stays where they put it.
  if (keep && keep.to >= chartLen - 1.5 && drawn > chartLen) {
    keep = {from: keep.from + (drawn - chartLen), to: keep.to + (drawn - chartLen)};
  }
  chartKey = viewKey;
  chartLen = drawn;
  chart.applyOptions({timeScale: {timeVisible: !!ibars, secondsVisible: false}});
  candles.setData(ibars
    ? ibars.bars.map((b) => ({time:localSec(b[0]), open:b[1], high:b[2], low:b[3], close:b[4]}))
    : slice.map((b) => ({time:b[0], open:b[1], high:b[2], low:b[3], close:b[4]})));

  // Full-history MA, then clipped to the window. ISO dates compare correctly as
  // strings, so no parsing is needed here. A symbol with fewer than `period`
  // bars yields an empty series rather than a misleading partial one.
  const edge = slice[0][0];
  for (const p of [50, 200]) {
    if (!mas[p]) continue;
    // A daily average has no place on a five-minute axis: it would be one
    // flat step per session. Off while intraday bars are drawn.
    mas[p].setData(state.ma[p] && !ibars ? sma(bars, p).filter((pt) => pt.time >= edge) : []);
  }

  lines.forEach((l) => { try { candles.removePriceLine(l); } catch (e) {} });
  lines = [];
  const w = r.w;
  // The candles are in Yahoo's unit and the board's lines are in the board's.
  // Where those differ (cents vs rand) the lines go back into Yahoo's unit,
  // or a rand target draws as a flat line along the bottom of a cents chart.
  const unit = (w && w.price_scale) || 1;
  // Both lines carry a title and an axis label, so target and trigger are never
  // told apart by colour alone - solid vs dashed, plus the words themselves.
  if (w && w.target) lines.push(candles.createPriceLine({
    price:w.target / unit, color:T.target, lineWidth:2,
    lineStyle:LightweightCharts.LineStyle.Solid,
    axisLabelVisible:true, title:'target'}));
  if (w && w.trigger_level) lines.push(candles.createPriceLine({
    price:w.trigger_level / unit, color:T.trigger, lineWidth:2,
    lineStyle:LightweightCharts.LineStyle.Dashed,
    axisLabelVisible:true, title:'trigger'}));

  // Derived from the drawn series, not from LIVE alone: a symbol the live layer
  // asked about and missed keeps a build-time candle, and this line has to say
  // so rather than inherit the tape's verdict for the page as a whole.
  const note = $('#livebar');
  if (note) {
    const tail = bars[bars.length - 1];
    const merged = r.freshness === 'live' && LIVEBAR.has(r.sym);
    if (ibars) {
      const lastT = new Date(ibars.bars.at(-1)[0] * 1000);
      note.textContent = `${ibars.interval.replace('m', '-minute')} candles, last ${hhmm(lastT)}`
        + (ibars.error ? ` · refresh failed at ${hhmm(new Date(ibars.tried))}, holding the last good bars`
                       : ` · fetched ${hhmm(ibars.at)}`);
    } else if (inote) note.textContent = inote;
    else note.textContent = merged
      ? `Last candle ${tail[0]}, still forming · ${
          LIVE && LIVE.at ? LIVE.at.toTimeString().slice(0, 5) : 'live'}`
      : `Last candle ${tail[0]}, as at the build`;
  }

  if (keep) chart.timeScale().setVisibleLogicalRange(keep);
  else chart.timeScale().fitContent();
}

function retheme() {
  if (!chart) return;
  const T = themeOpts();
  chart.applyOptions(T);
  if (candles) candles.applyOptions(candleOpts(T));
  for (const p of [50, 200]) if (mas[p]) mas[p].applyOptions({color:T.ma});
  const r = ROWS.find((x) => x.sym === state.sym);
  if (r) paintChart(r);
}

/* ------------------------------------------------------------ data sheet */

/* The sheet is one surface with one state, and every table on it reads that
   state. A sector bar, a fund row and the search box all write to the same
   object, so a click in one section changes what the sections below it say -
   which is the difference between a dashboard and a stack of printouts.

   State is deliberately NOT persisted. Reopening the sheet on the next run
   should show the whole book, not last week's question still applied to this
   week's numbers with no sign that it is. */
const SS = {
  filter: null,      // {kind:'sector'|'country'|'industry'|'fund', key, label}
  q: '',
  units: 'pct',      // 'pct' | 'eur'
  sort: {},          // table name -> {k, dir}
  shut: {},          // section id -> true when collapsed
  at: null,          // section id last jumped to - the drawer's half of the route
};

// Reads 'growth.revenue_yoy_pct' as well as 'pct', so a sort key can point at
// a nested figure without the row being flattened first.
const dig = (o, path) => String(path).split('.')
  .reduce((v, k) => (v == null ? v : v[k]), o);

function sortRows(rows, table, fallback) {
  const s = SS.sort[table] || {k: fallback, dir: -1};
  return rows.slice().sort((a, b) => {
    const x = dig(a, s.k), y = dig(b, s.k);
    // A missing value sinks in BOTH directions. Sorting ascending by surprise
    // must not put the six names that never reported one above the worst miss
    // in the book - absent is not the smallest number, it is not a number.
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'number' && typeof y === 'number'
      ? (x - y) : String(x).localeCompare(String(y))) * s.dir;
  });
}

// Sortable columns whose cells are words rather than figures. Numbers are
// right-aligned so they stack on their last digit and can be compared down the
// column; words need a predictable left margin instead, and without this list
// every sector, verdict and account cell was right-ragged against a hard edge.
//
// Kept as an explicit list and NOT derived from d0, though it is tempting: d0
// is which way a FIRST CLICK sorts, which merely correlates with text. 'Days
// ago' sorts ascending and is a number; 'As of' sorts descending and is a
// date. Deriving one from the other is this repo's own recurring bug - a
// derived value quietly claiming to mean more than it does.
const TEXTCOL = new Set([
  'held.name', 'log.verdict', 'log.tier', 'log.last_eval', 'log.next_check',
  'cov.covered', 'cov.gap', 'cov.klass', 'cov.name', 'names.name',
  'funds.name', 'funds.symbol', 'latest.date', 'mult.live.asof',
  'ind.ind.rsi_state',
]);

// A sortable header. `d0` is the direction a first click gives: -1 (biggest
// first) for figures, 1 (A-Z, oldest-first) for names and dates.
const th = (table, key, label, d0) => {
  const s = SS.sort[table];
  const on = s && s.k === key;
  const t = TEXTCOL.has(`${table}.${key}`) ? ' t' : '';
  return `<th class="s${t}" data-t="${table}" data-k="${esc(key)}"
    data-d0="${d0 == null ? -1 : d0}"${on ? ` data-dir="${s.dir}"` : ''}
    >${esc(label)}</th>`;
};

/* Push each header's alignment down its own column.

   The alternative was to write class="t" on every matching <td> by hand, in
   nine tables, and keep those in step with the headers forever. They would not
   have stayed in step: the cells and the headers are written hundreds of lines
   apart, and the funds table had already drifted far enough to emit one fewer
   cell than its header without anyone noticing.

   So the header is the single declaration and the cells follow it. A row whose
   cell count disagrees with the header is left untouched rather than aligned
   against the wrong columns - if the two ever disagree again, the result is a
   visibly unaligned table, which is the failure that gets reported, instead of
   a neat one that is quietly describing the wrong numbers. */
function alignColumns(root) {
  for (const table of root.querySelectorAll('table')) {
    const heads = [...table.querySelectorAll('thead th')];
    if (!heads.length) continue;
    const isText = heads.map((h) => h.classList.contains('t'));
    for (const row of table.querySelectorAll('tbody tr')) {
      const cells = row.children;
      if (cells.length !== heads.length) continue;
      for (let i = 0; i < cells.length; i++)
        cells[i].classList.toggle('t', isText[i]);
    }
  }
}

function paintSheet() {
  // One search box over every table. Matching on symbol OR name means typing
  // "micro" and typing "MSFT" find the same rows, and the sheet stops being
  // somewhere you scroll to find a ticker.
  const q = (SS.q || '').trim().toLowerCase();
  const hits = (r) => !q || [r.symbol, r.sym, r.yahoo, r.ticker, r.name,
    r.company, r.label].some((v) => v && String(v).toLowerCase().includes(q));
  const some = (n, all, what) => n === all ? `${all} ${what}`
    : `${n} of ${all} ${what}`;

  const hr = sortRows([...held.values()].filter(hits), 'held', 'value_eur');
  const h = `<h2 data-sec="hold" data-label="Holdings">Holdings — ${some(hr.length, held.size,
      'companies')}, ${(D.sources||{}).lots} lots</h2>
    <div class="sec" data-sec="hold">
    <div class="scroll"><table><thead><tr>
    ${th('held','ticker','Ticker',1)}${th('held','name','Company',1)}
    <th class="t">Acct</th>${th('held','units','Units')}${th('held','price','Price')}
    ${th('held','day_pct','Day')}${th('held','value_eur','Value €')}
    ${th('held','cost_eur','Cost €')}${th('held','pl_eur','P/L €')}
    ${th('held','pl_pct','P/L %')}${th('held','weight','Weight')}
    ${th('held','off_high','Off high')}</tr></thead><tbody>${hr.map((p) => `<tr
      class="click" data-sym="${esc(p.sym)}">
      <td>${esc(p.ticker)}</td><td>${esc(p.name)}</td>
      <td class="t">${esc(p.accounts.join('/'))}</td><td>${qty(p.units)}</td>
