<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity cockpit</title>
<style>
/* Palette note: every colour below is checked by `py tools/palette_check.py`
   in BOTH modes - lightness band, chroma floor, CVD separation, normal-vision
   floor, mark contrast vs every surface it lands on, and WCAG AA for anything
   used as text. Do not hand-tune them; change a value and re-run the checker,
   which is also wired into `run.ps1 selftest`.

   Gain is green and loss is red EVERYWHERE - text, treemap tiles, bars and
   candle bodies. That was not true before: signed numbers were green/red while
   the bar beside them was blue/red, so a single row said both things at once.

   Moving the candles onto green put them on the same plot as the green target
   line, so the check is now all six pairs among the four plotted hues, not the
   two it used to be. Target and trigger additionally differ by line style and
   carry axis labels, so that pair is never colour-alone. Nothing else on the
   page leans on hue by itself either: down-candles are hollow, the treemap
   keeps its sign glyph, and the diverging bars have a real zero axis. */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f4f4f1; --plane:#f9f9f7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#6f6d67;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.11);
  --up:#2f9e63; --down:#8c2a34;
  --target:#4a55c8; --trigger:#8f6900;
  --pos:#2f9e63; --neg:#8c2a34;
  --good:#2f9e63; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#166b46; --warn-ink:#8a6000; --crit-ink:#9b2731;
  --accent:#4a55c8;
}
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#232322; --plane:#0d0d0d;
  --ink:#e8e6e2; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.11);
  --up:#5bd39b; --down:#d24f3a;
  --target:#3987e5; --trigger:#eda01d;
  --pos:#5bd39b; --neg:#d24f3a;
  --good:#5bd39b; --warn:#e0a72c; --serious:#e2825a; --crit:#e05a5a;
  --good-ink:#63d8a2; --warn-ink:#e0a72c; --crit-ink:#ec7d67;
  --accent:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#232322; --plane:#0d0d0d;
  --ink:#e8e6e2; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.11);
  --up:#5bd39b; --down:#d24f3a;
  --target:#3987e5; --trigger:#eda01d;
  --pos:#5bd39b; --neg:#d24f3a;
  --good:#5bd39b; --warn:#e0a72c; --serious:#e2825a; --crit:#e05a5a;
  --good-ink:#63d8a2; --warn-ink:#e0a72c; --crit-ink:#ec7d67;
  --accent:#3987e5;
}

/* Type, spacing and shape. These are mode-independent, so they sit in their
   own block rather than being repeated in all three palette blocks.

   The page had 15 font sizes, 10 weights and 10 radii before this. Not 15
   deliberate sizes - 9 of them formed a half-pixel staircase (10, 10.5, 11,
   11.5, 12, 12.5, 13, 13.5, 14) carrying 88% of all declarations, which is
   what a scale looks like when every rule picked its own number. Four separate
   sizes were doing the single job of "the big number".

   Collapsed to six steps plus a caret size. Half-pixels are kept where they
   were already load-bearing: this renders at fractional DPI and 11.5px is a
   real, distinct size, not a typo. What is gone is the neighbouring value
   nobody could tell apart from it. */
:root{
  --font-ui: system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Numbers get tabular figures via .num; the family is the same, so a price
     and its label never disagree about shape. */
  --t-1:10.5px;  /* micro caps: column group labels, badges, estimate marks */
  --t-2:11.5px;  /* table cells, chips, secondary text */
  --t-3:12.5px;  /* body and default control text */
  --t-4:13.5px;  /* emphasised row text: ticker, company, change */
  --t-5:18px;    /* section heading */
  --t-6:22px;    /* display: the one number a card exists to show */
  --t-caret:9px; /* the sort/disclosure glyphs, which are icons not type */

  --w-med:560; --w-semi:640; --w-bold:700;

  /* Fitted to the page's own histogram rather than to a ratio: 13 distinct gap
     values clustered around 2, 4, 6, 10 and 14, so those are the steps. A
     tidier 4/8/16/24 scale would have moved almost every gap on the page to
     serve an idea of neatness no reader can see.
     Multi-value paddings are left alone here - `padding:7px 8px` is component
     geometry, not rhythm, and is set where each component is defined. */
  --s-1:2px; --s-2:4px; --s-3:6px; --s-4:10px; --s-5:14px; --s-6:20px;
  /* That histogram was taken from the stylesheet, and the stylesheet is not
     where all the spacing lives: a dozen gaps between a block and the note
     explaining it are inline styles inside JS template strings, hardcoded at
     8px or 9px, invisible to anything reading the CSS. It is one interval used
     one way, so it gets one name rather than a new rung on a scale that was
     fitted without it. */
  --s-note:8px;

  /* Line height was eight ad hoc values between 1.05 and 1.5 with no token, so
     two cards showing the same kind of thing set it differently by accident.
     Four steps, chosen by what the text IS rather than by how big it is. */
  --lh-num:1.08;   /* display figures - the one number a card exists to show */
  --lh-tight:1.2;  /* headings and labels that must not open up */
  --lh:1.4;        /* table cells, captions, short secondary text */
  --lh-loose:1.5;  /* prose meant to be read as sentences */

  --r-sm:3px; --r-md:7px; --r-lg:10px; --r-pill:999px;
}

*{box-sizing:border-box}
html,body{height:100%}
/* A column flex, not height:calc(100% - 52px - 37px). The banner is present on
   some runs and not others and its height depends on how many problems there
   are, so anything that subtracts a fixed number is wrong on most mornings. */
body{margin:0;background:var(--plane);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
  font:var(--t-4)/1.45 var(--font-ui);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
/* Text uses the -ink tokens, marks use --pos/--neg. They are different jobs:
   a mark can be the only channel and owes CVD separation, text always carries
   a sign glyph and instead owes WCAG AA against the surface. .dn-t used to
   borrow the mark colour, which is why it never paid the text contrast. */
.up-t{color:var(--good-ink)} .dn-t{color:var(--crit-ink)}
/* `.chip b` below sets a colour and is (0,1,1); these are (0,1,0), so without
   the scoped pair the chip wins and every signed number on the tape renders
   ink-black - the headline P/L, the flag count, a stale CSV, the unwatched
   share. They were all colourless until this was measured in the light theme. */
.chip b.up-t{color:var(--good-ink)} .chip b.dn-t{color:var(--crit-ink)}

/* Freshness mark. The slot is a fixed width and is rendered even when it is
   empty, so a column cannot shift sideways the moment quotes arrive. It sits to
   the LEFT of the price in the numeric cells: a right-aligned column has to keep
   its digits on the right edge, and hanging a glyph off that edge breaks the
   alignment the tabular figures exist to provide. */
.fr{display:inline-block;width:0.9em;margin-right:var(--s-1);text-align:center;
  font-style:normal;font-size:var(--t-1);line-height:1;vertical-align:0.08em}
.fr-live{color:var(--good-ink)}
.fr-build{color:var(--muted)}
.fr-stale{color:var(--warn-ink)}
.fr-none{color:transparent}

/* ------------------------------------------------------------------ tape */
/* Wraps at every width rather than at a breakpoint. The meta chip is as long as
   the book is wide - at 955px it measured 769px on its own, which pushed the view
   nav to left:1133 and the theme button to 1380, both off a 955px screen. That is
   not a cosmetic overflow: Positions became unreachable. A guessed breakpoint
   would only move where it happens, so the bar is allowed to take a second row
   whenever the facts do not fit, and min-height keeps it at one row when they do. */
.tape{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3) var(--s-6);
  min-height:52px;flex:none;padding:8px 16px;
  background:var(--surface-1);border-bottom:1px solid var(--border);
  position:relative;z-index:5}
.brand{font-size:var(--t-2);font-weight:var(--w-bold);letter-spacing:.14em;color:var(--muted);
  white-space:nowrap}
.tape .big{font-size:var(--t-6);font-weight:var(--w-semi);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:var(--s-3);font-size:var(--t-3);
  color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:var(--w-semi);color:var(--ink)}
/* The meta chip is the one that has to give. Block flow rather than inline-flex
   so it breaks at the separators and nowhere else - each fact is a .f that stays
   whole, so a line never ends with "24" and starts with "held". */
#t-meta{display:block;white-space:normal;min-width:0;line-height:var(--lh-loose)}
#t-meta .f{white-space:nowrap}
.sep{width:1px;height:22px;background:var(--border);flex:none}
/* No flex spacer: under wrap a spacer eats the rest of its own line and pushes
   whatever follows it onto a line of its own, which stranded the theme button
   three rows down. An auto margin does the same right-alignment per line while
   leaving the nav and the button adjacent, so the controls travel together. */
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tbtn{padding:5px 11px;border:1px solid var(--border);border-radius:var(--r-md);
  font-size:var(--t-3);color:var(--ink-2)}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);
  border-color:var(--axis)}
/* The drawer trigger carries a caret so it reads as "this opens something over
   the page" before it is pressed, rather than as one more toggle. The caret
   turns when the drawer is up, which is the only state the button has: it is
   not a tab and has no selected state to show. */
.drawer::after{content:"\203A";margin-left:var(--s-2);display:inline-block;
  transition:transform .12s ease;color:var(--muted)}
.drawer[aria-expanded="true"]::after{transform:rotate(90deg)}
.drawer[aria-expanded="true"]{background:var(--surface-2);color:var(--ink);
  border-color:var(--axis)}

/* --------------------------------------------------------------- banner */
.banner{display:flex;align-items:flex-start;gap:var(--s-4);padding:9px 16px;flex:none;
  font-size:var(--t-3);border-bottom:1px solid var(--border);background:var(--surface-2)}
.banner .dot{margin-top:5px}
.banner b{font-weight:var(--w-semi)}
.banner .why{color:var(--ink-2)}

/* ----------------------------------------------------------------- grid */
.app{display:grid;grid-template-columns:264px minmax(0,1fr) 336px;
  flex:1;min-height:0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--surface-1)}
.pane + .pane{border-left:1px solid var(--border)}
.mid{background:var(--plane)}
.phead{display:flex;align-items:center;gap:var(--s-4);padding:10px 12px;flex:none;
  border-bottom:1px solid var(--border)}
.ptitle{font-size:var(--t-1);font-weight:var(--w-bold);letter-spacing:.12em;color:var(--muted)}
.pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}

/* ----------------------------------------------------------------- rail */
.search{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--plane);color:var(--ink);font:var(--t-3) var(--font-ui);outline:none}
.search:focus{border-color:var(--accent)}
.segs{display:flex;gap:var(--s-2);padding:8px 12px 4px;flex:none}
.seg{flex:1;padding:4px 0;border-radius:var(--r-md);font-size:var(--t-2);font-weight:var(--w-semi);
  color:var(--muted);text-align:center;border:1px solid transparent}
.seg[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);
  border-color:var(--border)}
.row{display:grid;grid-template-columns:1fr auto;gap:var(--s-1) 8px;align-items:center;
  padding:7px 12px 7px 9px;border-left:3px solid transparent;cursor:pointer;
  border-bottom:1px solid var(--grid)}
.row:hover{background:var(--surface-2)}
.row[aria-selected="true"]{background:var(--surface-2);border-left-color:var(--accent)}
.row .sym{font-size:var(--t-4);font-weight:var(--w-semi);display:flex;align-items:center;gap:var(--s-2)}
/* A hollow ring beside the filled alert dot. "Nothing is watching this" is not
   a severity, so it gets no colour - it gets the absence of one, which is also
   the only mark on the rail that survives every kind of colour blindness. */
.ring{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--axis);
  box-sizing:border-box;flex:none}
.row .co{grid-column:1;font-size:var(--t-2);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .px{font-size:var(--t-3);font-variant-numeric:tabular-nums;text-align:right}
.row .chg{grid-column:2;font-size:var(--t-2);font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:22px 14px;color:var(--muted);font-size:var(--t-3)}

/* ------------------------------------------------------------------ mid */
.symhead{display:flex;align-items:baseline;gap:var(--s-5);padding:12px 16px 10px;
  flex:none;flex-wrap:wrap}
.symhead .tk{font-size:var(--t-6);font-weight:var(--w-bold);letter-spacing:-.02em}
.symhead .co{color:var(--ink-2);font-size:var(--t-4)}
.symhead .px{font-size:var(--t-6);font-weight:var(--w-semi);font-variant-numeric:tabular-nums;
  margin-left:auto}
.symhead .chg{font-size:var(--t-4);font-variant-numeric:tabular-nums}
.ranges{display:flex;align-items:center;gap:var(--s-2);padding:0 16px 8px;flex:none}
.rbtn{padding:3px 10px;border-radius:var(--r-md);font-size:var(--t-2);font-weight:var(--w-semi);
  color:var(--muted);border:1px solid transparent}
.rbtn:hover{color:var(--ink)}
.rbtn[aria-pressed="true"]{background:var(--surface-1);color:var(--ink);
  border-color:var(--border)}
.rsep{width:1px;height:14px;background:var(--border);margin:0 6px;flex:none}
.legend{display:flex;gap:var(--s-5);margin-left:auto;font-size:var(--t-2);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:var(--s-2)}
.swatch{width:14px;height:0;border-top-width:2px;border-top-style:solid;flex:none}
.chartbox{flex:1;min-height:180px;margin:0 12px;position:relative;
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden}
.nochart{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--muted);font-size:var(--t-3);text-align:center;
  padding:20px}

/* --------------------------------------------------------- weight strip */
.strip{flex:none;padding:10px 12px 12px}
.striphead{display:flex;align-items:baseline;gap:var(--s-4);margin-bottom:6px}
.strip .ptitle{font-size:var(--t-1)}
.striphead .note{font-size:var(--t-2);color:var(--muted);margin-left:auto}
.bars{display:flex;gap:var(--s-1);height:34px;width:100%}
.bar{min-width:3px;border-radius:var(--r-sm);background:var(--axis);cursor:pointer;
  position:relative}
.bar:hover{background:var(--ink-2)}
.bar[data-sel="1"]{background:var(--accent)}

/* --------------------------------------------------------------- thesis */
.tsec{padding:12px 14px;border-bottom:1px solid var(--grid)}
.tsec:last-child{border-bottom:0}
.tlabel{font-size:var(--t-1);font-weight:var(--w-bold);letter-spacing:.12em;color:var(--muted);
  margin-bottom:var(--s-note)}
/* A block, and the note that explains it. Ten inline `margin-top:8px` and
   `margin-top:9px` in JS template strings each said this independently, plus an
   11px and a pair of margin-bottoms that meant the same thing in the other
   direction. Two classes say it once, and a density or theme change can now
   reach them - an inline style cannot be overridden by anything. */
.under{margin-top:var(--s-note)}
.over{margin-bottom:var(--s-note)}
/* A run-in title between two blocks inside a section, spelled `margin:16px 0
   7px` in one place and `18px 0 7px` in another. It is one thing. */
.tlabel.run{margin:var(--s-6) 0 var(--s-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s-3) 12px;font-size:var(--t-3)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--w-med)}
.prose{font-size:var(--t-3);line-height:var(--lh-loose);color:var(--ink-2);
  overflow-wrap:anywhere}
/* Three columns, because the point of the section is the gap between two of
   them. A dt may be followed by more than one dd - this is that, not a hack. */
.trio{display:grid;grid-template-columns:auto 1fr 1fr;gap:var(--s-3) 10px;font-size:var(--t-3);
  align-items:baseline}
.trio dt{color:var(--muted)}
.trio dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--w-med)}
.trio .hd{font-size:var(--t-1);font-weight:var(--w-bold);letter-spacing:.08em;color:var(--muted);
  text-transform:uppercase}
.trio .was{font-weight:var(--w-med);color:var(--ink-2)}
.drift{font-size:var(--t-2);color:var(--muted);margin-left:4px;font-weight:var(--w-med)}
/* A bounded number reads badly as a decimal and well as a position. The two
   faint ticks are the 30/70 lines; the mark is today. No colour: overbought is
   a description, not an instruction, and red would make it one. */
.meter{display:inline-block;width:64px;height:6px;border-radius:var(--r-sm);
  background:var(--grid);position:relative;vertical-align:middle;margin-left:8px}
.meter u{position:absolute;top:0;width:1px;height:6px;background:var(--muted)}
.meter i{position:absolute;top:-2px;width:2px;height:10px;background:var(--ink);
  border-radius:var(--r-sm);margin-left:-1px}
.badge{display:inline-block;padding:1px 8px;border-radius:var(--r-pill);font-size:var(--t-2);
  font-weight:var(--w-semi);border:1px solid var(--border)}
.b-buy{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good-ink)}
.b-watch{background:var(--surface-2);color:var(--ink-2)}
.b-trim{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.b-exit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit-ink)}
.alert{display:flex;gap:var(--s-4);padding:8px 0;border-bottom:1px solid var(--grid);
  font-size:var(--t-3)}
.alert:last-child{border-bottom:0}
.alert .dot{margin-top:5px}
.alert .t{font-weight:var(--w-semi)}
/* Clamped to three lines. Unclamped, seven flags ran the card to 798px against
   Concentration's 188px beside it - 610px of dead column. The full text is on
   the title and in the Flags table on the Data sheet; the card is the index. */
.alert .d{color:var(--ink-2);font-size:var(--t-3);margin-top:2px;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;
  overflow:hidden}

/* ----------------------------------------------------------- data sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--plane);
  overflow:auto;padding:20px 22px 60px;display:none}
.sheet[data-open="1"]{display:block}
.sheet h2{font-size:var(--t-3);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 10px}
.sheet h2:first-of-type{margin-top:14px}
.sheethead{display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap}
.sheethead h1{font-size:var(--t-5);font-weight:var(--w-semi);margin:0}
.crumb{font-size:var(--t-2);color:var(--muted);margin-right:auto}
.back::before{content:"\2039";margin-right:var(--s-2);color:var(--muted)}
/* Right is the right default here: most columns are numbers, and numbers align
   on their last digit or they cannot be compared down a column. What was wrong
   was that nothing opted out, so every text column - sector, account, currency,
   "judged by", "reached through" - was right-ragged against a hard edge and
   had to be read from an unpredictable left margin. Hence .t. */
table{width:100%;border-collapse:collapse;font-size:var(--t-3);
  line-height:var(--lh);font-variant-numeric:tabular-nums}
th{text-align:right;font-weight:var(--w-semi);color:var(--muted);font-size:var(--t-1);
  letter-spacing:.05em;text-transform:uppercase;padding:0 8px 8px;
  border-bottom:1px solid var(--axis);white-space:nowrap}
th:first-child,td:first-child,th.t,td.t{text-align:left}
td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:right;
  white-space:nowrap}
td.wrap{white-space:normal;min-width:260px}
/* The sheet scrolls as one page, so a long table takes its header off screen
   and the reader is left guessing which column they are in. Sticky inside the
   scroller costs nothing and removes the guess. The background is opaque
   because rows pass underneath it. */
thead th{position:sticky;top:0;z-index:1;background:var(--plane)}
.scroll{overflow-x:auto}

/* ------------------------------------------------------------- exposure */
/* Composition answers a share-of-whole question, so every bar is drawn
   against a fixed 100% track rather than scaled to the largest row. A bar
   normalised to its biggest neighbour turns 31% and 16% into 100% and 52%,
   which is the one distortion a composition chart must not introduce. */
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:var(--s-4);margin-bottom:4px}
/* .xcard's own surface rule lived here and was a near-copy of .card's, which
   itself was a byte-for-byte copy of .stat's. All three are now the one rule
   further down; see the note there. Only the type inside differs, and only
   .xcard's value weight actually differed on purpose, and that override sits
   AFTER the shared rule rather than here - both selectors are (0,1,1), so
   source order is the whole argument. Same trap as `.chip b` above. */
/* Namespaced .xrow, not .bar: the weight strip up at line 154 already owns
   .bar, and a second rule on that name silently reflowed it to a grid. */
.xrow{display:grid;grid-template-columns:168px 1fr 66px;gap:var(--s-4);
  align-items:center;padding:3px 0;font-size:var(--t-3);cursor:default;
  border-radius:var(--r-sm)}
/* Only a row that can actually filter something offers to be clicked. The
   unresolved bar looks identical and is inert, so the cursor is the only
   honest warning the reader gets before the click that does nothing. */
.xrow[data-fk]{cursor:pointer}
.xrow[data-fk]:hover{background:var(--surface-2)}
.xrow[data-on="1"]{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.xrow .n{color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-left:5px}
.xrow[data-on="1"] .n{color:var(--ink);font-weight:var(--w-semi)}
.xrow .t{height:11px;border-radius:var(--r-sm);background:var(--grid);overflow:hidden;
  display:flex}
.xrow .f{height:100%;background:var(--accent)}
/* A second tone, deliberately not a second hue. Direct and indirect are the
   same exposure reached two ways; a contrasting colour would read as two
   opposed things rather than one thing counted twice over. */
.xrow .f2{height:100%;background:color-mix(in srgb,var(--accent) 38%,transparent)}
.xrow .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--w-med);
  padding-right:5px}
/* The mass no source could place, drawn rather than footnoted. A composition
   chart that silently omits what it could not resolve is the chart most
   likely to be believed and least entitled to be. */
.xrow.un{cursor:default}
.xrow.un:hover{background:none}
.xrow.un .n,.xrow.un .p{color:var(--muted)}
.xrow.un .f{background:repeating-linear-gradient(135deg,var(--axis) 0 3px,
  transparent 3px 7px)}
.xkey{font-size:var(--t-2);color:var(--muted);margin:1px 0 10px}
.xcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:0 26px}

/* ------------------------------------------------------ sheet as a surface */
/* The sheet used to be one long scroll of everything. A table you cannot
   collapse, sort or filter is a printout, and a printout goes stale the
   moment you want a different question answered. */
.sheetnav{position:sticky;top:-20px;z-index:3;background:var(--plane);
  padding:8px 0 9px;margin:0 0 4px;border-bottom:1px solid var(--grid);
  display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center}
.navb{font-size:var(--t-2);padding:4px 11px;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--ink-2);background:var(--surface-1)}
.navb:hover{border-color:var(--axis);color:var(--ink)}
.sheet h2{cursor:pointer;user-select:none;display:flex;align-items:center;gap:var(--s-3)}
.sheet h2::before{content:"▾";font-size:var(--t-caret);color:var(--axis);
  transition:transform .12s}
.sheet h2[data-shut="1"]::before{transform:rotate(-90deg)}
.sec[data-shut="1"]{display:none}
/* One live filter, stated in words, clearable, and applied to every table it
   can touch. A filter that is not visible is a lie the page tells quietly. */
.xchip{display:inline-flex;align-items:center;gap:var(--s-3);font-size:var(--t-2);
  padding:3px 6px 3px 11px;border-radius:var(--r-pill);margin-left:auto;
  background:color-mix(in srgb,var(--accent) 15%,transparent);
  color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.xchip b{font-weight:var(--w-semi)}
.xchip button{font-size:var(--t-4);line-height:1;padding:0 4px;color:var(--ink-2)}
.xchip button:hover{color:var(--ink)}
.xsearch{font:inherit;font-size:var(--t-2);padding:4px 9px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--surface-1);color:var(--ink);
  width:170px;outline:none}
.xsearch:focus{border-color:var(--accent)}
.xtog{font-size:var(--t-2);padding:4px 10px;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--muted);background:var(--surface-1)}
.xtog[aria-pressed="true"]{color:var(--ink);border-color:var(--axis);
  background:var(--surface-2)}
/* Sortable headers. The arrow marks the column actually in force, because a
   table sorted by something other than what you last clicked is how a reader
   ends up reading the wrong row as the biggest. */
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th.s[data-dir]::after{content:"▾";margin-left:4px;font-size:var(--t-caret)}
th.s[data-dir="1"]::after{content:"▴"}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr[data-on="1"] td{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.sheet .empty{font-size:var(--t-3);color:var(--muted);padding:10px 0}
/* ------------------------------------------------------------- reporting */
.cal{display:grid;grid-template-columns:70px 1fr;gap:0 14px;align-items:start}
.calwk{font-size:var(--t-1);font-weight:var(--w-bold);letter-spacing:.09em;color:var(--muted);
  text-transform:uppercase;padding:9px 0 0}
.calbox{border-left:2px solid var(--grid);padding:0 0 12px 14px}
.calbox.soon{border-left-color:var(--warn)}
.calrow{display:flex;align-items:baseline;gap:var(--s-4);padding:5px 0;
  font-size:var(--t-3);cursor:pointer;border-radius:var(--r-sm)}
.calrow:hover{background:var(--surface-2)}
.calrow .d{color:var(--muted);font-size:var(--t-2);width:52px;flex:none}
.calrow .sym{font-weight:var(--w-semi);width:88px;flex:none}
.calrow .co{color:var(--ink-2);flex:1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.calrow .wt{font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* Yahoo's own "this date is extrapolated" flag, carried to the surface. A
   guessed date printed beside a confirmed one with no mark is the
   derived-status bug this repo keeps finding in its own display layer. */
.est{font-size:var(--t-1);color:var(--muted);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 4px;font-weight:var(--w-semi)}
.beat{color:var(--good-ink);font-weight:var(--w-semi)}
.miss{color:var(--crit-ink);font-weight:var(--w-semi)}

/* ------------------------------------------------------------------ views */
/* Two top-level views, one surface each. The cockpit used to open on a single
   position, which meant the first thing it showed you was one name out of
   twenty-four and nothing about the book. Overview is the altitude above the
   rail; Positions is the rail. The data sheet stays an overlay on both,
   because it is an appendix to whichever one you are reading. */
.view{display:flex;flex-direction:column;flex:1;min-height:0}
.view[hidden]{display:none}
/* The nav and the theme button are one group so a wrap can never put them on
   separate lines. Auto-margin on the nav alone did exactly that: the nav took
   the right of its line and the button fell to the next one, left-aligned. */
.tctl{display:flex;align-items:center;gap:var(--s-6);margin-left:auto}
.vnav{display:flex;gap:var(--s-1)}
.vbtn{padding:4px 11px;border-radius:var(--r-md);font-size:var(--t-3);font-weight:var(--w-semi);
  color:var(--muted);border:1px solid transparent;background:none}
.vbtn:hover{color:var(--ink-2)}
.vbtn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);
  border-color:var(--border)}

.ov{overflow-y:auto;flex:1;padding:14px 16px 28px;background:var(--surface-1)}

/* Twelve fixed tracks, not auto-fit. Auto-fit decided the column count from the
   viewport and the cards took whatever fell out: at 1920 it resolved to six,
   which left Concentration alone on a row and Flags alone on the last one, with
   five empty tracks beside each. Fixed tracks let the spans be declared, so the
   rows close: 8+4, 4+4+4, 6+6, 12. The headline band above uses the same twelve
   tracks (4 stats x 3) so a stat edge lines up with a card edge. */
.ovgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  gap:var(--s-5);align-items:start}
/* Scoped as children so each span class outranks the `> *` default rather than
   merely following it. Without that, a later tier's default silently overrides
   an earlier tier's explicit span - they tie on specificity and order decides. */
.ovgrid > *{grid-column:span 4}
.ovgrid > .ov-6{grid-column:span 6}
.ovgrid > .ov-8{grid-column:span 8}
.ovgrid > .ov-12{grid-column:span 12}
/* One surface, three names.
   .card and .stat were byte-identical apart from `min-width:0`, and .xcard was
   the same box with a different radius and 1px less padding - three rules for
   one idea, which is exactly the state in which a fourth gets added. The names
   stay because they mean different things in the markup (a panel, a headline
   figure, a composition card); what they no longer do is each redescribe a
   bordered box.
   The label/value/note triple was written out three times too, with
   letter-spacing .1em against .11em and line-heights 1.05, 1.1, 1.35 and 1.4 -
   differences nobody chose. One triple now, off the scale. */
.card,.stat,.xcard{border:1px solid var(--border);border-radius:var(--r-lg);
  padding:11px 13px;background:var(--surface-1);min-width:0}
.card .k,.stat .k,.xcard .k{font-size:var(--t-1);font-weight:var(--w-bold);
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.card .v,.stat .v,.xcard .v{font-size:var(--t-6);font-weight:var(--w-bold);
  letter-spacing:-.02em;margin:var(--s-2) 0 var(--s-1);
  font-variant-numeric:tabular-nums;line-height:var(--lh-num)}
.card .s,.stat .s,.xcard .s{font-size:var(--t-2);color:var(--ink-2);
  line-height:var(--lh)}
/* The one difference that was a decision: a composition card's figure is a
   share of the book, not a headline, and sits a weight below the band's. */
.xcard .v{font-weight:var(--w-semi)}
.card h3{font-size:var(--t-1);font-weight:var(--w-bold);letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin:0 0 9px;
  display:flex;justify-content:space-between;gap:var(--s-4);align-items:baseline}
.card h3 .rt{font-weight:var(--w-semi);letter-spacing:.02em;text-transform:none;
  font-size:var(--t-2)}

/* The headline band. Four numbers that describe the whole book, at a size that
   says they are the headline - not a 12px strip in the chrome. */
.ovtop{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  gap:var(--s-5);margin-bottom:13px}
.ovtop > *{grid-column:span 4}
/* .stat's own surface and label/value/note rules were here. They are the shared
   rule above now - .stat is what the headline band's boxes are called, not a
   fourth description of a bordered box. */

/* ---------------------------------------------------------------- treemap */
/* Rectangles arrive from Python already placed (see treemap.py). The page
   positions them in percent and does no layout arithmetic of its own, so the
   picture cannot drift from the numbers beside it. */
/* The ratio is what the picture wants; the cap is what the page can spend. At
   full width the 21:9 box grew to ~790px tall and pushed everything else below
   the fold, so the card that answers "what do I own" was also the card that
   hid the rest. Capped, the treemap is the tallest thing on the page and still
   fits above the next row on a 1080 screen. */
.tmap{position:relative;width:100%;aspect-ratio:21/9;min-height:230px;
  max-height:520px;
  background:var(--plane);border-radius:var(--r-md);overflow:hidden}
.tile{position:absolute;overflow:hidden;padding:4px 6px;cursor:default;
  border:1px solid var(--surface-1);border-radius:var(--r-sm);
  display:flex;flex-direction:column;justify-content:flex-start}
.tile[data-sym]{cursor:pointer}
.tile[data-sym]:hover{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}
.tile .tt{font-size:var(--t-2);font-weight:var(--w-bold);color:var(--ink);line-height:var(--lh-tight);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tw{font-size:var(--t-1);color:var(--ink-2);font-variant-numeric:tabular-nums;
  line-height:var(--lh);white-space:nowrap}
/* Two rungs, set by fitTiles against measured pixels. `sm` drops the weight
   line, `xs` drops both. The old `xs` rule hid .tt and left .tw showing, so
   the smallest tiles displayed a percentage with no ticker attached to it -
   a number labelled by nothing, which is worse than no label at all. */
.tile.sm .tw{display:none}
.tile.xs .tt,.tile.xs .tw{display:none}
.tmap.empty{display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 var(--s-6);color:var(--muted);font-size:var(--t-3)}
.tmapkey{display:flex;gap:var(--s-5);align-items:center;flex-wrap:wrap;
  font-size:var(--t-2);color:var(--muted);margin-top:7px}
/* The key is a gradient because tone() is a continuous function. Seven discrete
   swatches implied seven buckets, which is a claim about the tiles that is not
   true - a tile at +7% and one at +14% are different colours, not one band. */
.ramp{display:inline-block;height:9px;width:112px;border-radius:var(--r-sm);
  border:1px solid var(--border)}

/* ------------------------------------------------------------- list cards */
/* A ranked list with a magnitude bar. The bar is scaled to the largest row in
   the card, which is legitimate here because the question is "which of these
   is biggest", not "what share of the whole is this" - the opposite of the
   composition bars up at .xrow, and the reason they are different classes. */
.lrow{display:grid;grid-template-columns:62px 1fr 74px;gap:var(--s-4);
  align-items:center;padding:3px 0;font-size:var(--t-3);border-radius:var(--r-sm)}
.lrow.click{cursor:pointer}
.lrow.click:hover{background:var(--surface-2)}
.lrow .t{font-weight:var(--w-semi);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.lrow .track{position:relative;height:13px;background:var(--surface-2);
  border-radius:var(--r-sm);overflow:hidden}
/* The zero line sat at left:50% width:1px and the bars started at exactly 50%
   too, so the first bar painted over it every time - the axis was in the markup
   and never once visible. Cutting a 2px gutter at the centre and starting the
   bars outside it fixes it by geometry rather than by z-index, so it holds
   whichever way the stacking context is later rearranged. */
.lrow .track i{position:absolute;top:0;bottom:0;border-radius:var(--r-sm)}
.lrow .track i.p{left:calc(50% + 1px);background:var(--pos)}
.lrow .track i.n{right:calc(50% + 1px);background:var(--neg)}
.lrow .track .mid{position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;
  background:var(--axis)}
.lrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--w-med)}
.lnote{font-size:var(--t-2);color:var(--muted);margin-top:var(--s-3);line-height:var(--lh)}
/* The sheet's composition bars reused at a third of the width. The 168px label
   column there would leave a card here with a 30px track, so the label gives
   way to the bar - the bar is the thing being read. */
.card .xrow{grid-template-columns:minmax(64px,1.15fr) minmax(56px,1fr) 44px;
  gap:var(--s-4);font-size:var(--t-3)}
.card .xrow .n,.card .xrow .p{padding:0}

/* --------------------------------------------------------- calendar strip */
.cstrip{display:flex;gap:var(--s-3);flex-wrap:wrap}
.cpill{border:1px solid var(--border);border-radius:var(--r-md);padding:6px 9px;
  font-size:var(--t-2);min-width:74px}
.cpill.soon{border-color:var(--warn)}
.cpill .d{font-size:var(--t-1);color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase}
.cpill .t{font-weight:var(--w-semi);margin-top:2px}
.cpill .w{font-size:var(--t-1);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------ narrow: two column */
/* Below 1180px the three columns stop fitting - 264 of rail plus 336 of thesis
   leaves the chart under 580px. The fix drops a COLUMN, not the full-height
   model. Stacking all three panes was the old behaviour and it was measured at
   a 1000px canvas: the app became 2589px tall, the thesis started 1077px below
   the fold, the chart was a fixed 340px letterbox, and the rail was a 320px
   peephole onto 2019px of names - an inner scrollbar nested inside a page that
   also scrolled, which is the one arrangement guaranteed to trap a wheel.

   Here the rail keeps its full height down the left, and the right column
   carries the chart over the thesis. The page still does not scroll: every
   region is its own scroll box, which is the contract the wide layout already
   has, so narrowing the window changes the shape and not the rules. */
@media (max-width:1180px) and (min-width:761px){
  .app{grid-template-columns:232px minmax(0,1fr);
    grid-template-rows:minmax(220px,1.15fr) minmax(170px,1fr);
    grid-template-areas:"rail mid" "rail thesis"}
  .rail{grid-area:rail;border-right:1px solid var(--border)}
  .mid{grid-area:mid;border-bottom:1px solid var(--border)}
  .thesis{grid-area:thesis}
  /* The panes are no longer three siblings in one row, so the blanket rule
     would draw a left border between the chart and the thesis, which are
     stacked. The two borders that remain are set explicitly above. */
  .pane + .pane{border-left:0}
  /* The legend wraps rather than disappearing. It is the only thing on the
     page that says what the dashed line means, and a narrow window is not a
     reason to stop explaining a chart. */
  .ranges{flex-wrap:wrap}
  /* Same twelve tracks, halved spans: two cards per row instead of three, and
     the treemap takes the full width back because at 1180px a 2/3 column is
     under 800px and the small tiles stop being legible before the card does. */
  .ovgrid > *{grid-column:span 6}
  .ovgrid > .ov-8{grid-column:span 12}
  /* The three stats stay on one row: at 1180 that is ~380px each, which is
     wider than the widest of them needs. Halving them would leave one alone. */
}

/* ------------------------------------------------------ navigation affordances */
.alert.click,.cpill.click{cursor:pointer}
.alert.click:hover .t{text-decoration:underline;text-underline-offset:2px}
.cpill.click:hover{border-color:var(--axis);background:var(--surface-2)}
.golink{display:inline-block;margin-top:var(--s-4);padding:0;border:0;
  background:none;color:var(--accent);font:inherit;font-size:var(--t-2);
  cursor:pointer}
.golink:hover{text-decoration:underline;text-underline-offset:2px}
.tbtn kbd{font:inherit;font-size:var(--t-1);color:var(--muted);margin-left:4px;
  padding:0 4px;border:1px solid var(--border);border-radius:var(--r-sm)}
.pal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);
  display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal[hidden]{display:none}
.palbox{width:min(560px,100%);background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden;
  display:flex;flex-direction:column;max-height:70vh}
#palq{border:0;border-bottom:1px solid var(--border);padding:12px 14px;
  font:inherit;font-size:var(--t-4);background:transparent;color:var(--ink);outline:none}
.pallist{overflow-y:auto;padding:4px 0}
.palrow{display:flex;gap:var(--s-4);align-items:baseline;width:100%;text-align:left;
  padding:7px 14px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.palrow[aria-selected="true"]{background:var(--surface-2)}
.palrow .k{flex:none;width:74px;font-size:var(--t-1);color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase}
.palrow b{font-weight:var(--w-semi)}
.palrow .s{color:var(--ink-2);font-size:var(--t-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.palrow .dot{flex:none;align-self:center}
.palempty{padding:10px 14px;color:var(--muted)}
.palfoot{border-top:1px solid var(--border);padding:7px 14px;font-size:var(--t-1);
  color:var(--muted)}

/* ------------------------------------------------------ narrow: one column */
/* Below 761px there is no honest two-column split left, so this tier stacks and
   lets the PAGE scroll - the one width where that is right, because a single
   narrow column holding three nested scroll boxes is worse than a long page.

   This is a fallback, not a designed surface: the cockpit is a desktop terminal
   and nothing here is tuned for a phone. It has not been verified in a browser
   at this width. What it does guarantee is that no region is a peephole - the
   rail gets half the viewport rather than a fixed 320px, so the inner scroll is
   never a tenth of its own content. */
@media (max-width:760px){
  body{overflow:auto;display:block}
  .view{display:block}
  .view[hidden]{display:none}
  .ov{overflow:visible}
  .app{grid-template-columns:1fr;height:auto}
  .pane + .pane{border-left:0;border-top:1px solid var(--border)}
  .pbody{overflow:visible}
  .rail .pbody{max-height:50vh;overflow-y:auto}
  .chartbox{height:320px;flex:none}
  /* The tape wraps at every width now; narrow only buys back the side padding. */
  .tape{padding:8px 12px}
  .ranges{flex-wrap:wrap}
  /* One card per row. The stats stay paired: they are four short numbers and
     stacking them costs four screens of scroll to say what two lines can. */
  .ovgrid > *,.ovgrid > .ov-6,.ovgrid > .ov-8{grid-column:span 12}
  .ovtop > *{grid-column:span 12}
}
</style>

<header class="tape">
  <span class="brand">EQUITY COCKPIT</span>
  <span class="big" id="t-value">—</span>
  <span class="chip" id="t-pl"></span>
  <span class="sep"></span>
  <span class="chip" id="t-meta"></span>
  <div class="tctl">
  <nav class="vnav" id="vnav">
    <button class="vbtn" data-view="overview" aria-pressed="true">Overview</button>
    <button class="vbtn" data-view="positions" aria-pressed="false">Positions</button>
  </nav>
  <!-- Data used to sit inside the nav above, styled as a third peer, and it is
       not one: it is an overlay over whichever view is up. A control that looks
       like a tab and behaves like a drawer teaches the reader a rule the page
       then breaks, and there was no way back from it but a Close button in a
       far corner. It is now outside the nav, shaped like the other utility
       buttons, and says aria-expanded rather than aria-pressed - which is the
       difference between "this surface is showing" and "you are on this tab". -->
  <!-- One box that reaches everything: every held and watched name, both
       views and each drawer section. The page grew thirteen sections and two
       views faster than it grew ways between them. -->
  <button class="tbtn" id="t-jump" aria-haspopup="dialog" aria-controls="pal"
    title="Find a position or a section. Keys: Ctrl K or / to open, 1 Overview, 2 Positions, D the data drawer, Esc to close">Jump to&hellip; <kbd>Ctrl K</kbd></button>
  <button class="tbtn drawer" id="t-sheet" aria-expanded="false"
    aria-controls="sheet">All data</button>
  <!-- Label and pressed state are both set by themeLabel() at boot, from what
       is actually rendered. This text is only what shows if the script dies. -->
  <button class="tbtn" id="t-theme" aria-pressed="false">Theme</button>
  </div>
</header>
<div id="t-banner"></div>
<div class="pal" id="pal" role="dialog" aria-label="Jump to" hidden>
  <div class="palbox">
    <input id="palq" type="search" autocomplete="off" spellcheck="false"
      placeholder="Ticker, company or section" aria-controls="pallist">
    <div class="pallist" id="pallist" role="listbox"></div>

<script id="chartlib">/*__CHARTLIB__*/</script>
<script id="app">
const D = /*__DATA__*/;

/* Everything below displays; nothing decides. Any number you see was computed
   in Python and is in the payload - if a figure is wrong, fix analyse.py. */

const $  = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur = (n) => n == null ? '—' : '€' + Number(n).toLocaleString('en-GB',
  {maximumFractionDigits:0});
const px  = (n) => n == null ? '—' : Number(n).toLocaleString('en-GB',
  {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (n, dp) => n == null ? '—' :
  (n > 0 ? '+' : '') + Number(n).toFixed(dp == null ? 2 : dp) + '%';
const cls = (n) => n == null ? '' : (n > 0 ? 'up-t' : n < 0 ? 'dn-t' : '');
const num = (n, dp) => n == null ? '—' : Number(n).toFixed(dp == null ? 2 : dp);
// Share counts. Whole lots print whole - a holding of 240 was rendering as the
// raw float "240" beside one that summed to "83.33333333333333", which is a
// float artefact of adding lots together, not a number anybody holds. Grouped,
// and cut at four places because fractional-share brokers do not quote more.
const qty = (n) => n == null ? '—' : Number(n).toLocaleString('en-GB',
  {maximumFractionDigits:4});
// The analyser writes gaps as lowercase fragments ("no thesis on the Equity
// Log") because they are also read mid-sentence in Telegram. Here they start a
// sentence, so they get a capital - in the page, not in the payload.
const cap = (s) => !s ? '' : String(s).charAt(0).toUpperCase() + String(s).slice(1);
// Market cap in the quote currency, at the magnitude a human reads. 442bn, not
// 442,100,482,048 - the digits past the third are noise on a figure that moves
// by a percent a day.
const big = (n) => {
  if (n == null) return '—';
  const a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2) + 'tn';
  if (a >= 1e9)  return (n / 1e9).toFixed(1) + 'bn';
  if (a >= 1e6)  return (n / 1e6).toFixed(0) + 'm';
  return Number(n).toLocaleString('en-GB', {maximumFractionDigits:0});
};
// Where a bounded reading sits in its band, with the two conventional lines
// drawn faintly behind it. lo/hi are in the same units as v.
const meter = (v, lo, hi, marks) => {
  if (v == null) return '';
  const at = (x) => Math.max(0, Math.min(100, ((x - lo) / (hi - lo)) * 100));
  return `<span class="meter">${(marks || []).map(
    (m) => `<u style="left:${at(m).toFixed(1)}%"></u>`).join('')
  }<i style="left:${at(v).toFixed(1)}%"></i></span>`;
};
const LEVEL = {critical:'var(--crit)', warning:'var(--warn)',
               info:'var(--muted)', good:'var(--good)'};

/* ---------------------------------------------------------------- model */

// Holdings are per ISIN per account, so the same symbol can appear twice. The
// rail is a list of companies, not of custody rows - fold them together first.
const held = new Map();

// What the last live-price attempt did. `null` means no attempt has been made
// or none applies - opened from disk, for instance - and the chip stays hidden
// rather than claiming anything. Every other state, including failure, is
// recorded and shown, because a page that tried and failed must not look
// identical to one that never tried.
let LIVE = null;  // {at:Date, priced, asked, missing:[], fxMissing:[], error}

function liveChip() {
  if (!LIVE) {
    // Opened from disk the live layer never starts, and an empty chip let a
    // snapshot pass for a page that was simply between ticks.
    const web = typeof location !== 'undefined'
      && (location.protocol === 'http:' || location.protocol === 'https:');
    const built = String(D.generated || '').replace('T', ' ').slice(0, 16);
    return web
      ? 'Live <b title="waiting for the first price refresh">connecting</b>'
      : `Snapshot <b class="dn-t" title="opened from a file, so prices never `
        + `refresh here - every figure is as built at ${esc(built)}. The `
        + `deployed copy is the live one.">not live</b>`;
  }
  if (LIVE.error && LIVE.carried) {
    const was = LIVE.at.toTimeString().slice(0, 5);
    return `Live <b class="dn-t" title="${esc(LIVE.error)} · still showing the `
      + `prices that landed at ${was}, the last refresh that worked">held ${was}</b>`;
  }
  if (LIVE.error) {
    return `Live <b class="dn-t" title="${esc(LIVE.error)} · showing the prices `
      + `this file was built with">off</b>`;
  }
  const hhmm = LIVE.at.toTimeString().slice(0, 5);
  const n = (LIVE.missing || []).length;
  // The count of what did NOT come back is part of the headline, not a detail
  // in a tooltip. `40 priced` and `40 priced, 4 unpriced` are different claims
  // about the same total.
  const short = n
    ? ` <b class="dn-t" title="${esc(LIVE.missing.join(', '))} · these keep `
      + `their build-time price">${n} unpriced</b>`
    : '';
  return `Live <b title="${LIVE.priced}/${LIVE.asked} priced from Yahoo at `
    + `${esc(LIVE.at.toString())}">${hhmm}</b>${short}`;
}

// Marks a figure that the live layer deliberately does NOT recompute, and says
// why on hover. Silent about it when nothing is live, because then every number
// on the page is a build-time number and singling three of them out would imply
// the rest are something else.
//
// This is the honest half of going live. Once part of a page updates, the
// reader reasonably assumes all of it does; the figures that cannot follow have
// to say so themselves, or they become the most misleading numbers on screen
// precisely because everything around them is fresh.
// The look-through is linear in position value, so it follows a price - but
// only when the page carries each fund's published composition
// (D.lookthrough). A page built without it still says "as at build" on those
// breakdowns; claiming them live without the weights would be the bug this
// whole module was written to remove.
const LOOKTHRU_WHY = 'the look-through scales each fund by its published '
  + 'composition, and that composition is not carried in this page - so the '
  + 'breakdown moves when the file is rebuilt, not when a price ticks';

const atBuild = (why) => (LIVE && (!LIVE.error || LIVE.carried))
  ? ` · <b class="dn-t" title="${esc(why)} · this figure is as at ${
      esc(D.generated || 'the last build')}, not live">as at build</b>`
  : '';
// Keyed on whether the recompute actually ran, not on whether the key exists:
// STATS is what all() wrote, so a look-through that was skipped keeps its mark.
const lookMark = () => {
  const s = DERIVE.stats();
  return s && s.lookthrough ? '' : atBuild(LOOKTHRU_WHY);
};

// Freshness, per number rather than per page.
//
// The tape already says whether the live layer is working, and it says it once,
// at the top. That is the wrong altitude: whether a price is current is a fact
// about that price, and the reader is looking at the price, not at the tape.
// Four states, and the distinction that earns its keep is `build` against
// `stale`:
//
//   live      this tick's quote landed for this symbol
//   build     nobody has asked yet, or this symbol is not one the live layer
//             can ask about at all - no Yahoo mapping, or mapped to MISSING
//   stale     it WAS asked, and nothing usable came back; the build's price is
//             still on screen
//   unpriced  there is no price at all
//
// `build` and `stale` look identical - the same number, from the same moment -
// and mean opposite things. One is "nothing has asked", the other is "something
// asked and was refused". Collapsing them is this repo's own bug class in its
// price-shaped form: absent is not zero, and not-asked is not refused.
const LIVEASK = new Set();   // symbols the live layer puts to the vendor
const LIVEMISS = new Set();  // of those, the ones it got nothing usable for

function freshnessOf(price, wasStale, sym) {
  if (price == null) return 'unpriced';
  // A failed tick after a good one leaves the good one's prices on screen -
  // D was restated from them and nothing puts the build's back. `carried`
  // says so, and those prices keep reading `live` at the time they landed,
  // not `build`: the mark has to describe the number beside it.
  if (!LIVE || (LIVE.error && !LIVE.carried) || !LIVEASK.has(sym)) {
    return wasStale ? 'stale' : 'build';
  }
  return LIVEMISS.has(sym) ? 'stale' : 'live';
}

// The glyph lives in a slot that is reserved whether or not there is anything
// to put in it, so the page does not reflow the instant quotes land - a column
// that shifts sideways when it updates is how a reader learns to stop trusting
// where a number is.
const FRESH = {
  live: ['●', 'fr-live', 'Priced live'],
  // Deliberately says what is true rather than why. `build` covers three
  // different causes - nothing has ticked yet, the whole live layer is off, or
  // this symbol is one it cannot ask about - and the mark cannot tell them
  // apart from where it sits. The tape carries the why; the mark carries the
  // age, which is the part that belongs next to the number.
  build: ['·', 'fr-build', 'As at the build - no live price has replaced '
    + 'this one'],
  stale: ['○', 'fr-stale', 'Asked, and nothing usable came back - this is '
    + 'still the build-time price'],
  unpriced: ['', 'fr-none', 'No price'],
};

// The last candle, brought forward to the live price.
//
// Yahoo's daily series already carries TODAY as a partial bar - measured, every
// symbol in the book had a bar dated today whose close equalled the build-time
// price. So the chart was not missing a bar; it was drawing a real one that
// stopped moving at 07:40 while every number beside it went on ticking. A
// candle is the most price-shaped thing on the page, and it was the one thing
// the live layer did not reach.
//
// Held in its own map rather than written into `D.history`, for two reasons.
// `D.history` is what Python wrote and what `D.indicators` was computed from,
// and this repo's rule is that a live figure never overwrites a recorded one.
// And the merge has to be repeatable: every tick re-derives the bar from the
// cached one, so a quote that comes back lower cannot leave a high behind that
// no trade ever made.
const LIVEBAR = new Map();  // sym -> [date, open, high, low, close]

// The exchange's trading date for a quote, from Yahoo's own timestamp rather
// than from this machine's clock - `new Date()` on a page left open overnight
// would roll the date while the quote it is labelling did not.
//
// Local time is the right frame for this book: every holding lists in Europe or
// the US, and no US session crosses midnight in a European timezone. A listing
// in Asia would need the exchange's own zone, which is not in the payload - so
// if one is ever added, this is the line that has to change rather than quietly
// mislabel a bar.
function quoteDay(asOf) {
  if (!(asOf > 0)) return null;
  const d = new Date(asOf * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${
    String(d.getDate()).padStart(2, '0')}`;
}

// Merge a quote into the tail of the cached series. Never mutates `bars`.
function noteLiveBar(sym, hit) {
  const series = (D.history || {})[sym];
  const bars = series && series.bars;
  if (!bars || !bars.length || !hit || !(hit.price > 0)) return;
  const day = quoteDay(hit.asOf);
  if (!day) return;
  const last = bars[bars.length - 1];

  // The cache is AHEAD of the quote. Happens on a holiday or a halted listing,
  // where Yahoo keeps answering with the last session's price. Drawing that
  // price onto today would invent a session that did not happen, and rewriting
  // the earlier bar would be a live figure overwriting a recorded one. Do
  // neither: drop the live bar and let the cached series stand.
  if (day < last[0]) { LIVEBAR.delete(sym); return; }

  if (day === last[0]) {
    // Yahoo's own bar for today, carried forward. Open is left exactly as the
    // vendor recorded it - it is the opening print and no quote can improve on
    // it - and the range is only ever WIDENED. The true high is at least the
    // recorded high and at least the price now; the same in reverse for the
    // low. Both are floors, which is the honest direction for a bar that has
    // not finished forming.
    LIVEBAR.set(sym, [day, last[1], Math.max(last[2], hit.price),
                      Math.min(last[3], hit.price), hit.price]);
    return;
  }

  // A session the cache has never seen - the page was built before the open,
  // or has been left running across a date boundary. `session` is the endpoint's
  // aggregate of the five-minute closes, so its high and low are floors and its
  // open is the first five-minute close rather than the opening auction. With
  // nothing to draw a range from, the bar is flat at the price: a bar that says
  // "no range known yet" rather than one that invents one.
  const s = hit.session;
  const o = s && s.open > 0 ? s.open : hit.price;
  const hi = s && s.high > 0 ? Math.max(s.high, hit.price) : Math.max(o, hit.price);
  const lo = s && s.low > 0 ? Math.min(s.low, hit.price) : Math.min(o, hit.price);
  LIVEBAR.set(sym, [day, o, hi, lo, hit.price]);
}

// The cached series with the live bar merged in, or the cached series itself.
// Gated on the row's OWN freshness, which is the same value the mark beside the
// price is drawn from - so the candle and the mark cannot disagree about
// whether this symbol is live. That matters on the tick after a failure: LIVE
// carries an error, every mark falls back to `as at build`, and without this
// gate the chart would still be showing a candle that moved.
function barsFor(r) {
  const series = (D.history || {})[r.sym];
  const bars = series && series.bars ? series.bars : null;
  if (!bars || !bars.length) return null;
  const lb = r.freshness === 'live' ? LIVEBAR.get(r.sym) : null;
  if (!lb) return bars;
  const last = bars[bars.length - 1];
  // The volume column is deliberately not carried onto the live bar: no quote
  // in this response reports volume, and repeating the cached day's figure
  // beside a moved price would be a stale number wearing a live one's clothes.
  return lb[0] === last[0]
    ? bars.slice(0, -1).concat([lb])
    : bars.concat([lb]);
}

function fresh(f) {
  const m = FRESH[f] || FRESH.unpriced;
  const when = f === 'live' && LIVE && LIVE.at
    ? ' at ' + LIVE.at.toTimeString().slice(0, 5)
      + (LIVE.carried ? ' - the refresh after that failed' : '')
    : f === 'build' || f === 'stale' ? ' (' + esc(D.generated || 'last build') + ')' : '';
  return `<i class="fr ${m[1]}" aria-label="${esc(m[2] + when)}"
    title="${esc(m[2] + when)}">${m[0]}</i>`;
}

/* ----------------------------------------------------- derived numbers */
//
// Every number on this page that is a function of a price, recomputed in one
// place, from one input: D.holdings.
//
// Python computes all of it at build time and the page used to simply print
// the answers. That was correct while the page was a photograph. It stopped
// being correct the moment prices started arriving in the browser: the tape
// went live while the Overview's P/L, the treemap's areas, the concentration
// figures, the coverage percentage and every watchlist upside stayed frozen at
// build time. One page quoting two different books, with nothing on screen
// saying which number came from which.
//
// So the arithmetic is TRANSCRIBED, not approximated. Each function below is a
// port of the Python that owns the same number and is named after it, down to
// the decimal places - which are deliberately inconsistent in the original
// (off_high is 1dp, pl_pct is 2dp, hhi is 4dp, book_ter_pct is 3dp) and are
// inconsistent here in exactly the same way.
//
// `parity()` is what makes that claim checkable rather than asserted: it runs
// the whole recompute against the prices the file was BUILT with and demands
// it reproduce Python's own output. A port that has never been run against its
// original is not a port, it is a second opinion.
//
// The look-through - sectors, industries, geography, single names and fund
// overlap - IS recomputed, from each fund's published composition, which the
// build carries as D.lookthrough (exposure.inputs). Each is value times a
// fixed weight, so it follows a price exactly.
//
// Three things are deliberately NOT recomputed, and the page says so rather
// than letting them look live:
//   * the money-weighted return (IRR) - it needs the dated lot cashflows, and
//     those are not in this payload at all;
//   * the blended multiples - each P/E is the vendor's figure struck at the
//     vendor's own price. Re-weighting them on a live price while the ratios
//     themselves stay at Yahoo's asof would be a hybrid of two moments that
//     neither source ever published;
//   * the indicators - RSI, the moving averages, ATR - which are functions of
//     daily closing bars and are supposed to be yesterday's.
const DERIVE = (function () {
  // Python's round() is half-to-even and JS's is half-away-from-zero. On
  // binary floats an exact tie essentially never occurs, so this is the same
  // function in practice - and `parity` compares with a tolerance of one unit
  // in the last place rather than demanding bit equality, which is what makes
  // the difference genuinely not matter.
  const R = (n, dp) => (n == null || !isFinite(n)) ? null
    : Math.round(n * Math.pow(10, dp)) / Math.pow(10, dp);

  /* ---- treemap.py:19-85, transcribed ---- */

  function worst(row, side) {
    const total = row.reduce((a, b) => a + b, 0);
    if (total <= 0 || side <= 0) return Infinity;
    return Math.max((side * side * Math.max(...row)) / (total * total),
                    (total * total) / (side * side * Math.min(...row)));
  }

  // A value that is null or <= 0 is DROPPED, never floored so it still draws.
  // The caller reports the drop; see allocation().
  function squarify(items, width, height) {
    width = width == null ? 100 : width;
    height = height == null ? 100 : height;
    let vals = items.filter((kv) => kv[1] != null && kv[1] > 0)
                    .map((kv) => [kv[0], Number(kv[1])])
                    .sort((a, b) => b[1] - a[1]);
    if (!vals.length) return [];

    const total = vals.reduce((a, kv) => a + kv[1], 0);
    const scale = (width * height) / total;
    vals = vals.map((kv) => [kv[0], kv[1] * scale]);

    const out = [];
    let x = 0, y = 0, w = width, h = height;
    while (vals.length) {
      const side = Math.min(w, h);
      let n = 1;
      while (n < vals.length) {
        const row = vals.slice(0, n).map((kv) => kv[1]);
        if (worst(vals.slice(0, n + 1).map((kv) => kv[1]), side) > worst(row, side)) break;
        n += 1;
      }
      const row = vals.slice(0, n);
      vals = vals.slice(n);
      const span = row.reduce((a, kv) => a + kv[1], 0);

      if (w >= h) {                       // row runs down the left edge
        const rw = h ? span / h : 0;
        let oy = y;
        for (const [key, v] of row) {
          const rh = span ? (v / span) * h : 0;
          out.push({key, x, y: oy, w: rw, h: rh});
          oy += rh;
        }
        x += rw; w -= rw;
      } else {                            // row runs across the top edge
        const rh = w ? span / w : 0;
        let ox = x;
        for (const [key, v] of row) {
          const rw = span ? (v / span) * w : 0;
          out.push({key, x: ox, y, w: rw, h: rh});
          ox += rw;
        }
        y += rh; h -= rh;
      }
    }
    return out;
  }

  /* ---- analyse.value_holdings, analyse.price_sanity ---- */

  // analyse.py:91-124 and 281-296. The per-row figures the live feed does not
  // itself supply. `price`, `value_eur`, `day_pct` and `stale` are written by
  // the caller from the quote; everything here is derived from those.
  function holdings(rows) {
    for (const h of rows) {
      const cost = h.cost_eur;
      // A cost of exactly zero yields null, not zero: a position transferred
      // in without a purchase price is unknowable, not flat. Truthiness is the
      // test in the original and it is the test here.
      h.pl_eur = cost ? R(h.value_eur - cost, 2) : null;
      h.pl_pct = cost ? R((h.value_eur / cost - 1) * 100, 2) : null;
      // 52-week high is a build-time fact the live feed does not carry, so
      // off_high moves only because the price did - which is the whole point
      // of the measure. Without a high it is null, never zero.
      h.off_high = (!h.stale && h.year_high)
        ? R((h.price / h.year_high - 1) * 100, 1) : null;
      // The broker's own valuation is the independent check that the symbol
      // mapping is right, and it only means anything against a live price.
      if (!h.stale && h.nordnet_mv_eur) {
        h.vs_nordnet_pct = R((h.value_eur / h.nordnet_mv_eur - 1) * 100, 1);
      }
    }
    return rows;
  }

  /* ---- overview.py, transcribed ---- */

  // overview.py:33-42. Falls back to the ISIN for the index funds that have no
  // Yahoo symbol: real positions with real value and no chart behind them.
  const ovKey = (h) => (h.yahoo && h.yahoo !== 'MISSING')
    ? h.yahoo : 'isin:' + h.isin;

  // overview.py:45-95. One row per name, custody accounts merged. P/L percent
  // is recomputed from the merged value and cost - it is NOT the average of
  // the two accounts' percentages.
  function fold(rows, klassByKey) {
    const out = new Map();
    for (const row of rows) {
      const key = ovKey(row);
      let cur = out.get(key);
      if (!cur) {
        const sym = row.yahoo;
        cur = {key, sym: (sym && sym !== 'MISSING') ? sym : null,
               ticker: row.ticker || row.tunnus || key, name: row.name,
               klass: klassByKey ? klassByKey.get(key) : null,
               bucket: row.bucket, accounts: [],
               value_eur: 0, cost_eur: 0,
               // The same symbol has the same day move in both accounts, so
               // this is carried across rather than combined. Null stays null.
               day_pct: row.day_pct == null ? null : row.day_pct,
               price: row.price, units: 0};
        out.set(key, cur);
      }
      cur.value_eur += row.value_eur || 0;
      cur.cost_eur += row.cost_eur || 0;
      cur.units += row.units || 0;
      if (row.day_pct != null) cur.day_pct = row.day_pct;
      if (row.account && !cur.accounts.includes(row.account)) cur.accounts.push(row.account);
    }
    const list = [];
    for (const cur of out.values()) {
      const value = R(cur.value_eur, 2), cost = R(cur.cost_eur, 2);
      cur.value_eur = value; cur.cost_eur = cost;
      cur.units = R(cur.units, 4);
      cur.pl_eur = cost ? R(value - cost, 2) : null;
      cur.pl_pct = cost ? R((value / cost - 1) * 100, 2) : null;
      cur.accounts.sort();
      list.push(cur);
    }
    list.sort((a, b) => b.value_eur - a.value_eur);
    return list;
  }

  // overview.py:98-125. Measured over the part of the book that HAS a day
  // move, against what that same part closed at - never against the whole
  // book, which would understate every day by however much is unpriced.
  function dayMove(rows) {
    const priced = rows.filter((r) => r.day_pct != null);
    const quiet = rows.filter((r) => r.day_pct == null);
    const value = priced.reduce((a, r) => a + r.value_eur, 0);
    // value / (1 + d), NOT value * (1 - d). The two agree on a quiet day and
    // drift on exactly the days you would want the number to be right.
    const opened = priced.filter((r) => r.day_pct !== -100)
      .reduce((a, r) => a + r.value_eur / (1 + r.day_pct / 100), 0);
    const moved = value - opened;
    const quietValue = quiet.reduce((a, r) => a + r.value_eur, 0);
    return {
      value_eur: R(moved, 2),
      pct: opened ? R(moved / opened * 100, 2) : null,
      n_priced: priced.length,
      n_quiet: quiet.length,
      quiet_eur: R(quietValue, 2),
      covered_pct: (value || quiet.length)
        ? R(value / (value + quietValue) * 100, 1) : 0,
    };
  }

  // overview.py:128-160. Area is weight and nothing else is implied, so the
  // whole map is relaid on every tick - a tile whose label says 8.2% while its
  // area is last hour's 8.0% is a picture that lies quietly.
  function allocation(rows, total) {
    total = total == null ? rows.reduce((a, r) => a + r.value_eur, 0) : total;
    const byKey = new Map(rows.map((r) => [r.key, r]));
    const tiles = squarify(rows.map((r) => [r.key, r.value_eur])).map((rect) => {
      const row = byKey.get(rect.key);
      return Object.assign({}, rect, {
        sym: row.sym, ticker: row.ticker, name: row.name,
        klass: row.klass, bucket: row.bucket, value_eur: row.value_eur,
        weight_pct: total ? R(row.value_eur / total * 100, 2) : 0,
        pl_pct: row.pl_pct, pl_eur: row.pl_eur, day_pct: row.day_pct,
      });
    });
    const drawn = tiles.reduce((a, t) => a + t.value_eur, 0);
    return {tiles, n: tiles.length, value_eur: R(drawn, 2),
            n_undrawn: rows.length - tiles.length,
            undrawn_eur: R(total - drawn, 2)};
  }

  // overview.py:163-182. Percent is the right unit here; euros is the right
  // unit in contributors. Giving both the same answer is how a dashboard ends
  // up saying nothing twice.
  function movers(rows, limit) {
    limit = limit || 5;
    const priced = rows.filter((r) => r.day_pct != null)
                       .sort((a, b) => b.day_pct - a.day_pct);
    const trim = priced.map((r) => ({
      sym: r.sym, ticker: r.ticker, name: r.name, day_pct: r.day_pct,
      value_eur: r.value_eur,
      day_eur: r.day_pct !== -100
        ? R(r.value_eur - r.value_eur / (1 + r.day_pct / 100), 2) : null}));
    return {
      up: trim.filter((r) => r.day_pct > 0).slice(0, limit),
      down: trim.slice().reverse().filter((r) => r.day_pct < 0).slice(0, limit),
      n_priced: priced.length,
      n_quiet: rows.filter((r) => r.day_pct == null).length};
  }

  // overview.py:185-211. Shares are taken against total ABSOLUTE movement, so
  // a winner and a loser of the same size both read as meaningful rather than
  // cancelling into a denominator of nearly zero.
  function contributors(rows, limit) {
    limit = limit || 6;
    const known = rows.filter((r) => r.pl_eur != null);
    const gross = known.reduce((a, r) => a + Math.abs(r.pl_eur), 0);
    const trim = known.slice().sort((a, b) => b.pl_eur - a.pl_eur).map((r) => ({
      sym: r.sym, ticker: r.ticker, name: r.name, pl_eur: r.pl_eur,
      pl_pct: r.pl_pct, value_eur: r.value_eur,
      share_pct: gross ? R(Math.abs(r.pl_eur) / gross * 100, 1) : 0}));
    return {
      best: trim.filter((r) => r.pl_eur > 0).slice(0, limit),
      worst: trim.slice().reverse().filter((r) => r.pl_eur < 0).slice(0, limit),
      n_known: known.length, n_unknown: rows.length - known.length};
  }

  /* ---- exposure.py: the part that needs only position values ---- */

  // exposure.py:94-116. Merged by ISIN, NOT by account: carrying the split
  // through would double every name held in both and make the look-through
  // wrong in a way that looks like concentration.
  function positions(rows, meta) {
    const merged = new Map();
    for (const h of rows) {
      const isin = h.isin;
      if (!merged.has(isin)) {
        const sym = h.yahoo;
        merged.set(isin, {isin, symbol: (sym && sym !== 'MISSING') ? sym : null,
                          name: h.name || '',
                          klass: (meta && meta.klass.get(isin)) || 'stock',
                          value_eur: 0});
      }
      merged.get(isin).value_eur += h.value_eur || 0;
    }
    return [...merged.values()].sort((a, b) => b.value_eur - a.value_eur);
  }

  // exposure.py:412-439. Measured on positions, deliberately NOT on the
  // look-through: only part of each fund is disclosed, and unplaced mass would
  // read as diversification. A falsy value is DROPPED, not counted as a
  // position worth nothing - which changes n and hhi, not just the sum.
  function concentration(pos, total) {
    const values = pos.map((p) => p.value_eur).filter((v) => v)
                      .sort((a, b) => b - a);
    if (!values.length || !total) {
      return {n: 0, top1_pct: 0, top5_pct: 0, top10_pct: 0, hhi: 0, effective_n: 0};
    }
    const weights = values.map((v) => v / total);
    const sum = (arr) => arr.reduce((a, b) => a + b, 0);
    const hhi = sum(weights.map((w) => w * w));
    return {
      n: values.length,
      top1_pct: R(sum(weights.slice(0, 1)) * 100, 1),
      top5_pct: R(sum(weights.slice(0, 5)) * 100, 1),
      top10_pct: R(sum(weights.slice(0, 10)) * 100, 1),
      hhi: R(hhi, 4),
      // From the UNROUNDED hhi, as in the original.
      effective_n: hhi ? R(1 / hhi, 1) : 0,
    };
  }

  // exposure.py:444-480. A fund whose TER is not published is not treated as
  // free: its value counts against coverage, so the euro figure reads as a
  // floor rather than a total.
  function fees(pos, terBySymbol, total) {
    let annual = 0, covered = 0, fundValue = 0;
    const rows = [];
    for (const p of pos) {
      if (p.klass !== 'fund' || !p.value_eur) continue;
      const value = p.value_eur;
      fundValue += value;
      const ter = terBySymbol.has(p.symbol) ? terBySymbol.get(p.symbol) : null;
      const cost = ter != null ? value * ter / 100 : null;
      if (cost != null) { annual += cost; covered += value; }
      rows.push({symbol: p.symbol, name: p.name, value_eur: R(value, 2),
                 ter_pct: ter, annual_eur: cost != null ? R(cost, 2) : null});
    }
    rows.sort((a, b) => (b.annual_eur || 0) - (a.annual_eur || 0));
    return {rows, annual_eur: R(annual, 2), fund_value_eur: R(fundValue, 2),
            covered_eur: R(covered, 2),
            unresolved_eur: R(fundValue - covered, 2),
            resolved_pct: fundValue ? R(covered / fundValue * 100, 1) : 0,
            // Two denominators, two different questions: what the funds cost
            // as funds, and what they cost as a share of everything.
            sleeve_ter_pct: covered ? R(annual / covered * 100, 3) : null,
            book_ter_pct: total ? R(annual / total * 100, 3) : null};
  }

  // exposure.py:529-547.
  function funds(pos, total, metaBySymbol) {
    const out = [];
    for (const p of pos) {
      if (p.klass !== 'fund') continue;
      const m = metaBySymbol.get(p.symbol) || {};
      out.push({symbol: p.symbol, name: p.name, value_eur: R(p.value_eur, 2),
                weight_pct: total ? R(p.value_eur / total * 100, 2) : 0,
                ter_pct: m.ter_pct == null ? null : m.ter_pct,
                n_disclosed: m.n_disclosed || 0,
                disclosed_pct: m.disclosed_pct == null ? null : m.disclosed_pct,
                has_sectors: !!m.has_sectors});
    }
    out.sort((a, b) => b.value_eur - a.value_eur);
    return out;
  }

  /* ---- exposure.py: the look-through, which needs the composition ---- */

  // Every breakdown below is a sum of position value times a published weight
  // that does not move with a price, so it restates exactly - PROVIDED the
  // weights are here. They arrive as D.lookthrough, written by
  // exposure.inputs(). Without it these are not called and the page keeps
  // saying "as at build"; see lookMark().

  const SECTOR_ALIASES = {realestate: 'real_estate', real_estate: 'real_estate'};
  const SUFFIX_COUNTRY = {
    AS: 'Netherlands', BR: 'Belgium', CO: 'Denmark', DE: 'Germany',
    F: 'Germany', HE: 'Finland', HK: 'Hong Kong', IR: 'Ireland',
    KQ: 'South Korea', KS: 'South Korea', L: 'United Kingdom', LS: 'Portugal',
    MC: 'Spain', MI: 'Italy', NS: 'India', OL: 'Norway', PA: 'France',
    SI: 'Singapore', ST: 'Sweden', SW: 'Switzerland', T: 'Japan',
    TA: 'Israel', TO: 'Canada', TW: 'Taiwan', VI: 'Austria', WA: 'Poland',
  };

  // exposure.py:56-58. str.capitalize() lowercases the tail; so does this.
  const label = (key) => String(key).split('_')
    .map((p) => p ? p[0].toUpperCase() + p.slice(1).toLowerCase() : '').join(' ');

  // exposure.py:61-66.
  function sectorKey(name) {
    if (!name) return null;
    const key = String(name).trim().toLowerCase().replace(/ /g, '_').replace(/-/g, '_');
    return (Object.prototype.hasOwnProperty.call(SECTOR_ALIASES, key)
      ? SECTOR_ALIASES[key] : key) || null;
  }

  // exposure.py:69-83. A bare ticker is a US listing by Yahoo's convention; a
  // bare numeric code is not, and resolves to null rather than to America.
  function countryFor(symbol) {
    if (!symbol) return null;
    const text = String(symbol).trim();
    if (text.includes('.')) {
      const sfx = text.slice(text.lastIndexOf('.') + 1).toUpperCase();
      return Object.prototype.hasOwnProperty.call(SUFFIX_COUNTRY, sfx)
        ? SUFFIX_COUNTRY[sfx] : null;
    }
    return /^\p{L}+$/u.test(text.replace(/-/g, '')) ? 'United States' : null;
  }

  // exposure.py:119-136. Rows keep the buckets' insertion order and then sort
  // stably on the ROUNDED value, which is what Python sorts on too.
  function breakdown(buckets, unresolved, total, extra) {
    const rows = [];
    let placed = 0;
    for (const [key, value] of buckets) {
      rows.push({key, label: label(key), value_eur: R(value, 2),
                 pct: total ? R(value / total * 100, 2) : 0});
      placed += value;
    }
    rows.sort((a, b) => b.value_eur - a.value_eur);
    return Object.assign({rows, value_eur: R(placed, 2),
                          unresolved_eur: R(unresolved, 2),
                          resolved_pct: total ? R(placed / total * 100, 1) : 0,
                          n: rows.length}, extra || {});
  }

  const add = (m, k, v) => m.set(k, (m.get(k) || 0) + v);

  // exposure.py:141-180. Fund cash is left unresolved, never scaled away.
  function sectors(pos, LT, total) {
    const buckets = new Map(), direct = new Map(), indirect = new Map();
    let unresolved = 0;
    for (const p of pos) {
      const value = p.value_eur;
      if (!value) continue;
      if (p.klass === 'fund') {
        const weights = (LT.funds[p.symbol] || {}).sectors || {};
        let placed = 0;
        for (const [raw, pct] of Object.entries(weights)) {
          const key = sectorKey(raw);
          if (!key || !pct) continue;
          const part = value * pct / 100;
          add(buckets, key, part); add(indirect, key, part);
          placed += part;
        }
        unresolved += Math.max(0, value - placed);
      } else {
        const key = sectorKey((LT.stocks[p.symbol] || {}).sector);
        if (key) { add(buckets, key, value); add(direct, key, value); }
        else unresolved += value;
      }
    }
