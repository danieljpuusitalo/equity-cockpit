      <td>${fresh(p.freshness)}${px(p.price)}</td>
      <td class="${cls(p.day_pct)}">${pct(p.day_pct,1)}</td>
      <td>${eur(p.value_eur)}</td><td>${eur(p.cost_eur)}</td>
      <td class="${cls(p.pl_eur)}">${eur(p.pl_eur)}</td>
      <td class="${cls(p.pl_pct)}">${pct(p.pl_pct,1)}</td>
      <td>${p.weight.toFixed(1)}%</td><td>${pct(p.off_high,1)}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  const wr = sortRows((D.watchlist||[]).filter(hits), 'log', 'upside_now');
  const w = `<h2 data-sec="log" data-label="Equity Log">Equity Log — ${some(wr.length,
      (D.watchlist||[]).length, 'rows')}, ${(D.sources||{}).equity_log_mode}</h2>
    <div class="sec" data-sec="log">
    <div class="scroll"><table><thead><tr>
    ${th('log','ticker','Ticker',1)}${th('log','verdict','Verdict',1)}
    ${th('log','tier','Tier',1)}${th('log','price_now','Price')}
    ${th('log','target','Target')}${th('log','upside_now','Upside now')}
    ${th('log','upside_at_eval','At eval')}${th('log','upside_decay_pts','Decay pts')}
    <th class="t">Trigger</th>${th('log','trigger_gap_pct','Gap')}
    ${th('log','last_eval','Evaluated',1)}${th('log','next_check','Next',1)}
    </tr></thead><tbody>${wr.map((x)=>`<tr
      class="${ROWSYM.has(x.yahoo || x.ticker) ? 'click' : ''}"
      data-sym="${esc(x.yahoo || x.ticker)}">
      <td>${esc(x.ticker)}</td><td>${esc(x.verdict)}</td><td>${esc(x.tier)}</td>
      <td>${fresh(freshnessOf(x.price_now, x.stale_price,
        x.yahoo || x.ticker))}${px(x.price_now)}</td><td>${px(x.target)}</td>
      <td class="${cls(x.upside_now)}">${pct(x.upside_now,1)}</td>
      <td>${pct(x.upside_at_eval,1)}</td>
      <td>${x.upside_decay_pts == null ? '—' : x.upside_decay_pts.toFixed(1)}</td>
      <td class="t">${x.trigger_level ? esc(x.trigger_kind)+' '+px(x.trigger_level) : '—'}</td>
      <td>${pct(x.trigger_gap_pct,1)}</td><td>${esc(x.last_eval)}</td>
      <td>${esc(x.next_check)}</td></tr>`).join('')}</tbody></table></div></div>`;

  // Ordered by money at risk, not alphabetically: the question the table
  // answers is "how much of the book is nobody watching", and the answer is
  // read off the top rows.
  const cr = sortRows((COV.rows || []).filter(hits), 'cov', 'value_eur');
  const cov = !(COV.rows || []).length ? '' :
   `<h2 data-sec="cov" data-label="Monitoring">Coverage —
    ${(COV.rows||[]).length - (COV.n_uncovered||0)}/${(COV.rows||[]).length} monitored,
    ${eur(COV.value_uncovered_eur)} (${(COV.pct_uncovered||0).toFixed(0)}%) unwatched</h2>
    <div class="sec" data-sec="cov">
    <div class="scroll"><table><thead><tr>
    ${th('cov','ticker','Ticker',1)}${th('cov','covered','Monitored',1)}
    ${th('cov','gap','Gap',1)}${th('cov','value_eur','Value €')}
    ${th('cov','weight_pct','Weight')}${th('cov','klass','Class',1)}
    <th class="t">Judged by</th>${th('cov','target_weight_pct','Target wt')}
    ${th('cov','drift_pts','Drift pts')}<th class="t">Acct</th>
    ${th('cov','name','Name',1)}</tr></thead><tbody>${cr.map((c) => `<tr
      class="${ROWSYM.has(c.yahoo || c.ticker) ? 'click' : ''}"
      data-sym="${esc(c.yahoo || c.ticker)}">
      <td>${esc(c.ticker)}</td><td>${c.covered ? 'yes' : '<b>no</b>'}</td>
      <td>${esc(c.gap || '')}</td>
      <td>${eur(c.value_eur)}</td><td>${num(c.weight_pct,1)}%</td>
      <td>${esc(c.klass)}</td>
      <td class="t">${c.klass === 'stock' ? 'thesis' : 'allocation'}</td>
      <td>${c.target_weight_pct == null ? '—' : num(c.target_weight_pct,1) + '%'
        + (c.target_basis === 'placeholder' ? ' <span class="est"'
          + ' title="Placeholder, not a policy">P</span>' : '')}</td>
      <td>${c.drift_pts == null ? '—' : num(c.drift_pts,1)}</td>
      <td class="t">${esc(c.account)}</td><td>${esc(c.name)}</td>
      </tr>`).join('')}</tbody></table></div>
    ${cr.some((c) => c.target_basis === 'placeholder') ? `<div class="prose under"><span class="est">P</span> — placeholder. Filled in
      by a rule (equal weight inside a core/satellite frame) so the allocation
      columns have something to draw. It is not a policy: the holding still
      counts as uncovered and its drift is never alerted on.</div>` : ''}
    ${(COV.researched_not_held||[]).length ? `<div class="prose under">Researched but not owned — ${(COV.researched_not_held||[])
      .map(esc).join(', ')}.</div>` : ''}</div>`;

  // The book seen through its wrappers. Two rules hold across everything
  // below. Bars are drawn against a full 100% track, so a row's width is its
  // share of the whole book and not its share of the largest row. And every
  // breakdown draws the mass it could not place as its own bar, because
  // Yahoo discloses ten constituents per fund - most of a thematic, almost
  // none of a world tracker - so coverage varies six-fold inside one
  // portfolio and a chart that hid that would be the most misleading thing
  // on this page. See exposure.py's header.
  const X = D.exposure || {};
  const XT = X.total_eur || 0;
  const share = (v) => XT ? (v / XT) * 100 : 0;
  const w100 = (v) => Math.max(0, Math.min(100, v || 0)).toFixed(3);
  // % or € on the same bars. Not decoration: a 0.30% real-estate sliver and a
  // €120 real-estate sliver are answers to different questions, and which one
  // you want changes with what you are about to do.
  const amt = (p, v) => SS.units === 'eur' ? eur(v) : num(p, 2) + '%';

  const xbar = (o) => `<div class="xrow ${o.un ? 'un' : ''}"
    ${o.kind ? `data-fk="${esc(o.kind)}" data-fv="${esc(o.key)}"
      data-fl="${esc(o.label)}"` : ''}
    data-on="${SS.filter && SS.filter.kind === o.kind
      && SS.filter.key === o.key ? 1 : 0}">
    <div class="n" title="${esc(o.label)}">${esc(o.label)}</div>
    <div class="t">${o.direct == null
      ? `<i class="f" style="width:${w100(o.pct)}%"></i>`
      : `<i class="f" style="width:${w100(o.direct)}%"></i>` +
        `<i class="f2" style="width:${w100(o.indirect)}%"></i>`}</div>
    <div class="p">${amt(o.pct, o.value)}</div></div>`;

  // One breakdown - sector, geography or industry - as a ranked stack. Rows
  // are click targets: picking one filters every table below to the names it
  // contains, which is the whole point of having both on one surface. The
  // unresolved bar is appended whenever there is anything to append and is
  // deliberately NOT clickable - it is the answer to "and the rest", not a
  // bucket you can look inside.
  // `note` is escaped and `mark` is not, deliberately: the note can carry a
  // vendor-supplied string (geography's basis line comes from the data), while
  // mark is only ever this file's own atBuild() markup.
  const xstack = (t, title, kind, note, mark) => {
    if (!t || !(t.rows || []).length) return '';
    const un = share(t.unresolved_eur || 0);
    return `<div><div class="tlabel run">${esc(title)} —
      ${num(t.resolved_pct, 1)}% placed</div>
      ${t.rows.map((r) => xbar({label: r.label, key: r.key, kind: kind,
        pct: r.pct, value: r.value_eur,
        direct: r.direct_eur == null ? null : share(r.direct_eur),
        indirect: r.indirect_eur == null ? null : share(r.indirect_eur)})).join('')}
      ${un > 0.005 ? xbar({label: 'Not resolved', pct: un,
        value: t.unresolved_eur, un: true}) : ''}
      <div class="xkey">${esc(note)}${mark || ''}</div></div>`;
  };

  const XC = X.concentration || {}, XM = X.multiples || {},
        XF = X.fees || {}, XN = X.names || {}, XO = X.overlap || {};
  const xcard = (k, v, s) => `<div class="xcard"><div class="k">${esc(k)}</div>
    <div class="v">${v}</div><div class="s">${s}</div></div>`;

  // Both tables below read the one live filter and the one search box, so a
  // click on a sector bar and a typed ticker compose instead of competing.
  const F = SS.filter;
  const inFilter = (r) => {
    if (!F) return true;
    if (F.kind === 'fund') return (r.via || []).some((v) => v.fund === F.key);
    return r[F.kind] === F.key;
  };
  // How many rows the filter could not judge either way, kept separate from
  // how many it excluded. A name Yahoo gave only a ticker for has no sector,
  // and counting it as "not Technology" would be an answer the data cannot
  // support. It is reported as unclassified and left out.
  const blind = !F || F.kind === 'fund' ? 0
    : (XN.rows || []).filter((r) => r[F.kind] == null).length;

  const nameRows = sortRows((XN.rows || []).filter((r) => inFilter(r) && hits(r)),
                            'names', 'pct');
  const fundRows = sortRows((X.funds || []).filter((f) => hits(f)
    && (!F || F.kind !== 'fund' || f.symbol === F.key)), 'funds', 'value_eur');

  const exp = !XT ? '' :
   `<h2 data-sec="exp" data-label="Concentration">Exposure — ${eur(XT)} across
    ${X.n_positions} positions, looked through</h2>
    <div class="sec" data-sec="exp">
    <div class="xgrid">
      ${xcard('Effective positions', num(XC.effective_n, 1),
        `of ${XC.n} held · top 5 ${num(XC.top5_pct,1)}% ·
         top 10 ${num(XC.top10_pct,1)}% · HHI ${num(XC.hhi,4)}`)}
      ${xcard('Blended P/E', num(XM.pe, 1),
        `P/B ${num(XM.pb,1)} · P/S ${num(XM.ps,2)} ·
         ${num(XM.pe_resolved_pct,1)}% of the book priced · harmonic, not averaged`
        + atBuild('each multiple is the vendor’s own figure at the '
          + 'vendor’s own asof; one holding quotes in pence, so a naive '
          + 'price-over-earnings rescale would be out by a factor of a hundred'))}
      ${xcard('Fund fee drag', eur(XF.annual_eur) + '/yr',
        `${num(XF.sleeve_ter_pct,3)}% of the fund sleeve ·
         ${num(XF.book_ter_pct,3)}% of the book ·
         ${num(XF.resolved_pct,0)}% of fund value has a published TER`)}
      ${xcard('Names reached', XN.n || 0,
        `${num(XN.resolved_pct,1)}% of the book named ·
         ${XN.n_both_ways || 0} held directly and inside a fund ·
         the rest is inside undisclosed fund tails`
        + lookMark())}
      ${xcard('Funds drawing on one pot',
        (XO.n_substantial || 0) + ' of ' + (XO.n_pairs || 0),
        ((XO.pairs || [])[0]
          ? 'pairs substantially the same holding · biggest by euro is ' +
            esc(XO.pairs[0].a) + ' × ' + esc(XO.pairs[0].b) + ' on ' +
            XO.pairs[0].n_shared + ' names, ' + num(XO.pairs[0].pct, 1) +
            '% of the book'
          : 'no two funds disclose a name in common') +
        ' · <a href="#/data/lap">see every pair</a>')}
    </div>
    <div class="xcols">
      ${xstack(X.sectors, 'Sector', 'sector',
        'Solid is held directly, pale is reached through a fund. Fund cash is ' +
        'left unresolved rather than scaled away. Click a row to filter below.',
        lookMark())}
      ${xstack(X.geography, 'Geography', 'country',
        (X.geography || {}).basis || '', lookMark())}
    </div>
    ${xstack(X.industries, 'Industry', 'industry',
      'Directly-held stocks only. A fund reports sectors and never industries, ' +
      'so the fund sleeve is unresolved here by construction, not by failure.',
      lookMark())}
    </div>
    <h2 data-sec="look" data-label="Inside the funds">Look-through — ${nameRows.length}${
      nameRows.length === (XN.rows || []).length ? '' :
      ' of ' + (XN.rows || []).length} companies the book touches</h2>
    <div class="sec" data-sec="look">
    ${!nameRows.length ? '<div class="empty">No company matches that filter.</div>'
    : `<div class="scroll"><table><thead><tr>
    ${th('names','symbol','Symbol',1)}${th('names','name','Company',1)}
    ${th('names','pct','Total')}${th('names','direct_pct','Direct')}
    ${th('names','indirect_pct','Via funds')}${th('names','value_eur','Value €')}
    <th class="t">Reached through</th></tr></thead><tbody>${nameRows.map((r) => `<tr
      class="${ROWSYM.has(r.symbol) ? 'click' : ''}" data-sym="${esc(r.symbol)}">
      <td>${esc(r.symbol)}</td><td>${esc(r.name)}</td>
      <td><b>${amt(r.pct, r.value_eur)}</b></td>
      <td>${r.direct_pct ? num(r.direct_pct,2)+'%' : '—'}</td>
      <td>${r.indirect_pct ? num(r.indirect_pct,2)+'%' : '—'}</td>
      <td>${eur(r.value_eur)}</td>
      <td class="t" style="color:var(--muted)">${r.held_both_ways
        ? 'held outright + ' : ''}${(r.via || []).map((v) =>
        esc(v.fund)+' '+num(v.pct,1)+'%').join(', ') || 'held outright'}</td>
      </tr>`).join('')}</tbody></table></div>`}
    <div class="prose under">A name absent from this table is
      not absent from the book — it is absent from a fund's disclosed top ten.
      The indirect column is a floor.${blind ? ` ${blind} of these companies
      have no ${esc(F.kind === 'country' ? 'domicile' : F.kind)} on record and
      are excluded from this filter rather than assumed out of it.` : ''}
      ${nameRows.some((r) => ROWSYM.has(r.symbol))
        ? ' Rows with a chart of their own open it.' : ''}</div>
    </div>
    <h2 data-sec="funds" data-label="Funds">Funds — what each one tells you</h2>
    <div class="sec" data-sec="funds">
    <div class="scroll"><table><thead><tr>
    ${th('funds','symbol','Symbol',1)}${th('funds','name','Name',1)}
    ${th('funds','weight_pct','Weight')}${th('funds','value_eur','Value €')}
    ${th('funds','ter_pct','TER')}<th>Cost €/yr</th>
    ${th('funds','disclosed_pct','Discloses')}${th('funds','n_disclosed','Rows')}
    <th class="t">Sectors</th></tr></thead><tbody>${
      fundRows.map((f) => { const fee = ((XF.rows || [])
        .find((r) => r.symbol === f.symbol) || {});
      return `<tr class="click" data-fund="${esc(f.symbol || '')}"
      data-on="${F && F.kind === 'fund' && F.key === f.symbol ? 1 : 0}">
      <td>${esc(f.symbol || '—')}</td><td class="t">${esc(f.name)}</td>
      <td>${num(f.weight_pct,2)}%</td><td>${eur(f.value_eur)}</td>
      <td>${f.ter_pct == null ? '<span style="color:var(--muted)">not published</span>'
        : num(f.ter_pct,2)+'%'}</td>
      <td>${fee.annual_eur == null ? '—' : eur(fee.annual_eur)}</td>
      <td>${num(f.disclosed_pct,1)}%</td><td>${f.n_disclosed}</td>
      <td class="t">${f.has_sectors ? 'yes' : '<b>no</b>'}</td></tr>`; }).join('')
    }</tbody></table></div>
    <div class="prose under">The spread down the Discloses
      column is why every figure above carries a coverage percentage. A fund
      with no published TER is not free — it is counted against coverage, so
      the fee figure reads as a floor. Click a fund to see only what it
      reaches.</div>
    </div>
    <h2 data-sec="lap" data-label="Fund overlap">Fund overlap — ${
      XO.n_substantial || 0} of ${XO.n_pairs || 0} pairs substantially
      the same holding</h2>
    <div class="sec" data-sec="lap">
    ${!(XO.pairs || []).length
      ? `<div class="empty">${XO.n_funds
          ? 'No two of the ' + XO.n_funds + ' funds disclose a name in common.'
          : 'No fund discloses its holdings, so no pair can be compared.'}</div>`
      : `<div class="scroll"><table><thead><tr>
    <th class="t">Pair</th><th>Shared</th><th>Of A</th><th>Of B</th>
    <th>Via both €</th><th>Of book</th>
    <th class="t">Names in common</th></tr></thead><tbody>${
      (XO.pairs || []).filter((p) => hits({symbol: p.a + ' ' + p.b,
        name: (p.shared || []).join(' ')})).map((p) => `<tr>
      <td class="t"><b>${esc(p.a)}</b> × <b>${esc(p.b)}</b></td>
      <td>${p.n_shared} of ${p.n_a}/${p.n_b}</td>
      <td>${num(p.a_disclosed_in_shared_pct,1)}%</td>
      <td>${num(p.b_disclosed_in_shared_pct,1)}%</td>
      <td>${eur(p.value_eur)}</td>
      <td><b>${num(p.pct,2)}%</b></td>
      <td class="t" style="color:var(--muted)">${
        (p.shared || []).map(esc).join(', ')}</td></tr>`).join('')
    }</tbody></table></div>`}
    <div class="prose under">Two funds holding the same company is not a
      mistake, but owning it twice at a weight you never chose is. Of A and Of B
      are how much of each fund's <i>disclosed</i> value sits in the shared
      names — a pair reading high on both is two routes to one bet. The euro
      figure is the money reaching those shared names through the two funds
      added together: each fund's own value times its disclosed weight in each
      shared name. It is counted once per fund, so it is what the bet is worth,
      not a double count — but do not add the pairs up, because a name held by
      three funds is in three of these rows. Every column is a floor: it can
      only see names both funds publish, and a fund publishes its top ten.${
      lookMark()}</div>
    </div>`;

  /* ----------------------------------------------------------- reporting */
  // What is coming and what landed. Grouped by month rather than by a
  // days-until bucket: a bucket boundary moves under you overnight, a month
  // does not, and the horizon is a quarter wide because a four-week one was
  // measured empty for six weeks of every quarter.
  const R = D.reporting || {}, RC = R.calendar || {};
  const months = [];
  for (const row of RC.rows || []) {
    const key = row.date.slice(0, 7);
    let bucket = months.find((m) => m.key === key);
    if (!bucket) months.push(bucket = {key, rows: []});
    bucket.rows.push(row);
  }
  const monthName = (key) => {
    const d = new Date(key + '-01T00:00:00');
    return isNaN(d) ? key : d.toLocaleDateString('en-GB',
      {month: 'short', year: 'numeric'});
  };
  const dayName = (iso) => {
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('en-GB',
      {day: 'numeric', month: 'short'});
  };
  const landed = sortRows((R.latest || []).filter(hits), 'latest', 'date');

  const rep = !(RC.rows || []).length && !(R.latest || []).length ? '' :
   `<h2 data-sec="rep" data-label="Earnings">Reporting — ${RC.n || 0} prints in the next
    ${RC.horizon_days} days, ${num(RC.pct_ahead,0)}% of the book</h2>
    <div class="sec" data-sec="rep">
    ${!months.length ? `<div class="empty">Nothing scheduled inside
      ${RC.horizon_days} days.</div>` : `<div class="cal">${months.map((m) => `
      <div class="calwk">${esc(monthName(m.key))}</div>
      <div class="calbox ${m.rows.some((r) => r.soon) ? 'soon' : ''}">
        ${m.rows.map((r) => `<div class="calrow" data-sym="${esc(r.symbol)}">
          <span class="d">${esc(dayName(r.date))}</span>
          <span class="sym">${esc(r.symbol)}</span>
          <span class="co">${esc(r.name)}${r.estimated
            ? ' <span class="est">est. date</span>' : ''}</span>
          <span class="wt">${r.eps_estimate == null ? ''
            : 'cons. ' + num(r.eps_estimate, 2) + ' · '}${num(r.weight_pct,1)}%
            of book</span></div>`).join('')}
      </div>`).join('')}</div>`}
    ${(RC.unknown || []).length ? `<div class="xkey under">
      No scheduled date from Yahoo for ${(RC.unknown || []).map((u) =>
      esc(u.symbol)).join(', ')} — ${(RC.unknown || []).some((u) => u.has_history)
      ? 'the reporting history is there, the next date is not.'
      : 'nothing on record at all.'} Absence of a date is not absence of a
      quarter.</div>` : ''}
    <div class="tlabel run">Last reported</div>
    <div class="scroll"><table><thead><tr>
    ${th('latest','symbol','Symbol',1)}${th('latest','date','Reported')}
    ${th('latest','days_ago','Days ago',1)}${th('latest','eps_estimate','Expected')}
    ${th('latest','eps_reported','Actual')}${th('latest','surprise_pct','Surprise')}
    ${th('latest','record.median_surprise_pct','Record')}
    ${th('latest','growth.revenue_yoy_pct','Revenue YoY')}
    <th class="t">Quarter</th>${th('latest','weight_pct','Weight')}
    </tr></thead><tbody>${landed.map((r) => { const g = r.growth || {},
      rec = r.record || {};
      return `<tr class="${ROWSYM.has(r.symbol) ? 'click' : ''}"
      data-sym="${esc(r.symbol)}">
      <td>${esc(r.symbol)}</td><td>${esc(r.date)}</td>
      <td>${r.days_ago == null ? '—' : r.days_ago}</td>
      <td>${num(r.eps_estimate,2)}</td><td>${num(r.eps_reported,2)}</td>
      <td class="${r.surprise_pct == null ? '' : r.beat ? 'beat'
        : r.surprise_pct < 0 ? 'miss' : ''}">${pct(r.surprise_pct,1)}</td>
      <td>${rec.n ? `${rec.beats}B / ${rec.misses}M of ${rec.n}` : '—'}</td>
      <td class="${cls(g.revenue_yoy_pct)}">${pct(g.revenue_yoy_pct,1)}</td>
      <td class="t">${esc(g.period || '—')}</td><td>${num(r.weight_pct,1)}%</td>
      </tr>`; }).join('')}</tbody></table></div>
    <div class="prose under">Surprise is against analyst
      consensus, not against the thesis — a beat is a fact about expectations.
      Revenue is compared with the same quarter a year earlier, never with last
      quarter. A quarter that has not been reported is absent from this table
      rather than present at zero.</div>
    </div>`;

  // The board's figures beside today's, for every name that has either. Two
  // columns per multiple rather than one reconciled number: the gap IS the
  // reading, and a merged figure would be the one thing this cannot show.
  const fa = (D.watchlist||[]).filter((x) => x.live || x.pe != null || x.fwd_pe != null);
  const fw = sortRows(fa.filter(hits), 'mult', 'live.pe');
  const mult = !fa.length ? '' :
   `<h2 data-sec="mult" data-label="Multiples">Multiples — board vs today,
    ${fa.filter((x) => x.live).length} live</h2>
    <div class="sec" data-sec="mult">
    <div class="scroll"><table><thead><tr>${th('mult','ticker','Ticker',1)}
    ${th('mult','pe','P/E board')}${th('mult','live.pe','P/E now')}
    ${th('mult','pe_drift_pct','Drift')}
    ${th('mult','fwd_pe','Fwd board')}${th('mult','live.fwd_pe','Fwd now')}
    ${th('mult','fwd_pe_drift_pct','Drift')}
    ${th('mult','live.pb','P/B')}${th('mult','live.net_debt_ebitda','ND/EBITDA')}
    ${th('mult','live.roe_pct','ROE')}${th('mult','live.margin_pct','Margin')}
    ${th('mult','live.beta','Beta')}${th('mult','live.market_cap','Mkt cap')}
    <th>Street tgt</th>${th('mult','street_upside_pct','Street')}
    ${th('mult','upside_now','Yours')}${th('mult','live.street_analysts','Analysts')}
    ${th('mult','live.asof','As of')}</tr></thead><tbody>${fw.map((x) => {
      const L = x.live || {};
      return `<tr class="${ROWSYM.has(x.yahoo || x.ticker) ? 'click' : ''}"
      data-sym="${esc(x.yahoo || x.ticker)}"><td>${esc(x.ticker)}</td>
      <td>${num(x.pe,1)}</td><td>${num(L.pe,1)}</td>
      <td>${pct(x.pe_drift_pct,0)}</td>
      <td>${num(x.fwd_pe,1)}</td><td>${num(L.fwd_pe,1)}</td>
      <td>${pct(x.fwd_pe_drift_pct,0)}</td>
      <td>${num(L.pb,1)}</td><td>${num(L.net_debt_ebitda,2)}</td>
      <td>${L.roe_pct == null ? '—' : num(L.roe_pct,1)+'%'}</td>
      <td>${L.margin_pct == null ? '—' : num(L.margin_pct,1)+'%'}</td>
      <td>${num(L.beta,2)}</td><td>${big(L.market_cap)}</td>
      <td>${px(L.street_target)}</td>
      <td class="${cls(x.street_upside_pct)}">${pct(x.street_upside_pct,1)}</td>
      <td class="${cls(x.upside_now)}">${pct(x.upside_now,1)}</td>
      <td>${L.street_analysts == null ? '—' : num(L.street_analysts,0)}</td>
      <td>${esc(L.asof || '—')}</td></tr>`; }).join('')}</tbody></table></div></div>`;

  const ia = ROWS.filter((x) => x.ind);
  const ir = sortRows(ia.filter(hits), 'ind', 'ind.rsi');
  const ind = !ia.length ? '' :
   `<h2 data-sec="ind" data-label="Technicals">The chart, in numbers —
    ${some(ir.length, ia.length, 'symbols')}</h2>
    <div class="sec" data-sec="ind">
    <div class="scroll"><table><thead><tr>${th('ind','label','Ticker',1)}
    ${th('ind','ind.close','Close')}${th('ind','ind.rsi','RSI')}
    ${th('ind','ind.rsi_state','State',1)}${th('ind','ind.bb_pct_b','%B')}
    ${th('ind','ind.bb_width','Band w')}${th('ind','ind.macd_hist','MACD h')}
    ${th('ind','ind.sma50','MA50')}${th('ind','ind.sma200','MA200')}
    ${th('ind','ind.ma_spread_pct','Spread')}
    ${th('ind','ind.above_sma200_pct','vs MA200')}
    ${th('ind','ind.atr_pct','ATR %')}${th('ind','ind.vol_30d','Vol 30d')}
    ${th('ind','ind.max_drawdown_pct','Max DD')}
    ${th('ind','ind.range.pct','In range')}
    ${th('ind','ind.volume.relative','Vol ×avg')}${th('ind','ind.bars','Bars')}
    <th class="t">As of</th></tr></thead><tbody>${ir.map((x) => { const i = x.ind;
      return `<tr class="click" data-sym="${esc(x.sym)}">
      <td>${esc(x.label)}</td><td>${px(i.close)}</td>
      <td>${num(i.rsi,1)}</td><td>${esc(i.rsi_state || '')}</td>
      <td>${i.bb_pct_b == null ? '—' : num(i.bb_pct_b,2)}</td>
      <td>${i.bb_width == null ? '—' : num(i.bb_width*100,1)+'%'}</td>
      <td class="${cls(i.macd_hist)}">${num(i.macd_hist,2)}</td>
      <td>${px(i.sma50)}</td><td>${px(i.sma200)}</td>
      <td class="${cls(i.ma_spread_pct)}">${pct(i.ma_spread_pct,1)}</td>
      <td class="${cls(i.above_sma200_pct)}">${pct(i.above_sma200_pct,1)}</td>
      <td>${num(i.atr_pct,2)}</td><td>${num(i.vol_30d,1)}</td>
      <td class="dn-t">${pct(i.max_drawdown_pct,1)}</td>
      <td>${i.range ? num(i.range.pct,0) : '—'}</td>
      <td>${i.volume ? num(i.volume.relative,2) : '—'}</td>
      <td>${i.bars}</td><td class="t">${esc(i.asof)}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="prose under">Computed in Python off the cached daily bars, up
      to each row's own <i>As of</i>. The chart's last candle tracks the live
      price and these do not, so on a fast day the two will differ by one
      partial session — that is the gap between a recorded figure and a moving
      one, not an error in either. Descriptive only — no row here is a
      signal.</div>
    </div>`;

  const al = (D.alerts||[]).filter((x) => !q ||
    (x.title + ' ' + x.detail).toLowerCase().includes(q));
  // Sales. The Nordnet export lists holdings and never transactions, so every
  // row here is the difference between two exports and nothing else.
  //
  // This section renders even when it has no rows, and that is the point of
  // it. "Nothing was sold" and "the question could not be asked" are different
  // answers, only one of them is good news, and a section that vanished on the
  // second would be read as the first - which is precisely the derived status
  // claiming more than it means that this repo keeps finding. So the prose
  // below always says which of the two it is.
  //
  // The euro column is ACHROMATIC on purpose, same argument as the multiple
  // drift above: a sale is not a bad thing and a purchase is not a good one.
  // Colouring them would have the page take a view that belongs to the thesis.
  const AC = D.activity || {};
  const acr = AC.changes || [];
  const KIND = {exited: 'sold out', reduced: 'sold down', opened: 'opened',
                increased: 'added to', adjusted: 'adjusted (not a trade)'};
  const acWhy = AC.comparable
    ? `Compared the ${esc(AC.from_exported)} export against
       ${esc(AC.to_exported)}.`
    : acr.length
      ? `Carried from the last comparison that was possible
         (${esc(AC.from_exported)} → ${esc(AC.to_exported)}). This run could not
         look again: ${esc(AC.reason)}.`
      : `<b>No comparison was possible</b>, so this is not a report that nothing
         was sold — it is the absence of a report. ${esc(AC.reason)}.`;
  const act = `<h2 data-sec="act" data-label="Changes">Activity — ${acr.length
      ? `${acr.length} change${acr.length === 1 ? '' : 's'} since the
         ${esc(AC.from_exported)} export`
      : (AC.comparable ? 'no change since the last export'
                       : 'cannot tell')}</h2>
    <div class="sec" data-sec="act">
    ${!acr.length ? '' : `<div class="scroll"><table><thead><tr>
      <th class="t">Ticker</th><th class="t">What</th><th>Units before</th>
      <th>Units after</th><th>Cost €</th><th class="t">Lots closed outright</th>
      <th class="t">Acct</th><th class="t">Name</th>
      </tr></thead><tbody>${acr.map((c) => `<tr
        class="${ROWSYM.has(c.yahoo || c.ticker) ? 'click' : ''}"
        data-sym="${esc(c.yahoo || c.ticker)}">
        <td class="t">${esc(c.ticker)}</td>
        <td class="t">${esc(KIND[c.kind] || c.kind)}${c.why
          ? ` <span class="est" title="${esc(c.why)}">?</span>` : ''}</td>
        <td>${num(c.units_before, 4)}</td><td>${num(c.units_after, 4)}</td>
        <td>${eur(c.cost_delta)}</td>
        <td class="t">${(c.lots_closed || []).map((l) => esc(l.bought))
          .join(', ') || '—'}</td>
        <td class="t">${esc(c.account)}</td><td class="t">${esc(c.name)}</td>
        </tr>`).join('')}</tbody></table></div>`}
    <div class="prose under">${acWhy} The export is a list of
    what you hold, never a list of what you traded, so a sale exists here only
    as the difference between two of those lists — and until a newer export
    lands there is nothing further to see.</div></div>`;

  const a = `<h2 data-sec="flag" data-label="Needs a look">Flags — ${some(al.length,
      (D.alerts||[]).length, 'open')}</h2>
    <div class="sec" data-sec="flag">
    <div class="scroll"><table><thead><tr><th>Level</th><th class="t">What</th><th class="t">Why</th>
    </tr></thead><tbody>${al.map((x) => `<tr>
      <td>${esc(x.level)}</td><td class="t">${esc(x.title)}</td>
      <td class="wrap t">${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>
    </div>`;

  const s = D.sources || {};
  const src = `<h2 data-sec="prov" data-label="Sources">Provenance</h2>
    <div class="sec" data-sec="prov"><div class="scroll"><table><tbody>
    <tr><td>Generated</td><td>${esc(D.generated)}</td></tr>
    <tr><td>Run</td><td>${s.run_mode === 'refresh'
      ? `intraday refresh · prices and FX re-fetched, everything else served from
         the last full run at ${esc(s.last_full_run || 'unknown')}`
      : 'full · every source read'}</td></tr>
    <tr><td>Nordnet export</td><td>${esc(s.nordnet_export_date)} ·
      ${s.nordnet_export_age_days} days old · ${esc((s.nordnet_files||[]).join(', '))}</td></tr>
    <tr><td>Equity Log</td><td>${esc(s.equity_log_mode)} ·
      ${s.equity_log_age_days} days old</td></tr>
    <tr><td>Price history</td><td>${s.history_symbols} symbols cached ·
      ${s.history_problems} without a fresh series${LIVEBAR.size
        ? ` · the chart's last candle is carried forward to the live price on
            ${LIVEBAR.size} of them; the cached bars themselves are never
            written over`
        : ''}</td></tr>
    <tr><td>Fundamentals</td><td>${s.fundamentals_asked == null ? 'not fetched'
      : `${s.fundamentals_priced}/${s.fundamentals_asked} symbols carry multiples ·
         ${s.fundamentals_problems} problem${s.fundamentals_problems === 1 ? '' : 's'}`
      }</td></tr>
    <tr><td>Indicators</td><td>${Object.keys(D.indicators || {}).length} symbols ·
      derived from the cached bars, no separate fetch</td></tr>
    <tr><td>Fund composition</td><td>${s.composition_asked == null ? 'not fetched'
      : `${s.composition_resolved}/${s.composition_asked} funds broken out ·
         ${s.composition_problems} problem${s.composition_problems === 1 ? '' : 's'} ·
         ten constituents per fund is Yahoo's limit, not a setting`}</td></tr>
    <tr><td>Reporting</td><td>${s.earnings_asked == null ? 'not fetched'
      : `${s.earnings_resolved}/${s.earnings_asked} stocks carry a reporting
         record · ${s.earnings_problems}
         problem${s.earnings_problems === 1 ? '' : 's'} ·
         ${(R.calendar||{}).n_unknown || 0} with no scheduled next date ·
         funds are not asked, Yahoo answers them with a 404`}</td></tr>
    </tbody></table></div></div>`;

  // Order is the argument this page makes about what matters. It used to run
  // Holdings, Equity Log, Coverage, Activity, ... with Flags eleventh of twelve
  // and Provenance above it - so the one section that answers "what should I
  // look at today" sat below the list of where the data came from. It now runs
  // in the order the questions get asked: what needs a decision, what changed,
  // what I own, what is unwatched, how concentrated, what is coming, then the
  // reference tables, then the receipts. `exp` carries look and funds inside
  // it, so those three cannot be separated without splitting that string.
  $('#sheetbody').innerHTML = a + act + h + cov + exp + rep + mult + ind + w + src;
  alignColumns($('#sheetbody'));

  // Collapse state is re-applied after the repaint rather than survived
  // through it. Every table above is rebuilt from the payload on every
  // interaction, which is the point - none of it can be a stale render of an
  // older answer - so the only things that persist are in SS.
  for (const node of $('#sheetbody').querySelectorAll('[data-sec]'))
    node.setAttribute('data-shut', SS.shut[node.getAttribute('data-sec')] ? '1' : '0');

  // The nav is built from the sections that actually rendered, not from a list
  // kept alongside them. A hand-maintained list would keep offering a jump to
  // Reporting on a run where Yahoo returned nothing and the section is absent.
  // The label is authored on the heading, not scraped off it. It used to be
  // `textContent.split('—')[0]`, which made the nav a side effect of prose:
  // rewriting a heading silently renamed a button, and one heading that is a
  // full sentence - "The chart, in numbers" - produced a full-sentence button
  // sitting beside one-word ones. The fallback keeps a new section navigable
  // if someone adds an h2 and forgets the label.
  const heads = [...$('#sheetbody').querySelectorAll('h2[data-sec]')];
  $('#sheetnav').innerHTML = heads.map((n) => `<button class="navb"
      data-go="${esc(n.getAttribute('data-sec'))}"
      >${esc(n.getAttribute('data-label')
              || n.textContent.split('—')[0].trim())}</button>`).join('')
    + (SS.filter ? `<span class="xchip">${esc(SS.filter.kindLabel)}
        <b>${esc(SS.filter.label)}</b>
        <button id="xclear" title="Clear filter">×</button></span>` : '');
}

/* -------------------------------------------------------------- overview */
/* The altitude above the rail. Every number here arrived computed - the
   treemap rectangles included - because the page displays and does not decide.
   See overview.py for the three rules it enforces, all of which are the same
   rule: a position that cannot be measured is excluded and counted, never
   measured as zero. */

const OV = D.overview || {};

// Colour by return since purchase. The four plotted colours were chosen for
// colour-vision deficiency and the palette block says not to hand-tune them,
// so this mixes --pos/--neg into the plane rather than inventing a ramp.
// Saturation saturates at TONE_CAP: past it, more green stops meaning more.
const TONE_CAP = 25;
// A position with no cost basis has no return. Drawn neutral, not green.
const tone = (p) => p == null ? 'var(--surface-2)'
  : `color-mix(in srgb, var(--${p < 0 ? 'neg' : 'pos'}) ${
      Math.round(14 + Math.min(Math.abs(p), TONE_CAP) / TONE_CAP * 52)
    }%, var(--plane))`;

const card = (title, right, body, extra) =>
  `<section class="card ${extra || ''}"><h3><span>${esc(title)}</span>`
  + (right ? `<span class="rt">${right}</span>` : '')
  + `</h3>${body}</section>`;

// A way from a card to the drawer section that holds its full table.
const goLink = (sec, label) =>
  `<button class="golink" data-go="${esc(sec)}">${esc(label)} &rarr;</button>`;

// Which position a flag is about. The key carries the ticker second
// (`trigger-hit:ERIC-B.ST`); failing that, the longest held or watched symbol
// named anywhere in the key or title - the same rule alertsFor matches on, run
// the other way.
function symOfAlert(a) {
  const k = String(a.key || '').split(':')[1];
  if (k && ROWSYM.has(k)) return k;
  const text = String(a.key || '') + ' ' + String(a.title || '');
  let best = null;
  for (const r of ROWS)
    if (text.includes(r.sym) && (!best || r.sym.length > best.length)) best = r.sym;
  return best;
}

const stat = (k, v, s) => `<div class="stat"><div class="k">${esc(k)}</div>
  <div class="v">${v}</div><div class="s">${s || ''}</div></div>`;

// Composition bars, reusing .xrow and its cross-filter attributes so a sector
// clicked here means the same thing as a sector clicked in the data sheet.
const ovbars = (rows, kind, limit) => (rows || []).slice(0, limit).map((r) => {
  const w = Math.max(0, Math.min(100, r.pct || 0));
  return `<div class="xrow" data-fk="${kind}" data-fv="${esc(r.key)}"
    data-fl="${esc(r.label || r.key)}">
    <div class="n" title="${esc(r.label || r.key)}">${esc(r.label || r.key)}</div>
    <div class="t"><i class="f" style="width:${w}%"></i></div>
    <div class="p">${num(r.pct, 1)}%</div></div>`;
}).join('');

// A ranked list with a diverging magnitude bar, scaled to the largest row in
// the card. That is the right scale here because the question is "which of
// these is biggest", not "what share of the whole is this".
const lrows = (rows, get, fmt, note) => {
  if (!rows || !rows.length) return '<div class="lnote">Nothing to show.</div>';
  const max = Math.max(...rows.map((r) => Math.abs(get(r) || 0)), 1e-9);
  return rows.map((r) => {
    const v = get(r) || 0;
    const clickable = r.sym && ROWSYM.has(r.sym);
    return `<div class="lrow ${clickable ? 'click' : ''}"
      ${clickable ? `data-sym="${esc(r.sym)}"` : ''}
      title="${esc(r.name || r.ticker || '')}${note ? ' — ' + note(r) : ''}">
      <div class="t">${esc(r.ticker || r.sym || '—')}</div>
      <div class="track"><span class="mid"></span>
        <i class="${v < 0 ? 'n' : 'p'}" style="width:${
          Math.abs(v) / max * 50}%"></i></div>
      <div class="v ${cls(v)}">${fmt(r)}</div></div>`;
  }).join('');
};

function paintOverview() {
  const t = OV.totals || {}, day = OV.day || {}, alloc = OV.allocation || {};
  const X = D.exposure || {}, con = OV.contributors || {}, mv = OV.movers || {};
  const cal = (D.reporting || {}).calendar || {};
  const conc = X.concentration || {};

  // Three, not four. The fourth was Book value, which was the tape's big number
  // reprinted underneath the tape - the same euros twice on one screen. What it
  // carried that the tape does not (the name count and the cost basis) moved
  // into the P/L subtitle, which is where "against what it cost" belongs.
  $('#ovtop').innerHTML = [
    stat('Total P/L', `<span class="${cls(t.pl_eur)}">${eur(t.pl_eur)}</span>`,
      `${pct(t.pl_pct)} against ${eur(t.cost_eur)} of cost across ${
        OV.n || 0} names`),
    stat('Annualised', t.irr_pct == null ? '—'
      : `<span class="${cls(t.irr_pct)}">${pct(t.irr_pct, 1)}</span>`,
      (t.irr_since ? `money-weighted since ${esc(t.irr_since)}`
                   : esc(t.irr_note || 'not computed'))
      + atBuild('a money-weighted return needs the dated lot cashflows, which '
                + 'are not carried in this page')),
    // The quiet count is the honest part of this stat: it says how much of the
    // book had no previous close and is therefore absent from the move rather
    // than sitting inside it as a zero.
    stat('Today', day.pct == null ? '—'
      : `<span class="${cls(day.pct)}">${pct(day.pct)}</span>`,
      day.pct == null ? 'no position has a previous close'
        : `${eur(day.value_eur)} · ${num(day.covered_pct, 0)}% of the book priced`
          + (day.n_quiet ? ` · ${day.n_quiet} without a close` : '')),
  ].join('');

  // No size class here. Which labels fit is a pixel question and this runs
  // before the box has been laid out; fitTiles answers it afterwards, against
  // the box's real width. See below.
  const tiles = (alloc.tiles || []).map((k) => {
    const clickable = k.sym && ROWSYM.has(k.sym);
    return `<div class="tile" ${clickable
        ? `data-sym="${esc(k.sym)}"` : ''}
      style="left:${k.x}%;top:${k.y}%;width:${k.w}%;height:${k.h}%;
             background:${tone(k.pl_pct)}"
      title="${esc(k.name || k.ticker)} · ${eur(k.value_eur)} · ${
        num(k.weight_pct, 1)}% of book · ${pct(k.pl_pct)} since purchase">
      <div class="tt">${esc(k.ticker)}</div>
      <div class="tw">${num(k.weight_pct, 1)}% · ${pct(k.pl_pct)}</div></div>`;
  }).join('');
  // Sampled from tone() rather than listed, so the key cannot drift from the
  // function the tiles are actually painted with.
  const ramp = Array.from({length: 17}, (_, i) => {
    const f = i / 16;
    return `${tone(-TONE_CAP + f * 2 * TONE_CAP)} ${(f * 100).toFixed(1)}%`;
  }).join(',');

  const cards = [];

  // An empty treemap used to render as a bare grey rectangle, which reads as a
  // chart that failed rather than a book with nothing in it. The key goes with
  // it: there is no colour scale to explain when there is nothing coloured.
  cards.push(card('Allocation', `${alloc.n || 0} positions`,
    tiles
      ? `<div class="tmap">${tiles}</div>
     <div class="tmapkey"><span>Area is weight, colour is return since
       purchase</span><span>−${TONE_CAP}%</span><span class="ramp"
       style="background:linear-gradient(90deg,${ramp})"></span
       ><span>+${TONE_CAP}%</span>
       ${alloc.n_undrawn ? `<span>${alloc.n_undrawn} position${
         alloc.n_undrawn === 1 ? '' : 's'} not drawn</span>` : ''}</div>`
      : `<div class="tmap empty">Nothing to draw${alloc.n_undrawn
          ? `: ${alloc.n_undrawn} position${alloc.n_undrawn === 1 ? '' : 's'}
             carry no market value` : '. No position carries a market value'}
         .</div>`,
    'ov-8'));

  // Beside the treemap, not below it. The picture shows how the book is spread
  // and these four numbers say how spread that actually is - read together or
  // not at all. Flags follows because an exception is worth more than a
  // breakdown, and it used to sit last, alone, under the calendar.
  cards.push(card('Concentration', `${conc.n || 0} names`,
    `<dl class="kv">
      <dt>Largest position</dt><dd>${num(conc.top1_pct, 1)}%</dd>
      <dt>Top five</dt><dd>${num(conc.top5_pct, 1)}%</dd>
      <dt>Top ten</dt><dd>${num(conc.top10_pct, 1)}%</dd>
      <dt>Effective positions</dt><dd>${num(conc.effective_n, 1)}</dd>
    </dl>
    <div class="lnote">Effective positions is 1/HHI: the number of equally
      sized holdings that would concentrate the book as much as this one is.
      ${num(conc.effective_n, 1)} against ${conc.n || 0} held.</div>`
    + goLink('exp', 'Full exposure breakdown')));

  const flags = (D.alerts || []);
  cards.push(card('Flags', `${flags.length}`,
    flags.length
      ? flags.slice(0, 8).map((a) => {
          // A flag names a position; clicking it opens that position. A flag
          // about the whole book (coverage, health) has no chart to open and
          // stays plain text rather than a link that goes nowhere.
          const s = symOfAlert(a);
          return `<div class="alert${s ? ' click' : ''}"${
            s ? ` data-sym="${esc(s)}"` : ''}>
          <span class="dot" style="background:${
            LEVEL[a.level] || 'var(--muted)'}"></span>
          <span><div class="t">${esc(a.title)}</div>
          <div class="d" title="${esc(a.detail)}">${esc(a.detail)}</div>
          </span></div>`;
        }).join('')
        + goLink('flag', flags.length > 8
          ? `All ${flags.length} flags (${flags.length - 8} more)` : 'All flags')
      : '<div class="lnote">Nothing tripped a threshold.</div>'));

  cards.push(card('What made the money',
    con.n_unknown ? `${con.n_known} of ${con.n_known + con.n_unknown} priced`
                  : `${con.n_known} positions`,
    lrows((con.best || []).concat(con.worst || []), (r) => r.pl_eur,
      (r) => eur(r.pl_eur), (r) => `${num(r.share_pct, 1)}% of gross movement`)
    + `<div class="lnote">Attributed in euros, not percent. A 60% gain on the
       smallest position is a rounding error; 12% on the largest one is the
       year.${con.n_unknown ? ` ${con.n_unknown} position${
         con.n_unknown === 1 ? ' has' : 's have'} no cost basis and cannot be
       attributed.` : ''}</div>`));

  // "Today's movers", not "Today" - the headline stat two rows above is
  // already called Today and is the book's single day number. Two things on
  // one screen under one word, meaning different things.
  cards.push(card("Today's movers", mv.n_quiet ? `${mv.n_priced} priced, ${
      mv.n_quiet} quiet` : `${mv.n_priced} priced`,
    lrows((mv.up || []).concat(mv.down || []), (r) => r.day_pct,
      (r) => pct(r.day_pct), (r) => eur(r.day_eur))));

  cards.push(card('Sector', X.sectors
      ? `${num(X.sectors.resolved_pct, 0)}% resolved` : '',
    ovbars((X.sectors || {}).rows, 'sector', 8)
    + `<div class="lnote">Look-through: a fund's sleeve is spread across its
       disclosed constituents. Yahoo publishes ten per fund, so this names
       ${num((X.sectors || {}).resolved_pct, 0)}% of the book.</div>`,
    'ov-6'));

  cards.push(card('Geography', X.geography
      ? `${num(X.geography.resolved_pct, 0)}% resolved` : '',
    ovbars((X.geography || {}).rows, 'country', 8),
    'ov-6'));

  // The legend is derived from the pills actually rendered, not from cal.rows.
  // The strip is capped at twelve, and a legend naming a year that only appears
  // in row thirteen would be describing something nobody can see.
  const shown = (cal.rows || []).slice(0, 12);
  const years = [...new Set(shown.map((r) => String(r.date).slice(0, 4)))].sort();
  cards.push(card('Next prints', cal.n
      ? `${cal.n} in ${cal.horizon_days} days · ${num(cal.pct_ahead, 0)}% of book`
      : 'none scheduled',
    (shown.length
      ? `<div class="cstrip">${shown.map((r) =>
          `<div class="cpill ${r.soon ? 'soon' : ''}${
               ROWSYM.has(r.symbol) ? ' click" data-sym="' + esc(r.symbol) : ''}"
             title="${esc(r.name || '')} · ${esc(String(r.date))}${
               r.estimated ? ' (estimated by Yahoo, not confirmed by the company)'
                           : ''}">
            <div class="d">${esc(String(r.date).slice(5))}${
              r.estimated ? ' ~' : ''}</div>
            <div class="t">${esc(r.symbol)}</div>
            <div class="w">${num(r.weight_pct, 1)}%</div></div>`).join('')}</div>`
        // The pills are MM-DD, so the year has to be stated once or a date in
        // January is ambiguous inside a horizon that crosses one. And a tilde
        // that nothing explains is just a typo the reader has to forgive.
        + `<div class="lnote">Dates are ${esc(years.join('–'))}, shown as
           month-day.${shown.some((r) => r.estimated)
            ? ' A ~ marks a date Yahoo estimated rather than one the company has'
              + ' confirmed.' : ''}${shown.length < (cal.rows || []).length
            ? ` ${(cal.rows || []).length - shown.length} further date${
                (cal.rows || []).length - shown.length === 1 ? '' : 's'} in the
              horizon are not drawn.` : ''}</div>`
      : '<div class="lnote">No dated results in the horizon.</div>')
    + (cal.n_unknown ? `<div class="lnote">${cal.n_unknown} stock${
        cal.n_unknown === 1 ? ' has' : 's have'} no date from Yahoo. A missing
        date is missing, not "nothing due".</div>` : ''),
    'ov-12'));

  $('#ovgrid').innerHTML = cards.join('');
  watchTiles($('#ovgrid').querySelector('.tmap'));
}

// Decide which tile labels fit, in pixels, against the box as it was actually
// laid out. This used to be decided at build time from the tile's percentage
// of the treemap - but a percentage is not a size. The same 4.5%-wide tile is
// 54px across in a 1210px box and 33px in a 728px one, and the build-time rule
// gave both of them the same label because it could only see the 4.5.
//
// Nothing here is a chosen threshold: a hidden probe tile carrying the longest
// label a real tile could carry is measured through the live CSS, so the
// numbers come from the type scale rather than from an estimate of it.
function fitTiles(box) {
  const tiles = box ? [...box.querySelectorAll('.tile')] : [];
  if (!tiles.length || !box.clientWidth || !box.clientHeight) return;

  const probe = document.createElement('div');
  probe.className = 'tile';
  probe.style.cssText = 'visibility:hidden;left:0;top:0;width:auto;height:auto';
  probe.innerHTML = '<div class="tt">MMMM</div>'
    + '<div class="tw">88.8% · −88.8%</div>';
  box.appendChild(probe);
  const hBoth = probe.offsetHeight, wBoth = probe.offsetWidth;
  probe.querySelector('.tw').remove();
  const hOne = probe.offsetHeight, wOne = probe.offsetWidth;
  probe.remove();

  for (const t of tiles) {
    const w = t.offsetWidth, h = t.offsetHeight;
    const one = h < hBoth || w < wBoth;   // no room for the weight line
    const none = h < hOne || w < wOne;    // no room for the ticker either
    t.classList.toggle('sm', one && !none);
    t.classList.toggle('xs', none);
  }
}

// Measure now, and again on every resize. Now, because a ResizeObserver's
// first delivery is a frame away and frames are throttled in a background tab
// - the same trap paintChart documents, and it bites here too: observed with
// the box at 880x377, the initial callback never arrived and every tile kept
// the full label it had no room for. The observer is for what happens after.
let TILEOBS = null;
function watchTiles(box) {
  if (TILEOBS) { TILEOBS.disconnect(); TILEOBS = null; }
  if (!box) return;
  fitTiles(box);
  if (typeof ResizeObserver === 'undefined') return;
  TILEOBS = new ResizeObserver(() => fitTiles(box));
  TILEOBS.observe(box);
}

/* ---------------------------------------------------------------- wiring */

// Which surface is up. The chart measures its container when it is drawn and
// can never re-measure afterwards, so paintChart refuses to build one into a
// hidden box. That refusal is only safe because of the call below: un-hide
// first, then paint, so the construction that was skipped at boot happens here
// against a container that has a real width. Do not reorder these two.
function setView(v) {
  state.view = v;
  for (const n of document.querySelectorAll('#vnav .vbtn[data-view]'))
    n.setAttribute('aria-pressed', String(n.getAttribute('data-view') === v));
  const o = $('#v-overview'), p = $('#v-positions');
  if (o) o.hidden = v !== 'overview';
  if (p) p.hidden = v !== 'positions';
  if (v === 'positions') {
    const r = ROWS.find((x) => x.sym === state.sym);
    if (r) paintChart(r);
  }
  paintCrumb();
  syncHash();
}

// What the drawer is sitting on top of. Both the crumb and the back button read
// from state.view rather than from each other, so they cannot disagree about
// where closing the drawer will land you.
const VIEWNAME = {overview: 'Overview', positions: 'Positions'};
function paintCrumb() {
  const under = VIEWNAME[state.view] || 'Overview';
  const c = $('#t-crumb');
  if (c) c.textContent = 'over ' + under;
  const b = $('#t-close');
  if (b) b.textContent = 'Back to ' + under;
}

function select(sym) {
  if (!sym) return;
  state.sym = sym;
  const r = ROWS.find((x) => x.sym === sym);
  if (!r) return;
  paintRail(); paintHead(r); paintThesis(r); paintStrip(); paintChart(r);
  // Replace, never push. The arrow keys walk the rail one name at a time, and
  // pushing per step would bury the previous surface under twenty entries.
  syncHash();
}

function on(sel, ev, fn) { const n = $(sel); if (n) n.addEventListener(ev, fn); }

on('#list', 'click', (e) => {
  const row = e.target && e.target.closest && e.target.closest('.row');
  if (row) select(row.getAttribute('data-sym'));
});
on('#bars', 'click', (e) => {
  const bar = e.target && e.target.closest && e.target.closest('.bar');
  if (bar) select(bar.getAttribute('data-sym'));
});
on('#segs', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.seg');
  if (!b) return;
  state.filter = b.getAttribute('data-f');
  const all = document.querySelectorAll('#segs .seg');
  for (const n of all) n.setAttribute('aria-pressed', String(n === b));
  paintRail();
});
on('#ranges', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.rbtn');
  if (!b) return;
  const p = b.getAttribute('data-ma');
  if (p) {
    // MA buttons toggle independently; range buttons are mutually exclusive.
    // Sharing one handler means sharing one repaint, but not one selection rule.
    state.ma[p] = !state.ma[p];
    b.setAttribute('aria-pressed', String(state.ma[p]));
  } else {
    state.days = Number(b.getAttribute('data-d'));
    for (const n of document.querySelectorAll('#ranges .rbtn[data-d]'))
      n.setAttribute('aria-pressed', String(n === b));
  }
  const r = ROWS.find((x) => x.sym === state.sym);
  if (r) paintChart(r);
});
on('#q', 'input', (e) => { state.q = e.target.value || ''; paintRail(); });

/* ------------------------------------------------------------------ routing
 *
 * The page had no URL state at all: reloading always dropped you back on the
 * Overview, the browser's back button left the page entirely from wherever you
 * were, and a drawer three sections deep could not be linked or returned to.
 *
 * The route is two axes, not one. A view is where you are; the drawer is a
 * thing on top of it. So the drawer gets its own hash rather than being
 * encoded into the view's - `#/data/flag` says the drawer is up at Flags, and
 * back from it returns to whatever view was underneath. Opening the drawer
 * pushes; everything else replaces, because only the drawer is a place you
 * would want to come back from.
 *
 * Opened from disk there is no history to speak of and pushState throws on
 * some file: URLs, so every write is wrapped and falls back to assigning the
 * hash, which works everywhere and simply does not give you back.
 */
let SHEET = false;        // is the drawer up
let SHEETPUSHED = false;  // did opening it leave an entry we can go back over
let SHEETSCROLL = 0;      // display:none resets scrollTop; this survives it
let ROUTING = false;      // applying a route must never write one back

function routeOf() {
  if (SHEET) return '#/data' + (SS.at ? '/' + SS.at : '');
  if (state.view === 'positions' && state.sym) return '#/positions/' + state.sym;
  return '#/' + (state.view || 'overview');
}

function syncHash(push) {
  if (ROUTING) return;
  const r = routeOf();
  if (location.hash === r) return;
  try {
    if (push && history.pushState) history.pushState(null, '', r);
    else if (history.replaceState) history.replaceState(null, '', r);
    else location.hash = r;
  } catch (e) { try { location.hash = r; } catch (e2) {} }
}

// Reading is deliberately forgiving. A hash that names a symbol we do not hold
// any more - an old bookmark, a sold position - lands on the view without the
// symbol rather than on a blank screen or an exception.
function applyHash() {
  const parts = String(location.hash || '').replace(/^#\/?/, '').split('/')
    .filter(Boolean);
  ROUTING = true;
  try {
    const head = (parts[0] || 'overview').toLowerCase();
    if (head === 'data') {
      const sec = parts[1];
      if (sec) SS.at = sec;
      sheetOpen(true);
      if (sec) gotoSection(sec);
      return;
    }
    sheetOpen(false);
    if (head === 'positions') {
      setView('positions');
      if (parts[1] && ROWSYM.has(parts[1])) select(parts[1]);
    } else {
      setView('overview');
    }
  } finally { ROUTING = false; }
}

function sheetOpen(open) {
  const s = $('#sheet');
  if (!s) return;
  open = !!open;
  if (open === SHEET) return;
  if (!open) SHEETSCROLL = s.scrollTop || 0;
  SHEET = open;
  if (open) s.setAttribute('data-open', '1'); else s.removeAttribute('data-open');
  // aria-expanded, not aria-pressed. The button does not select a surface the
  // way a tab does; it reveals one. A bar clicked on the Overview opens the
  // drawer too, and a trigger that stayed collapsed through that would be
  // lying about what is on screen.
  const b = $('#t-sheet');
  if (b) b.setAttribute('aria-expanded', String(open));
  if (open) {
    // Restoring after the box is displayed, because a hidden element cannot be
    // scrolled. Coming back to the drawer at the top of a twelve-section
    // document, having just been two thirds of the way down it, reads as the
    // page having lost your place - which it had.
    s.scrollTop = SHEETSCROLL;
    paintCrumb();
  }
  if (open) { syncHash(true); SHEETPUSHED = !ROUTING; }
  else { syncHash(); SHEETPUSHED = false; }
}

function gotoSection(id) {
  // Jumping to a collapsed section opens it. Scrolling someone to a heading
  // with nothing under it is the navigation equivalent of a dead link.
  SS.at = id;
  SS.shut[id] = false;
  paintSheet();
  const head = $(`#sheetbody h2[data-sec="${id}"]`);
  const box = $('#sheet');
  if (!head || !box) return;
  // This used to be scrollIntoView({behavior:'smooth'}), which on this
  // container is a silent no-op - measured: the identical call without
  // `behavior` lands on the heading, with it the scrollTop never moves at all.
  // So every jump in this nav has only ever expanded the section, and the
  // reader was left at the top of an eleven-thousand-pixel document wondering
  // what the click did. Nothing threw and nothing logged.
  //
  // Scrolling the box by measurement instead. The sticky nav is subtracted
  // because it covers the top of the scrollport, and a heading scrolled to
  // exactly 0 lands underneath it.
  const nav = $('#sheetnav');
  const GAP = 8;
  const top = box.scrollTop + head.getBoundingClientRect().top
    - box.getBoundingClientRect().top
    - (nav ? nav.getBoundingClientRect().height : 0) - GAP;
  box.scrollTop = Math.max(0, top);
}

// The drawer, opened at one section. Order matters: the box has to be showing
// before gotoSection can measure where the heading sits.
function openSection(id) {
  sheetOpen(true);
  gotoSection(id);
  syncHash();
}

on('#t-sheet', 'click', () => sheetOpen(!SHEET));
// Back over the entry that opening the drawer pushed, so the browser's own
// back button and this one do the same thing rather than two similar things.
on('#t-close', 'click', () => {
  if (SHEETPUSHED && history.back) history.back(); else sheetOpen(false);
});
try { window.addEventListener('popstate', applyHash); } catch (e) {}
try { window.addEventListener('hashchange', applyHash); } catch (e) {}

/* -------------------------------------------------- the sheet, as a surface */

// Picking up a bucket from a bar or a fund row. The same key is written for
// every kind so the tables can filter on one rule; `kindLabel` is what the
// chip says, because "Sector Technology" reads and "sector technology" does
// not. Clicking the live filter again clears it - a toggle, not a trap.
const setFilter = (kind, key, label, kindLabel) => {
  const cur = SS.filter;
  SS.filter = (cur && cur.kind === kind && cur.key === key)
    ? null : {kind, key, label, kindLabel};
  paintSheet();
};

// Open a symbol in the main view. The sheet closes, because leaving it up
// would hide the chart the click just asked for.
const jump = (sym) => {
  if (!sym || !ROWSYM.has(sym)) return;
  sheetOpen(false);
  // Switching the view here rather than at each call site. A symbol clicked in
  // the drawer used to close it onto whichever view was underneath - so from
  // the Overview you asked for a chart and got the Overview back, with the
  // selection changed somewhere you could not see. The Overview's own handler
  // set the view itself, which is why it looked like it worked.
  setView('positions');
  select(sym);
};

on('#vnav', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.vbtn');
  // The data-view guard outlived the button it was written for - Data is no
  // longer in this nav - but it stays: the nav is now exactly the set of real
  // views, and this is what keeps that true if anything else is ever put here.
  if (b && b.getAttribute('data-view')) setView(b.getAttribute('data-view'));
});

// Every clickable thing on the Overview leads somewhere specific. A tile or a
// ranked row opens that position; a composition bar opens the data sheet
// already filtered to it. An overview whose charts are only pictures is the
// glorified list this view exists to replace.
on('#ovgrid', 'click', (e) => {
  const t = e.target;
  if (!t || !t.closest) return;
  const go = t.closest('[data-go]');
  if (go) { openSection(go.getAttribute('data-go')); return; }
  const bar = t.closest('.xrow[data-fk]');
  if (bar) {
    const kind = bar.getAttribute('data-fk');
    sheetOpen(true);
    return setFilter(kind, bar.getAttribute('data-fv'),
      bar.getAttribute('data-fl'),
      {sector: 'Sector', country: 'Geography', industry: 'Industry'}[kind] || '');
  }
  const node = t.closest('[data-sym]');
  if (node) jump(node.getAttribute('data-sym'));   // jump() sets the view now
});

on('#sheetnav', 'click', (e) => {
  if (!e.target || !e.target.closest) return;
  if (e.target.closest('#xclear')) { SS.filter = null; return paintSheet(); }
  const b = e.target.closest('.navb');
  if (!b) return;
  gotoSection(b.getAttribute('data-go'));
  syncHash();
});

on('#sheetbody', 'click', (e) => {
  const t = e.target;
  if (!t || !t.closest) return;

  const head = t.closest('th.s');
  if (head) {
    const table = head.getAttribute('data-t'), k = head.getAttribute('data-k');
    const cur = SS.sort[table];
    SS.sort[table] = (cur && cur.k === k)
      ? {k, dir: -cur.dir}
      : {k, dir: Number(head.getAttribute('data-d0')) || -1};
    return paintSheet();
  }

  const h2 = t.closest('h2[data-sec]');
  if (h2) {
    const id = h2.getAttribute('data-sec');
    SS.shut[id] = !SS.shut[id];
    return paintSheet();
  }

  const bar = t.closest('.xrow[data-fk]');
  if (bar) return setFilter(bar.getAttribute('data-fk'),
    bar.getAttribute('data-fv'), bar.getAttribute('data-fl'),
    {sector: 'Sector', country: 'Geography', industry: 'Industry'}[
      bar.getAttribute('data-fk')] || '');

  const fund = t.closest('tr[data-fund]');
  if (fund) {
    const sym = fund.getAttribute('data-fund');
    return setFilter('fund', sym, sym, 'Inside');
  }

  const row = t.closest('[data-sym]');
  if (row) jump(row.getAttribute('data-sym'));
});

on('#xq', 'input', (e) => { SS.q = e.target.value || ''; paintSheet(); });

on('#xunits', 'click', (e) => {
  SS.units = SS.units === 'eur' ? 'pct' : 'eur';
  e.currentTarget.setAttribute('aria-pressed', String(SS.units === 'eur'));
  e.currentTarget.textContent = SS.units === 'eur' ? 'Show %' : 'Show €';
  paintSheet();
});

on('#xall', 'click', (e) => {
  const ids = [...document.querySelectorAll('#sheetbody h2[data-sec]')]
    .map((n) => n.getAttribute('data-sec'));
  const shutting = ids.some((id) => !SS.shut[id]);
  for (const id of ids) SS.shut[id] = shutting;
  e.currentTarget.setAttribute('aria-pressed', String(shutting));
  e.currentTarget.textContent = shutting ? 'Expand all' : 'Collapse all';
  paintSheet();
});

// The label said "Dark" and the markup hardcoded it, which was wrong twice
// over. On a machine whose OS prefers dark the page opened dark under a button
// offering to make it dark; and a one-word label never said whether it named
// the current state or the one click away. It names the action now, and it
// reads the state off what is actually rendered rather than off a default.
function isDark() {
  try {
    const set = document.documentElement.getAttribute('data-theme');
    if (set) return set === 'dark';
    return !!(window.matchMedia
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) { return false; }
}
function themeLabel() {
  const b = $('#t-theme');
  if (!b) return;
  const dark = isDark();
  b.setAttribute('aria-pressed', String(dark));
  b.textContent = dark ? 'Switch to light' : 'Switch to dark';
}

on('#t-theme', 'click', () => {
  try {
    document.documentElement.setAttribute('data-theme',
      isDark() ? 'light' : 'dark');
  } catch (e) {}
  themeLabel();
  retheme();
});

// Until the button is pressed the page follows the OS, so the OS changing mid
// session changes the page - and would leave the label describing the theme
// that was up when it loaded.
try {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onFlip = () => {
    if (document.documentElement.getAttribute('data-theme')) return;
    themeLabel();
    retheme();
  };
  if (mq.addEventListener) mq.addEventListener('change', onFlip);
  else if (mq.addListener) mq.addListener(onFlip);
} catch (e) {}

/* ------------------------------------------------------------ jump palette
 *
 * Built from what is on the page at the moment it opens, not from a list kept
 * alongside it: the names from ROWS (which the live layer rebuilds), the
 * sections from the drawer's own headings. A section added later shows up here
 * without anyone remembering to register it.
 */
const PAL = {items: [], i: 0};

function palAll() {
  const out = [
    {kind: 'View', label: 'Overview', sub: 'the book at a glance', go: () => {
      sheetOpen(false); setView('overview'); }},
    {kind: 'View', label: 'Positions', sub: 'rail, chart and thesis', go: () => {
      sheetOpen(false); setView('positions'); }},
  ];
  for (const n of document.querySelectorAll('#sheetbody h2[data-sec]')) {
    const id = n.getAttribute('data-sec');
    out.push({kind: 'Data', label: n.getAttribute('data-label') || id,
      sub: (n.textContent || '').replace(/\s+/g, ' ').trim(),
      go: () => openSection(id)});
  }
  for (const r of ROWS) {
    out.push({kind: r.isHeld ? 'Holding' : 'Watchlist', label: r.label,
      sub: r.company !== r.label ? r.company : '', level: r.worst,
      hay: r.sym, go: () => jump(r.sym)});
  }
  return out;
}

// Ranked, not just filtered: a ticker that starts with what you typed beats a
// company name that merely contains it, so "ab" finds ABB before Alphabet.
function palFilter(q) {
  q = q.trim().toLowerCase();
  const all = palAll();
  if (!q) return all;
  const scored = [];
  for (const it of all) {
    const l = it.label.toLowerCase(), h = String(it.hay || '').toLowerCase();
    const s = (it.sub || '').toLowerCase();
    const score = l.startsWith(q) || h.startsWith(q) ? 0
      : l.includes(q) || h.includes(q) ? 1 : s.includes(q) ? 2 : -1;
    if (score >= 0) scored.push([score, it]);
  }
  return scored.sort((a, b) => a[0] - b[0]).map((x) => x[1]);
}

function palPaint() {
  const box = $('#pallist');
  if (!box) return;
  box.innerHTML = PAL.items.length
    ? PAL.items.slice(0, 60).map((it, i) => `<button class="palrow" role="option"
        data-i="${i}" aria-selected="${i === PAL.i}"><span class="k">${
        esc(it.kind)}</span>${it.level ? `<span class="dot" style="background:${
        LEVEL[it.level] || 'var(--muted)'}"></span>` : ''}<b>${esc(it.label)}</b>
        <span class="s">${esc(it.sub || '')}</span></button>`).join('')
    : '<div class="palempty">Nothing by that name.</div>';
  const cur = box.querySelector && box.querySelector('[aria-selected="true"]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block: 'nearest'});
}

function palOpen(open) {
  const p = $('#pal');
  if (!p) return;
  p.hidden = !open;
  if (!open) return;
  const q = $('#palq');
  if (q) q.value = '';
  PAL.items = palFilter('');
  PAL.i = 0;
  palPaint();
  if (q && q.focus) q.focus();
}
const palIsOpen = () => { const p = $('#pal'); return !!p && !p.hidden; };

function palPick(i) {
  const it = PAL.items[i];
  palOpen(false);
  if (it) it.go();
}

on('#t-jump', 'click', () => palOpen(true));
on('#palq', 'input', (e) => {
  PAL.items = palFilter(e.target.value || '');
  PAL.i = 0;
  palPaint();
});
on('#palq', 'keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = Math.min(PAL.items.length, 60);
    if (n) PAL.i = (PAL.i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
    palPaint();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    palPick(PAL.i);
  }
});
on('#pallist', 'click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('.palrow');
  if (b) palPick(Number(b.getAttribute('data-i')));
});
// A click on the dimmed backdrop, outside the box, closes it.
on('#pal', 'click', (e) => { if (e.target === e.currentTarget) palOpen(false); });

// The keyboard map. Single keys only act when nothing is being typed into, so
// searching the rail for "D" does not throw the drawer open.
try {
  window.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      palOpen(!palIsOpen());
      return;
    }
    if (e.key === 'Escape') {
      if (palIsOpen()) { e.preventDefault(); palOpen(false); return; }
      if (SHEET) {
        e.preventDefault();
        if (SHEETPUSHED && history.back) history.back(); else sheetOpen(false);
        return;
      }
      if (typing && e.target.blur) e.target.blur();
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || palIsOpen()) return;
    if (e.key === '/') { e.preventDefault(); palOpen(true); return; }
    if (e.key === '1') { sheetOpen(false); setView('overview'); return; }
    if (e.key === '2') { sheetOpen(false); setView('positions'); return; }
    if (e.key === 'd' || e.key === 'D') { sheetOpen(!SHEET); return; }
  });
} catch (e) {}

// Arrow keys walk the rail. It is a terminal; hands should not have to leave
// the keyboard to step through twenty-three names.
try {
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (palIsOpen() || SHEET) return;
    const rows = visible();
    const i = rows.findIndex((r) => r.sym === state.sym);
    const next = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) { e.preventDefault(); select(next.sym); }
  });
} catch (e) {}

themeLabel();
paintTape();
paintOverview();
paintSheet();
// Positions is painted at boot even though Overview is what opens, so the
// first switch is instant. The rail, the head, the thesis and the weight strip
// all render fine into a hidden container because none of them measures
// anything. The chart is the exception and is deliberately NOT built here -
// see paintChart - so the first switch to Positions is what constructs it.
// ROUTING is held true across the first paint so none of it writes a route.
// Without the guard the boot select() below stamps #/overview into the address
// bar before applyHash ever reads it, and a cold load of a shared link lands
// on the Overview having just overwritten the link that asked for somewhere
// else. Build first, then read the URL, then stamp what we actually resolved.
ROUTING = true;
setView('overview');
if (ROWS.length) {
  select(state.sym);
} else {
  const l = $('#list');
  if (l) l.innerHTML = '<div class="empty">No positions and no watchlist rows.</div>';
}
ROUTING = false;
applyHash();
syncHash();

// --------------------------------------------------------------- live prices
//
// Everything above this line renders the file exactly as it was built. This
// block, and only this block, makes the page move on its own.
//
// It asks /api/quotes - an edge function on the same deployment, behind the
// same password gate - for current prices and FX, then rewrites the
// price-derived fields and repaints. The book itself (units, cost, accounts,
// theses, coverage) is untouched: those change when Nordnet is exported, not
// when a price ticks, and pretending otherwise would be the whole point of the
// exercise thrown away.
//
// Three rules it does not break:
//
//  - A holding the vendor could not price KEEPS its build-time price. It is
//    never zeroed, never carried at yesterday's close relabelled as today, and
//    it is COUNTED and shown in the tape. Absent is not zero.
//  - D.generated is never touched. The render clock is the evidence of how old
//    the underlying book is; the live clock sits next to it, not on top.
//  - A failed fetch is a visible state, not a silent no-op. `Live off` means
//    something different from no chip at all, and both mean something
//    different from a fresh timestamp.
(function liveLayer() {
  // Opened from disk there is no origin to call, and nothing is wrong with
  // that - the local file is the primary way this page is read. Stay silent
  // rather than showing a failure the reader cannot act on.
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;

  const POLL_MS = 60000;
  let LAST_OK = null;   // the last tick whose prices D was restated from
  const rows = (D.holdings || []).filter((h) => h.yahoo && h.yahoo !== 'MISSING');
  const wrows = (D.watchlist || []).filter((w) => w.yahoo && w.yahoo !== 'MISSING');
  if (!rows.length && !wrows.length) return;

  const symbols = [...new Set([...rows, ...wrows].map((r) => r.yahoo))];
  // What the live layer is even capable of asking about. A row filtered out
  // above - no Yahoo mapping, or mapped to MISSING - is never asked, so it must
  // never be marked stale: nothing refused it, and nothing was ever going to
  // move it. It reads `as at build`, which is the truth.
  for (const s of symbols) LIVEASK.add(s);
  // Held rows only. A watchlist row needs a price and a day move; it is not
  // valued in euro, so its currency needs no rate. Asking for one means the
  // response reports a currency as missing forever - the book carries a
  // watchlist entry whose ccy is literally "Other" - and a warning that is
  // always on is a warning nobody reads.
  const currencies = [...new Set(rows.map((r) => r.ccy).filter(Boolean))];

  // The render-time totals, kept so they are never simply lost to an
  // overwrite. Same reason the render clock survives.
  if (!D.totals_built) D.totals_built = Object.assign({}, D.totals);

  function applyQuotes(data) {
    const q = data.quotes || {};
    const fx = data.fx || {};
    const unpriced = [];
    // Refilled every tick, not accumulated: a symbol that missed last time and
    // priced this time has to be able to go back to saying so.
    LIVEMISS.clear();

    for (const h of rows) {
      const hit = q[h.yahoo];
      const rate = fx[h.ccy];
      // Both, or neither, and both positive.
      //
      // A price without its FX rate would be valued at the wrong scale, which
      // is worse than being a few minutes old. And the price is re-checked for
      // being a usable number HERE as well as in the endpoint, because this is
      // the side where a bad one becomes a euro figure on screen. A zero that
      // got past the endpoint would silently value the position at nothing,
      // and a zero rate would do the same to every row in that currency.
      if (!hit || !(hit.price > 0) || !(rate > 0)) {
        unpriced.push(h.yahoo);
        LIVEMISS.add(h.yahoo);
        continue;
      }
      h.price = hit.price;
      // Rounded to the cent HERE, exactly where analyse.value_holdings rounds
      // it, because everything downstream divides by it. Carry the unrounded
      // product into the weights and the totals and the page disagrees with
      // Python in the last digit across several dozen fields at once - all of
      // them individually defensible, none of them reconcilable.
      h.value_eur = Math.round(hit.price * (h.units || 0) * rate * 100) / 100;
      h.day_pct = hit.changePct;
      h.stale = false;
      h.live_asof = hit.asOf;
      // The chart's last candle, kept in its own map - see noteLiveBar. Called
      // for every symbol that priced, not only the one on screen, so switching
      // rows shows a current candle immediately instead of one that catches up
      // on the next tick.
      noteLiveBar(h.yahoo, hit);
      // Everything else a price implies - P/L, off_high, the broker check, the
      // weights, the treemap, coverage, the watchlist upsides - is DERIVE's
      // job, below. Patching a field here as well is how the page ended up
      // with two prices for one holding in the first place.
    }

    for (const w of wrows) {
      const hit = q[w.yahoo];
      // Same guard, same reason. A watchlist miss is not counted in the tape's
      // `n unpriced` - it costs the reader no euros - but it still has to mark
      // its own price, or a frozen watchlist column looks exactly like a live
      // one that has not moved today.
      if (!hit || !(hit.price > 0)) { LIVEMISS.add(w.yahoo); continue; }
      // price_now is the field the rest of the page reads: `w.price` does not
      // exist in the payload, so writing to it updated nothing and failed
      // silently - the watchlist has no euro value to look wrong, so a dead
      // write there shows up as a column that simply never moves.
      //
      // Scaled into the board's unit by the factor Python chose at build
      // (analyse.board_scale): a Johannesburg quote arrives in cents against a
      // board written in rand, and read raw it is a 100x move.
      w.price_now = hit.price * (w.price_scale || 1);
      w.day_pct = hit.changePct;
      w.live_asof = hit.asOf;
      // A watchlist row has a chart too, and it is the surface the thesis is
      // argued against. It gets the same live candle for the same reason.
      noteLiveBar(w.yahoo, hit);
    }

    // One call, one source of truth. Every price-derived number in D is
    // recomputed from D.holdings by the same code that was proved against
    // Python's own output at boot - rather than by a second, shorter, subtly
    // different sum written here.
    DERIVE.all();

    LIVE = {
      at: new Date(),
      asked: symbols.length,
      priced: Object.keys(q).length,
      // Held positions only. An unpriced watchlist row costs the reader
      // nothing; an unpriced holding is a number in the total that did not
      // move with the others, and that is worth saying out loud.
      missing: unpriced,
      fxMissing: data.fxMissing || [],
      error: null,
    };
    LAST_OK = LIVE;

    foldHoldings();
    buildRows();
    repaint();
  }

  function repaint() {
    try {
      paintTape();
      paintOverview();
      paintSheet();
      if (typeof ROWS !== 'undefined' && ROWS.length && state && state.sym) {
        select(state.sym);
      }
    } catch (e) {
      // A repaint that throws must not leave a half-updated page claiming to
      // be live.
      LIVE = {at: new Date(), asked: symbols.length, priced: 0, missing: [],
        fxMissing: [], error: 'repaint failed: ' + (e && e.message)};
      try { paintTape(); } catch (e2) {}
    }
  }

  let inflight = false;
  async function tick() {
    if (inflight) return;
    inflight = true;
    try {
      const r = await fetch('/api/quotes', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({symbols, currencies}),
      });
      if (!r.ok) throw new Error('quotes endpoint returned ' + r.status);
      applyQuotes(await r.json());
    } catch (e) {
      const why = (e && e.message) || 'live prices unavailable';
      // After a good tick, D already holds that tick's prices and keeps them.
      // Saying `off` then made every mark read `as at build` over numbers
      // that were not the build's, and the candle snapped back while the
      // price beside it did not.
      LIVE = LAST_OK
        ? Object.assign({}, LAST_OK, {error: why, carried: true, failedAt: new Date()})
        : {at: new Date(), asked: symbols.length, priced: 0, missing: [],
           fxMissing: [], error: why};
      // The whole page, not just the tape. A tick that succeeded and then one
      // that failed used to leave every per-price freshness mark still reading
      // `live` while the chip above them read `off` - the page contradicting
      // itself about its own age. repaint() cannot recurse here: its own catch
      // only sets LIVE and paints the tape.
      try { foldHoldings(); buildRows(); repaint(); } catch (e2) {
        try { paintTape(); } catch (e3) {}
      }
    } finally {
      inflight = false;
    }
  }

  // Deliberately exposed. The interesting behaviour of this block is what it
  // does when the endpoint lies to it - an empty quote map, a zero price, a
  // missing FX rate, a 500 - and none of that is reachable from outside
  // without a handle to re-run the fetch under a stubbed `fetch`. A guard
  // nobody has killed on purpose is not a guard yet.
  //
  // It exposes no data the page is not already showing, and the page is behind
  // the password gate regardless.
  window.cockpitLive = {tick, state: () => LIVE};

  tick();
  // Polling a hidden tab burns the free tier's invocations to redraw something
  // nobody is looking at. Refresh on the way back instead.
  setInterval(() => {
    if (document.visibilityState === 'visible') tick();
  }, POLL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') tick();
  });
})();
</script>
